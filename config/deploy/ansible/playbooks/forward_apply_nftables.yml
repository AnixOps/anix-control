# Apply one panel forward with nftables (backend nftables_ansible).
#
# The panel renders the ruleset (extra var `nftables`, built by
# internal/service/forward_nftables_plan.go); files/v2b_forward_nft.sh replaces
# the forward's rules in the `inet v2b_forward` table in one nft transaction
# and removes it from the legacy IPv4-only `ip v2b_forward` table. The named
# counters fwd_<id>_<proto>_up/_down survive re-apply.
#
# Needs Linux >= 5.2 and nft >= 0.9.1 (NAT chains in an inet table).
- name: Apply V2Board forward nftables rules
  hosts: all
  gather_facts: false
  become: true
  pre_tasks:
    - name: Fail when no forward targets exist
      ansible.builtin.fail:
        msg: "forward {{ forward.id }} has no remote targets"
      when: (targets | default([])) | length == 0

    - name: Fail when the panel sent no nftables ruleset
      ansible.builtin.fail:
        msg: "forward {{ forward.id }}: the payload has no nftables ruleset; upgrade the panel or use the matching playbooks"
      when: (nftables | default({})).script | default('') | length == 0

    - name: Persist IPv4 forwarding
      ansible.builtin.lineinfile:
        path: /etc/sysctl.conf
        regexp: '^net.ipv4.ip_forward='
        line: net.ipv4.ip_forward=1
        create: true
        mode: "0644"

    - name: Enable IPv4 forwarding immediately
      ansible.builtin.command: sysctl -w net.ipv4.ip_forward=1
      changed_when: false

    # Only when the forward has an IPv6 target: turning on IPv6 forwarding
    # makes the kernel ignore router advertisements on interfaces with
    # accept_ra=1, which can drop a SLAAC default route.
    - name: Persist IPv6 forwarding
      ansible.builtin.lineinfile:
        path: /etc/sysctl.conf
        regexp: '^net.ipv6.conf.all.forwarding='
        line: net.ipv6.conf.all.forwarding=1
        create: true
        mode: "0644"
      when: nftables.ipv6 | default(false) | bool

    - name: Enable IPv6 forwarding immediately
      ansible.builtin.command: sysctl -w net.ipv6.conf.all.forwarding=1
      changed_when: false
      when: nftables.ipv6 | default(false) | bool

  tasks:
    - name: Create a temporary ruleset file
      ansible.builtin.tempfile:
        state: file
        suffix: .nft
      register: v2b_forward_ruleset

    - name: Apply the forward ruleset
      block:
        - name: Write the forward ruleset
          ansible.builtin.copy:
            content: "{{ nftables.script }}"
            dest: "{{ v2b_forward_ruleset.path }}"
            mode: "0600"

        - name: Replace the forward rules in one nft transaction
          ansible.builtin.script:
            cmd: "files/v2b_forward_nft.sh apply {{ forward.id | int }} {{ v2b_forward_ruleset.path }}"
            executable: /bin/bash
      always:
        - name: Remove the temporary ruleset file
          ansible.builtin.file:
            path: "{{ v2b_forward_ruleset.path }}"
            state: absent
