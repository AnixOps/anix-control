# Remove one panel forward from nftables (backend nftables_ansible): pause
# and delete. Cleans the forward from both the `inet v2b_forward` table and
# the legacy `ip v2b_forward` table. Pause keeps the named counters so the
# traffic totals continue after resume; delete removes them.
- name: Remove V2Board forward nftables rules
  hosts: all
  gather_facts: false
  become: true
  tasks:
    - name: Remove the forward rules in one nft transaction
      ansible.builtin.script:
        cmd: "files/v2b_forward_nft.sh remove {{ forward.id | int }}{{ ' delete-counters' if ((nftables | default({})).deleteCounters | default(runtimeAction | default('') == 'delete')) | bool else '' }}"
        executable: /bin/bash
