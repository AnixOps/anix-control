# Read the traffic counters of one panel forward (backend nftables_ansible).
#
# Prints one STATS_JSON line per protocol:
#   {"protocol":"tcp","upload":<bytes>,"download":<bytes>}
# upload is the ct original direction (client to target), download the reply
# direction. A forward that was not re-applied since the inet migration
# reports its legacy nat-chain counter as {"protocol":..,"bytes":..,"legacy":true}.
- name: Collect V2Board forward traffic stats (nftables)
  hosts: all
  gather_facts: false
  become: true
  tasks:
    - name: Read the forward counters
      ansible.builtin.script:
        cmd: "files/v2b_forward_nft.sh stats {{ forward.id | int }}"
        executable: /bin/bash
      register: v2b_forward_stats
      changed_when: false

    - name: Print STATS_JSON
      ansible.builtin.debug:
        msg: "{{ v2b_forward_stats.stdout_lines | select('search', '^STATS_JSON ') | list }}"
