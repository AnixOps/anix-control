server {
    listen 80;
    listen [::]:80;

    server_name sub.5555133.xyz;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }

    access_log /var/log/nginx/sub.5555133.xyz-http.access.log;
    error_log /var/log/nginx/sub.5555133.xyz-http.error.log;
}
