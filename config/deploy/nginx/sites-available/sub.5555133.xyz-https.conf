server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name sub.5555133.xyz;

    ssl_certificate /etc/nginx/ssl/sub.5555133.xyz.crt;
    ssl_certificate_key /etc/nginx/ssl/sub.5555133.xyz.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:subscription_tls:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Subscription-only domain: only expose /s/*
    location ^~ /s/ {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 300;
        proxy_send_timeout 300;
        proxy_read_timeout 300;
        send_timeout 300;
    }

    location = / {
        return 403;
    }

    location / {
        return 403;
    }

    access_log /var/log/nginx/sub.5555133.xyz-https.access.log;
    error_log /var/log/nginx/sub.5555133.xyz-https.error.log;
}
