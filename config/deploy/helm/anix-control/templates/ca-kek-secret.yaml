{{- /*
The CA key-encryption key (module_runtime.ca_kek), generated once. lookup
reads it back on upgrades; immutable makes a render without cluster access
(helm template, GitOps) fail to change it instead of rotating it; keep
survives helm uninstall, since the CA in the database stays sealed with it.
*/ -}}
{{- if and (eq (include "anix-control.caKekEnabled" .) "true") (not .Values.caKek.existingSecret) }}
{{- $name := include "anix-control.caKekSecretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $key := "" }}
{{- if and $existing $existing.data }}
{{- $key = index $existing.data "ca_kek" | default "" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "anix-control.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
immutable: true
data:
  ca_kek: {{ $key | default (randBytes 32 | b64enc) | quote }}
{{- end }}
