{{- if ne (int .Values.replicaCount) 1 }}
{{- fail "replicaCount must be 1: multi-replica Control is not supported yet (see docs/architecture/container-deployment.md)" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "anix-control.fullname" . }}
  labels:
    {{- include "anix-control.labels" . | nindent 4 }}
spec:
  replicas: 1
  # Never run two Control processes at once: background workers and plugin
  # hosts are single-instance until the multi-replica work lands.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "anix-control.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- if not .Values.secrets.existingSecret }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "anix-control.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "anix-control.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- if .Values.migrate.enabled }}
      initContainers:
        - name: migrate
          image: {{ include "anix-control.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["migrate"]
          envFrom:
            {{- include "anix-control.envFrom" . | nindent 12 }}
          env:
            {{- include "anix-control.env" . | trim | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            {{- include "anix-control.volumeMounts" . | nindent 12 }}
          {{- with .Values.migrate.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- end }}
      containers:
        - name: control
          image: {{ include "anix-control.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          envFrom:
            {{- include "anix-control.envFrom" . | nindent 12 }}
          env:
            {{- include "anix-control.env" . | trim | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: web
              containerPort: 3000
              protocol: TCP
            {{- if .Values.grpc.enabled }}
            - name: grpc
              containerPort: 50051
              protocol: TCP
            {{- end }}
          startupProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 4
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            {{- include "anix-control.volumeMounts" . | nindent 12 }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: {{ .Values.tmpVolume.sizeLimit }}
        - name: secrets
          secret:
            secretName: {{ include "anix-control.secretName" . }}
            defaultMode: 0440
            items:
              {{- range $key, $variable := .Values.secrets.files }}
              - key: {{ $key }}
                path: {{ $key }}
              {{- end }}
        {{- if .Values.ansible.existingSecret }}
        - name: ansible
          secret:
            secretName: {{ .Values.ansible.existingSecret }}
            defaultMode: 0440
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
