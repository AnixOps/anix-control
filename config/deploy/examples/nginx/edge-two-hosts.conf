# AnixOps Control behind nginx on a separate edge machine (B), with the panel
# on machine A: docs/guide/deploy-two-hosts.md.
#
# B holds every public certificate and terminates TLS. The web side goes to
# Control's plain listener on A. The nodes' gRPC also terminates here, and
# goes on to A's gRPC listener in plain HTTP/2, over the private network only.
# nginx passes the node's client certificate in x-anix-client-cert, and
# Control, which admits B's address only (grpc.edge_proxies), verifies it.
#
# Replace 10.0.0.1 with A's private address, and the names with yours. The
# two names resolve to B; grpc.<domain> must not be proxied by a CDN.

# Port 80: the ACME HTTP-01 answers for both names, the rest to https.
server {
    listen 80;
    server_name new-x.anixops.com grpc.new-x.anixops.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# The panel: the web, API, subscriptions and /install.sh.
server {
    listen 443 ssl http2;
    server_name new-x.anixops.com;

    ssl_certificate     /etc/letsencrypt/live/new-x.anixops.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/new-x.anixops.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://10.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        # Overwrite, never append: Control trusts these from B only
        # (server.trusted_proxies on A lists B's address).
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_read_timeout 120s;
    }
}

# The nodes' gRPC: TLS here, with this name's public certificate. The Agents
# present their client certificate; nginx forwards it without checking the
# chain (Control verifies it against its own CA).
server {
    listen 443 ssl http2;
    server_name grpc.new-x.anixops.com;

    ssl_certificate     /etc/letsencrypt/live/grpc.new-x.anixops.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/grpc.new-x.anixops.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Ask for the Agent's client certificate, but do not require one: an
    # enrolling Agent has none yet, and Control decides what it may do.
    ssl_verify_client optional_no_ca;

    location / {
        grpc_pass grpc://10.0.0.1:50051;

        # Overwrite what the client sent: the header is what Control reads.
        # Empty when the Agent presented no certificate.
        grpc_set_header x-anix-client-cert $ssl_client_escaped_cert;
        grpc_set_header x-forwarded-for    $remote_addr;

        # The Agent keeps one stream open for as long as it runs.
        grpc_read_timeout  1d;
        grpc_send_timeout  1d;
        client_body_timeout 1d;
        grpc_socket_keepalive on;
    }
}
