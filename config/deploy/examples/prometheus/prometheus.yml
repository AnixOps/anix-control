# Example scrape configuration for the Control /metrics endpoint. /metrics is
# unauthenticated: publish port 8080 only on a private interface.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files: []

scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # AnixOps Control API
  - job_name: 'anix-control-api'
    static_configs:
      - targets: ['127.0.0.1:8080']
    metrics_path: '/metrics'

  # Redis

  # PostgreSQL (requires postgres_exporter)
  # - job_name: 'postgres'
  #   static_configs:
  #     - targets: ['postgres-exporter:9187']
