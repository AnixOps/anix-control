# AnixOps Control Configuration - Production
# 生产环境配置文件

# 环境标识: development (开发), production (生产)
env: "production"

server:
  host: "0.0.0.0"
  port: 8080
  mode: "release"
  read_timeout: 30
  write_timeout: 30
  # 可信代理列表：只有来自这些反向代理的 X-Forwarded-For/Proto/Host 才会生效
  # Reverse proxies (IPs or CIDRs) whose X-Forwarded-For, X-Forwarded-Proto and
  # X-Forwarded-Host are honoured; from any other peer they are ignored.
  # Loopback covers an Nginx/Caddy on this host. Add a proxy on another host
  # by its address; [] trusts none. See docs/DEPLOYMENT.md "Reverse proxies".
  trusted_proxies:
    - "127.0.0.1/32"
    - "::1/128"
  # HTTP CORS and WebSocket Origin allowlist. Set this to your real panel/admin
  # origins when browsers connect from a different host.
  cors:
    allowed_origins: []
    allowed_methods: ["GET", "POST", "PUT", "DELETE", "OPTIONS", "PATCH"]
    allowed_headers: ["Content-Type", "Authorization", "X-API-Key"]
    allow_credentials: false
    max_age: 86400

# TLS/HTTPS 配置
# 方式一: 使用 Nginx 反代 (推荐) - 设置 enable: false
# 方式二: Go 原生 TLS - 设置 enable: true 并配置证书路径
tls:
  enable: false                               # 使用 Nginx 反代时设为 false
  cert_file: "/etc/ssl/certs/anix-control.crt"     # SSL 证书路径 (仅 enable: true 时需要)
  key_file: "/etc/ssl/private/anix-control.key"    # SSL 私钥路径 (仅 enable: true 时需要)
  domain: "your-domain.com"                   # 您的域名 (用于生成订阅链接等)

# 前端服务器配置
frontend:
  enable: true
  port: 3000         # 保持 3000 端口，通过 Nginx 反代到 80/443
  path: "web/public"

# 数据库配置 - 生产环境推荐使用 PostgreSQL
database:
  driver: "postgres"
  host: "127.0.0.1"
  port: 5432
  username: "anix_control"
  password: "your-secure-password"
  database: "anix_control"
  log_level: "error"          # 生产环境只记录错误
  max_idle_conns: 10
  max_open_conns: 100
  conn_max_lifetime: 3600

# 缓存配置 - 生产环境推荐使用 Redis
cache:
  driver: "redis"
  redis_host: "127.0.0.1"
  redis_port: 6379
  redis_password: ""
  redis_db: 0

log:
  level: "warn"               # 生产环境减少日志
  output: "file"
  file_path: "/var/log/anix-control/anix-control.log"
  max_size: 100
  max_backups: 30
  max_age: 30

jwt:
  secret: "CHANGE-THIS-TO-A-VERY-LONG-RANDOM-STRING-IN-PRODUCTION"
  expire: 86400

auth:
  login_rate_limit:
    enabled: true
    max_attempts: 6
    window_seconds: 300
    lockout_seconds: 600
  register_rate_limit:
    enabled: true
    max_attempts: 5
    window_seconds: 3600
    lockout_seconds: 3600
  registration:
    enabled: true
    require_invite: false
    allowed_email_domains: []
    blocked_email_domains: []

app:
  name: "AnixOps Control"
  version: "4.1.0-rc.4"
  # The installer must replace this with a generated value. Never ship a
  # reusable node credential in the production template.
  api_token: ""
  traffic_log_enable: true
  subscribe_path: "s"
  # Product edition (ANIX_CONTROL_APP_EDITION). "community" (the default)
  # hides orders, payments, coupons, affiliate/invite commission and plan
  # purchase; plans stay as free subscription templates. Set "commercial"
  # BEFORE upgrading an install that uses payments, orders or affiliate.
  edition: "community"

# Base64-encoded Ed25519 trust root for signed official plugin manifests.
plugins:
  # Official AnixOps Ed25519 release trust root (raw public key, base64).
  # Trust is pinned even while execution remains fail-closed below.
  official_public_key: "lvbhRmhzVbSAbrw3vm0k7vYqpEu4/dF/ZqVbp2gS7uM="
  # Set only for a fresh plugin-only deployment, using a root-owned directory
  # containing one official identity package release trio.
  identity_bootstrap_package_dir: ""
  control_execution_enabled: false
  control_poll_interval: "5s"
  control_host_runtime_dir: "/var/lib/anixops/plugin-hosts"
  control_host_artifact_dir: "/var/lib/anixops/plugin-artifacts"
  control_host_startup_timeout: "5s"
  control_host_request_timeout: "30s"
  control_host_websocket_session_timeout: "24h"
  # Package payload limits in bytes (0 or unset = 1 MiB; maximum 64 MiB).
  # The request limit bounds /api/v2 bodies the gateway forwards to a package
  # host (413 plugin_request_too_large). The response limit bounds package
  # response bodies at the package bridge, the package-host SDK, and the
  # kernel host client (502 plugin_response_too_large).
  # control_host_max_request_bytes: 1048576
  # control_host_max_response_bytes: 1048576
  dispatch_enabled: false
  dispatch_poll_interval: "5s"
  # Topology fan-out creates Agent plugin operations only when explicitly
  # enabled together with dispatch_enabled. Keep false until canary evidence.
  topology_execution_enabled: false
  topology_poll_interval: "5s"

forward_runtime:
  backend: "gost"
  jobs:
    poll_interval: "5s"
    idle_poll_interval: "30s"
    error_log_interval: "1m"
    batch_size: 10
    timeout_seconds: 120
  gost_stats:
    poll_interval: "30s"
    idle_poll_interval: "2m"
    error_log_interval: "5m"
  latency:
    poll_interval: "60s"
    idle_poll_interval: "60s"
    error_log_interval: "5m"
    dials: 5
    dial_timeout: "3s"
    concurrency: 16
    retention_days: 7
  nodex:
    base_url: "http://127.0.0.1:18081"
    # Configure a secret out-of-band before selecting the NodeX backend.
    token: ""
    timeout_seconds: 15
  clean_agent:
    public_url: ""
    heartbeat_interval_seconds: 10
    action_timeout_seconds: 120
    token_expire_seconds: 0
    legacy_bridge_enabled: false
  iptables_ansible:
    inventory: "config/deploy/ansible/inventory.ini"
    apply_playbook: "config/deploy/ansible/playbooks/forward_apply.yml"
    remove_playbook: "config/deploy/ansible/playbooks/forward_remove.yml"
    become: false
    extra_vars: {}
    command: ""
    working_dir: "config/deploy/ansible"
    target_pattern: "{{node.host}}"
    environment:
      ANSIBLE_CONFIG: "config/deploy/ansible/ansible.cfg"
    timeout_seconds: 120

# Node-facing gRPC server. Legacy unary Transport=grpc and the opt-in
# anix.agent.v1 Agent control stream share this listener.
# Do not expose plaintext port 50051 to the public Internet. Configure the TLS
# files below or put the service behind an HTTP/2-capable L4/gRPC proxy and a
# restrictive firewall.
grpc:
  enabled: false
  host: "0.0.0.0"
  port: 50051
  api_token: ""
  tls_cert_file: "config/tls/control.crt"
  tls_key_file: "config/tls/control.key"

# 默认管理员配置
admin:
  email: "admin@your-domain.com"
  password: ""  # 留空将自动生成
