# AnixOps Control Configuration - Production
# Production configuration. Replace every placeholder before startup.

# Strict production preflight is enabled by this value.
env: "production"

server:
  host: "0.0.0.0"
  port: 8080
  mode: "release"
  read_timeout: 30
  write_timeout: 30
  # Trusted reverse proxies used to derive the real client IP.
  # Only trust forwarded client IP headers from these reverse proxies/load balancers.
  # If the API is exposed directly, keep this list empty.
  trusted_proxies:
    - "127.0.0.1"
    - "172.30.0.10" # Bundled Compose Nginx address.
    # Add only the exact reverse proxy IP/CIDR used by your deployment.
  # HTTP CORS and WebSocket Origin allowlist. Set this to your real panel/admin
  # origins when browsers connect from a different host.
  cors:
    allowed_origins: []
    allowed_methods: ["GET", "POST", "PUT", "DELETE", "OPTIONS", "PATCH"]
    allowed_headers: ["Content-Type", "Authorization", "X-API-Key"]
    allow_credentials: false
    max_age: 86400

# Browser-facing TLS. The bundled Nginx profile terminates TLS, so the Go HTTP
# listener remains plaintext on the private container network.
tls:
  enable: false
  cert_file: "/etc/ssl/certs/anix-control.crt"
  key_file: "/etc/ssl/private/anix-control.key"
  domain: "your-domain.com"

# Frontend listener, reached through Nginx in the bundled Compose profile.
frontend:
  enable: true
  port: 3000
  path: "web/public"

# Durable production data store.
database:
  driver: "postgres"
  host: "db"
  port: 5432
  username: "anix_control"
  password: "REPLACE-WITH-AT-LEAST-32-RANDOM-CHARACTERS"
  database: "anix_control"
  log_level: "error"
  max_idle_conns: 10
  max_open_conns: 100
  conn_max_lifetime: 3600

# This release provides a process-local cache. Run one Control replica.
cache:
  driver: "memory"
  redis_host: ""
  redis_port: 0
  redis_password: ""
  redis_db: 0

log:
  level: "warn"
  output: "stdout"
  file_path: ""
  max_size: 100
  max_backups: 30
  max_age: 30

jwt:
  secret: "CHANGE-THIS-TO-A-VERY-LONG-RANDOM-STRING-IN-PRODUCTION"
  expire: 86400

auth:
  login_rate_limit:
    enabled: true
    max_attempts: 6
    window_seconds: 300
    lockout_seconds: 600
  register_rate_limit:
    enabled: true
    max_attempts: 5
    window_seconds: 3600
    lockout_seconds: 3600
  registration:
    enabled: false
    require_invite: true
    allowed_email_domains: []
    blocked_email_domains: []

app:
  name: "AnixOps Control"
  version: "4.0.0-alpha.7"
  # Public HTTPS origin used by operators, Agents and the external monitor.
  public_url: "https://control.example.com"
  # The installer must replace this with a generated value. Never ship a
  # reusable node credential in the production template.
  api_token: "REPLACE-WITH-AT-LEAST-32-RANDOM-CHARACTERS"
  traffic_log_enable: true
  subscribe_path: "s"

# Base64-encoded Ed25519 trust root for signed official plugin manifests.
plugins:
  # Official AnixOps Ed25519 release trust root (raw public key, base64).
  # Trust is pinned even while execution remains fail-closed below.
  official_public_key: "IaqXgif/OGydNv/mQHoyFmqOvzeplICaMZndrhqMG0M="
  control_execution_enabled: true
  control_poll_interval: "5s"
  dispatch_enabled: true
  dispatch_poll_interval: "5s"
  # Topology fan-out creates Agent plugin operations only when explicitly
  # enabled together with dispatch_enabled. Keep false until canary evidence.
  topology_execution_enabled: false
  topology_poll_interval: "5s"

forward_runtime:
  backend: "gost"
  jobs:
    poll_interval: "5s"
    idle_poll_interval: "30s"
    error_log_interval: "1m"
    batch_size: 10
    timeout_seconds: 120
  gost_stats:
    poll_interval: "30s"
    idle_poll_interval: "2m"
    error_log_interval: "5m"
  latency:
    poll_interval: "60s"
    idle_poll_interval: "60s"
    error_log_interval: "5m"
    dials: 5
    dial_timeout: "3s"
    concurrency: 16
    retention_days: 7
  nodex:
    base_url: "http://127.0.0.1:18081"
    # Configure a secret out-of-band before selecting the NodeX backend.
    token: ""
    timeout_seconds: 15
  clean_agent:
    public_url: ""
    heartbeat_interval_seconds: 10
    action_timeout_seconds: 120
    token_expire_seconds: 0
    legacy_bridge_enabled: false
  iptables_ansible:
    inventory: "config/deploy/ansible/inventory.ini"
    apply_playbook: "config/deploy/ansible/playbooks/forward_apply.yml"
    remove_playbook: "config/deploy/ansible/playbooks/forward_remove.yml"
    become: false
    extra_vars: {}
    command: ""
    working_dir: "config/deploy/ansible"
    target_pattern: "{{node.host}}"
    environment:
      ANSIBLE_CONFIG: "config/deploy/ansible/ansible.cfg"
    timeout_seconds: 120

# Node-facing gRPC server. Legacy unary Transport=grpc and the opt-in
# anix.agent.v1 Agent control stream share this listener.
# Do not expose plaintext port 50051 to the public Internet. Configure the TLS
# files below or put the service behind an HTTP/2-capable L4/gRPC proxy and a
# restrictive firewall.
grpc:
  enabled: true
  host: "0.0.0.0"
  port: 50051
  api_token: ""
  tls_cert_file: ""
  tls_key_file: ""
  # Set true only when an HTTP/2 reverse proxy terminates public TLS and this
  # listener is restricted to the private host/container network.
  behind_tls_proxy: true

# Machine telemetry incident delivery. Replace every placeholder before running
# `anix-control -config <path> -check-config`.
maintenance:
  worker_interval: "30s"
  smtp:
    host: "smtp.example.com"
    port: 587
    from: "anixops-alerts@example.com"
    username: "anixops-alerts@example.com"
    password: "REPLACE-WITH-AT-LEAST-32-RANDOM-CHARACTERS"
  telegram:
    bot_token: "REPLACE-WITH-TELEGRAM-BOT-TOKEN"
  external_monitoring:
    provider: "REPLACE-WITH-INDEPENDENT-PROVIDER"
    monitor_id: "REPLACE-WITH-MONITOR-ID"
    health_url: "https://control.example.com/health"
    check_interval_seconds: 60
    email_enabled: true
    telegram_enabled: true

nodes:
  # Optional first-enrollment key. Leave empty when keys are created in the UI.
  bootstrap_auth_key: ""

# Bootstrap administrator. Change the password after the first verified login.
admin:
  email: "admin@your-domain.com"
  password: "REPLACE-WITH-AT-LEAST-32-RANDOM-CHARACTERS"
