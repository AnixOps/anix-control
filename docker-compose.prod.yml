# AnixOps Control: production Docker Compose deployment.
#
# Runs only Control. PostgreSQL is external (a managed database, or the
# PostgreSQL on this host reached through host.docker.internal). Control is
# stateless, so moving it to another machine means copying control.env and
# secrets/ and running the same commands there.
#
#   cp config/deploy/compose/control.env.example control.env   # then edit
#   install -d -m 0750 secrets
#   openssl rand -hex 32 | install -m 0400 -o 10001 -g 10001 /dev/stdin secrets/jwt_secret
#   printf '%s' 'database-password' | install -m 0400 -o 10001 -g 10001 /dev/stdin secrets/db_password
#   export ANIX_CONTROL_IMAGE=ghcr.io/anixops/anix-control@sha256:<digest from docker-image.txt>
#   docker compose -f docker-compose.prod.yml up -d
#
# Guide: docs/DEPLOYMENT.md. Every setting: docker run --rm "$ANIX_CONTROL_IMAGE" -print-env
name: anix-control

x-control: &control
  image: ${ANIX_CONTROL_IMAGE:?set ANIX_CONTROL_IMAGE to ghcr.io/anixops/anix-control@sha256:<digest> from the release docker-image.txt}
  env_file:
    - ${ANIX_CONTROL_ENV_FILE:-control.env}
  environment:
    ANIX_CONTROL_JWT_SECRET_FILE: /run/secrets/jwt_secret
    ANIX_CONTROL_DATABASE_PASSWORD_FILE: /run/secrets/db_password
  secrets:
    - jwt_secret
    - db_password
  read_only: true
  tmpfs:
    # Plugin host sockets and binaries, and ansible state; must allow exec.
    - /tmp:rw,exec,mode=1777,size=512m
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  extra_hosts:
    - host.docker.internal:host-gateway
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "5"

services:
  # One-shot schema and seed preparation. It holds a PostgreSQL advisory lock,
  # and the server repeats it idempotently, so re-running is always safe. On a
  # fresh database without admin.password it prints the generated admin
  # password: docker compose -f docker-compose.prod.yml logs migrate
  migrate:
    <<: *control
    command: ["migrate"]
    restart: "no"
    healthcheck:
      disable: true

  control:
    <<: *control
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    ports:
      - "${ANIX_CONTROL_BIND:-127.0.0.1}:${ANIX_CONTROL_API_PORT:-8080}:8080"
      - "${ANIX_CONTROL_BIND:-127.0.0.1}:${ANIX_CONTROL_UI_PORT:-3000}:3000"
      # Node-facing gRPC; publish it on a reachable address when
      # ANIX_CONTROL_GRPC_ENABLED=true in control.env.
      - "${ANIX_CONTROL_GRPC_BIND:-127.0.0.1}:${ANIX_CONTROL_GRPC_PORT:-50051}:50051"
    # Readiness drain (server.shutdown_drain_delay) + HTTP drain + workers,
    # gRPC and plugin hosts: allow the full ordered shutdown.
    stop_grace_period: 90s
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/readyz"]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 3
    # Local-ansible forward runtime (forward_runtime.backend: nftables_ansible):
    # mount the inventory and SSH material read-only.
    # volumes:
    #   - ./ansible/inventory.ini:/app/config/deploy/ansible/inventory.ini:ro
    #   - ./ansible/ssh:/home/anixops/.ssh:ro

secrets:
  jwt_secret:
    file: ${ANIX_CONTROL_SECRETS_DIR:-./secrets}/jwt_secret
  db_password:
    file: ${ANIX_CONTROL_SECRETS_DIR:-./secrets}/db_password
