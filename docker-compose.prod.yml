# AnixOps Control production deployment using PostgreSQL.

services:
  # Control API, frontend and Agent gRPC listener.
  api:
    image: ${DOCKER_IMAGE:?Set a release image pinned by sha256 digest in config/production.env}
    container_name: anix-control
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PANEL_API_PORT:-8080}:8080"         # HTTP API
      - "127.0.0.1:${PANEL_FRONTEND_PORT:-3000}:3000"    # Frontend/UI
      - "${PANEL_GRPC_BIND:-127.0.0.1}:${PANEL_GRPC_PORT:-50051}:50051" # gRPC; Nginx reaches api:50051 internally
    volumes:
      - ./config:/app/config:ro
      - ./config/deploy/ssh:/home/v2board/.ssh:ro
    environment:
      - TZ=${TZ:-Asia/Shanghai}
      - GIN_MODE=${GIN_MODE:-release}
      - HOME=/home/v2board
      - ANSIBLE_CONFIG=/app/config/deploy/ansible/ansible.cfg
      - ANSIBLE_HOST_KEY_CHECKING=${ANSIBLE_HOST_KEY_CHECKING:-False}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - anix-control-network
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Durable PostgreSQL database.
  db:
    image: ${POSTGRES_IMAGE:?Set a pinned PostgreSQL image in config/production.env}
    container_name: anix-control-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-v2board}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Database password required}
      POSTGRES_DB: ${DB_NAME:-v2board}
      TZ: ${TZ:-Asia/Shanghai}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - anix-control-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-v2board} -d ${DB_NAME:-v2board}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # TLS reverse proxy. Enable with --profile proxy.
  nginx:
    image: ${NGINX_IMAGE:?Set a pinned Nginx image in config/production.env}
    container_name: anix-control-nginx
    restart: unless-stopped
    profiles:
      - proxy
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./config/docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./config/docker/nginx/ssl:/etc/nginx/ssl:ro
      - ./logs/nginx:/var/log/nginx
    depends_on:
      - api
    networks:
      anix-control-network:
        ipv4_address: 172.30.0.10
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Optional Prometheus profile.
  prometheus:
    image: ${PROMETHEUS_IMAGE:?Set a pinned Prometheus image in config/production.env}
    container_name: anix-control-prometheus
    restart: unless-stopped
    profiles:
      - prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./config/docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    networks:
      - anix-control-network

  # Optional Grafana profile.
  grafana:
    image: ${GRAFANA_IMAGE:?Set a pinned Grafana image in config/production.env}
    container_name: anix-control-grafana
    restart: unless-stopped
    profiles:
      - grafana
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./config/docker/grafana/provisioning:/etc/grafana/provisioning:ro
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
    depends_on:
      - prometheus
    networks:
      - anix-control-network

networks:
  anix-control-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24

volumes:
  postgres-data:
  prometheus-data:
  grafana-data:
