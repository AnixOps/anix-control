basePath: /api/v2
definitions:
  agentupgrade.Batch:
    properties:
      min_duration_seconds:
        type: integer
      percent:
        type: integer
    type: object
  agentupgrade.Exclude:
    properties:
      nodes:
        items:
          type: string
        type: array
      tags:
        items:
          type: string
        type: array
    type: object
  handler.AgentHeartbeatRequest:
    properties:
      node_id:
        type: integer
      resources:
        additionalProperties: {}
        type: object
      status:
        maxLength: 32
        type: string
    required:
    - node_id
    type: object
  handler.AgentMonitorRequest:
    properties:
      node_id:
        type: integer
      system:
        additionalProperties: {}
        type: object
    required:
    - node_id
    type: object
  handler.AgentRegisterRequest:
    properties:
      capabilities:
        items:
          type: string
        type: array
      node_id:
        type: integer
      system:
        additionalProperties: {}
        type: object
      token:
        minLength: 1
        type: string
      version:
        maxLength: 64
        type: string
    required:
    - node_id
    - token
    type: object
  handler.AgentTaskResult:
    properties:
      action:
        type: string
      data: {}
      duration_ms:
        type: integer
      error:
        type: string
      node_id:
        type: integer
      output:
        type: string
      success:
        type: boolean
      task_id:
        type: string
      timestamp:
        type: string
      type:
        type: string
    required:
    - task_id
    type: object
  handler.BroadcastRequest:
    properties:
      message:
        type: string
    required:
    - message
    type: object
  handler.CreateGatewayRequest:
    properties:
      config: {}
      description:
        type: string
      fee_fixed:
        type: number
      fee_rate:
        type: number
      icon:
        type: string
      max_amount:
        type: number
      min_amount:
        type: number
      name:
        type: string
      sort:
        type: integer
      type:
        enum:
        - alipay
        - wechat
        - stripe
        - usdt
        - epay
        type: string
    required:
    - name
    - type
    type: object
  handler.CreatePaymentRequest:
    properties:
      amount:
        minimum: 1
        type: number
      gateway_id:
        type: integer
      order_id:
        type: integer
    required:
    - amount
    - gateway_id
    type: object
  handler.CreateTaskRequest:
    properties:
      action:
        type: string
      node_id:
        type: integer
      params:
        additionalProperties: {}
        type: object
      timeout:
        type: integer
      type:
        type: string
    required:
    - action
    - node_id
    - type
    type: object
  handler.ExecuteCommandRequest:
    properties:
      action:
        type: string
      node_id:
        type: integer
      params:
        additionalProperties: {}
        type: object
      timeout:
        type: integer
    required:
    - action
    - node_id
    type: object
  handler.NotifySettingsRequest:
    properties:
      notify_expire:
        type: boolean
      notify_ticket:
        type: boolean
      notify_traffic:
        type: boolean
    type: object
  handler.RouteModeChangeBody:
    properties:
      confirm:
        type: boolean
      mode:
        type: string
      package_id:
        type: string
      reason:
        type: string
      routes:
        items:
          type: string
        type: array
    required:
    - mode
    - package_id
    type: object
  handler.RouteModeRollbackBody:
    properties:
      package_id:
        type: string
      reason:
        type: string
    required:
    - package_id
    type: object
  handler.SendNotificationRequest:
    properties:
      content:
        maxLength: 4096
        type: string
      message:
        maxLength: 4096
        type: string
      telegram_id:
        type: integer
      title:
        maxLength: 255
        type: string
    required:
    - telegram_id
    type: object
  handler.SetWebhookRequest:
    properties:
      url:
        maxLength: 512
        type: string
    type: object
  handler.TestGostConnectionRequest:
    properties:
      api_port:
        type: integer
      api_token:
        type: string
      host:
        type: string
    required:
    - api_port
    - host
    type: object
  handler.ToggleRequest:
    properties:
      enabled:
        type: boolean
    type: object
  handler.UpdateBotRequest:
    properties:
      admin_ids: {}
      allow_bind:
        type: boolean
      allow_info:
        type: boolean
      allow_sub:
        type: boolean
      allow_ticket:
        type: boolean
      name:
        maxLength: 255
        type: string
      token:
        minLength: 1
        type: string
      welcome_message:
        maxLength: 1024
        type: string
      welcome_msg:
        maxLength: 1024
        type: string
    type: object
  handler.UpdateGatewayRequest:
    properties:
      config: {}
      description:
        type: string
      fee_fixed:
        type: number
      fee_rate:
        type: number
      icon:
        type: string
      max_amount:
        type: number
      min_amount:
        type: number
      name:
        type: string
      sort:
        type: integer
      type:
        enum:
        - alipay
        - wechat
        - stripe
        - usdt
        - epay
        type: string
    type: object
  handler.abortAgentUpgradeRequest:
    properties:
      rollback:
        description: Rollback rolls the current batch back before the campaign ends.
        type: boolean
    type: object
  handler.createAdminAPITokenRequest:
    properties:
      code:
        type: string
      expires_in_days:
        description: |-
          ExpiresInDays ends the token after that many days (at most 730); 0 or
          absent never.
        maximum: 730
        minimum: 1
        type: integer
      method:
        type: string
      name:
        description: Name says what the token is for; 1 to 100 printable characters.
        type: string
      password:
        description: |-
          Password re-authenticates the administrator; with a second factor on,
          Code and Method (totp or backup) do instead.
        type: string
      scope:
        description: Scope is "read" or "admin".
        type: string
    required:
    - name
    - scope
    type: object
  handler.rotateAgentCredentialsRequest:
    properties:
      node:
        description: Node is "proxy-<id>" or "forward-<id>".
        type: string
      reason:
        description: Reason is recorded in the audit entry; at most 200 bytes (UTF-8).
        type: string
      rotate_api_key:
        description: |-
          RotateAPIKey also replaces a proxy node's API key (the legacy
          transports' credential). Off by default: the old key stops working,
          and a node that still polls with it must be given the new one. Not
          accepted for a forward node.
        type: boolean
      ttl_seconds:
        description: |-
          TTLSeconds is the new enrollment credential's lifetime: one hour by
          default, from 60 to 604800 (7 days).
        type: integer
    required:
    - node
    type: object
  handler.startAgentUpgradeRequest:
    properties:
      batches:
        items:
          $ref: '#/definitions/agentupgrade.Batch'
        type: array
      exclude:
        $ref: '#/definitions/agentupgrade.Exclude'
      reason:
        type: string
      target_version:
        description: TargetVersion defaults to this Control's Agent release (H25).
        type: string
    type: object
  handler.subscriptionResetRequest:
    properties:
      code:
        type: string
      method:
        type: string
      password:
        type: string
    type: object
  handler.telegramTestRequest:
    properties:
      chat_id:
        description: |-
          ChatID is the chat to send to: the administrator's own bound chat
          (the default) or one of the bot's admin_ids. Anything else is refused.
        type: integer
    type: object
  model.AdminCreateUserRequest:
    properties:
      device_limit:
        type: integer
      email:
        type: string
      flowResetTime:
        type: integer
      group_id:
        type: integer
      is_admin:
        type: integer
      password:
        minLength: 6
        type: string
      speed_limit:
        type: integer
      transfer_enable:
        type: integer
    required:
    - email
    - password
    type: object
  model.BackupConfig:
    properties:
      auto_backup:
        type: boolean
      backup_database:
        type: boolean
      backup_files:
        type: boolean
      created_at:
        type: string
      enabled:
        type: boolean
      id:
        type: integer
      retention_days:
        description: 保留天数
        type: integer
      s3_access_key:
        type: string
      s3_bucket:
        type: string
      s3_endpoint:
        type: string
      s3_region:
        type: string
      s3_secret_key:
        type: string
      schedule:
        description: cron表达式
        type: string
      storage_path:
        type: string
      storage_type:
        description: local/s3/ftp
        type: string
      updated_at:
        type: string
    type: object
  model.InviteConfig:
    properties:
      auto_generate:
        description: 邀请码设置
        type: boolean
      code_count:
        description: 每个用户邀请码数量
        type: integer
      code_expire_days:
        description: 邀请码过期天数 (0=永不过期)
        type: integer
      commission_enabled:
        description: 佣金设置
        type: boolean
      commission_fixed:
        description: 固定佣金金额
        type: number
      commission_min:
        description: 最低提现金额
        type: number
      commission_rate:
        description: 佣金比例 (0.1 = 10%)
        type: number
      commission_type:
        description: 1=按比例 2=固定金额
        type: integer
      created_at:
        type: string
      enabled:
        type: boolean
      first_order_bonus:
        description: 首次奖励
        type: number
      first_traffic_bonus:
        description: 首次流量奖励 (bytes)
        type: integer
      id:
        type: integer
      updated_at:
        type: string
    type: object
  model.LoadBalancer:
    properties:
      check_interval:
        description: 检查间隔(秒)
        type: integer
      check_timeout:
        description: 超时时间(秒)
        type: integer
      created_at:
        type: string
      enabled:
        type: boolean
      group_id:
        description: 节点组ID
        type: integer
      health_check:
        type: boolean
      id:
        type: integer
      name:
        type: string
      node_weights:
        description: 'JSON: {node_id: weight}'
        type: string
      strategy:
        description: round-robin/least-conn/latency/weight/random
        type: string
      updated_at:
        type: string
    type: object
  model.LoginRequest:
    properties:
      email:
        type: string
      mfa_code:
        type: string
      mfa_method:
        type: string
      password:
        type: string
    required:
    - email
    - password
    type: object
  model.Node:
    properties:
      auto_register:
        description: 是否自动注册的节点
        type: integer
      cpu_usage:
        description: CPU使用率
        type: number
      created_at:
        type: string
      disk_usage:
        description: 磁盘使用率
        type: number
      group_id:
        description: 节点分组
        type: integer
      host:
        description: 服务器地址 (IP或域名)
        type: string
      id:
        type: integer
      last_check_at:
        description: 时间戳
        type: integer
      memory_usage:
        description: 内存使用率
        type: number
      monthly_download:
        description: 本月已用下载流量
        type: integer
      monthly_limit:
        description: 月流量限额 (仅本节点自身, 不含子节点单独限额; 子节点流量会同时累加到父节点)
        type: integer
      monthly_reset_day:
        description: 每月流量重置日 (1-28)
        type: integer
      monthly_upload:
        description: 本月已用上传流量
        type: integer
      name:
        description: 节点名称
        type: string
      online_users:
        description: 在线用户数
        type: integer
      parent_id:
        description: '父子节点 (中转链路: 落地节点为根, 转发节点为子, 支持多级)'
        type: integer
      port:
        description: API通信端口
        type: integer
      protocols:
        description: 关联
        items:
          $ref: '#/definitions/model.NodeProtocol'
        type: array
      rate:
        description: 流量倍率
        type: number
      raw_config:
        description: 高级配置 (直接JSON编辑)
        type: string
      runtime_checked_at:
        type: integer
      runtime_error:
        type: string
      runtime_healthy:
        description: 运行时健康状态 (由支持运行时自愈的节点上报)
        type: boolean
      server_ip:
        description: 服务器信息 (由节点上报)
        type: string
      server_os:
        description: 操作系统信息
        type: string
      server_version:
        description: 节点程序版本
        type: string
      show:
        description: 是否显示给用户
        type: integer
      sort:
        description: 排序
        type: integer
      status:
        allOf:
        - $ref: '#/definitions/model.NodeStatus'
        description: 节点状态
      tags:
        description: 标签 (JSON array)
        type: string
      total_download:
        description: 总下载流量
        type: integer
      total_upload:
        description: 流量统计
        type: integer
      traffic_rate:
        description: 计费倍率
        type: number
      updated_at:
        type: string
      uptime:
        description: 运行时间(秒)
        type: integer
    type: object
  model.NodeHeartbeatRequest:
    properties:
      cpu_usage:
        type: number
      disk_usage:
        type: number
      download:
        description: 本次下载流量增量
        type: integer
      memory_usage:
        type: number
      online_users:
        type: integer
      upload:
        description: 本次上传流量增量
        type: integer
      uptime:
        type: integer
    type: object
  model.NodeProtocol:
    properties:
      alpn:
        description: ALPN设置
        type: string
      created_at:
        type: string
      custom_config:
        description: 自定义配置 (全量覆盖)
        type: string
      enable:
        description: 是否启用 (节点端是否运行)
        type: integer
      group_id:
        description: 所属订阅分组 (如果为空则跟随节点)
        type: integer
      host:
        description: 通用配置
        type: string
      id:
        type: integer
      name:
        description: 协议名称
        type: string
      node:
        allOf:
        - $ref: '#/definitions/model.Node'
        description: 关联
      node_id:
        description: 所属节点
        type: integer
      port:
        description: 监听端口
        type: integer
      reality_settings:
        description: Reality 配置
        type: string
      settings:
        description: 协议特定配置 (JSON)
        type: string
      show:
        description: 是否显示在订阅中
        type: integer
      sort:
        description: 排序
        type: integer
      subscription_groups:
        items:
          $ref: '#/definitions/model.SubscriptionGroup'
        type: array
      tls:
        description: 'TLS模式: 0=无, 1=TLS, 2=Reality'
        type: integer
      tls_settings:
        description: TLS配置 (JSON)
        type: string
      transport:
        description: '传输层: tcp, ws, grpc, quic, h2'
        type: string
      transport_settings:
        description: 传输层配置 (JSON)
        type: string
      type:
        allOf:
        - $ref: '#/definitions/model.ProtocolType'
        description: 协议类型
      updated_at:
        type: string
    type: object
  model.NodeRegisterRequest:
    properties:
      auth_key:
        description: 授权密钥
        type: string
      host:
        description: 节点地址
        type: string
      name:
        description: 节点名称
        type: string
      port:
        description: API端口
        type: integer
      server_os:
        description: 操作系统
        type: string
      server_version:
        description: 节点版本
        type: string
    required:
    - auth_key
    type: object
  model.NodeRuntimeHealthRequest:
    properties:
      error:
        type: string
      healthy:
        type: boolean
    type: object
  model.NodeStatus:
    enum:
    - 0
    - 1
    - 2
    - 3
    type: integer
    x-enum-comments:
      NodeStatusDisabled: 已禁用
      NodeStatusOffline: 离线
      NodeStatusOnline: 在线
      NodeStatusPending: 待审核
    x-enum-descriptions:
    - 待审核
    - 在线
    - 离线
    - 已禁用
    x-enum-varnames:
    - NodeStatusPending
    - NodeStatusOnline
    - NodeStatusOffline
    - NodeStatusDisabled
  model.Plan:
    properties:
      capacity_limit:
        type: integer
      content:
        type: string
      created_at:
        type: string
      device_limit:
        type: integer
      group_id:
        type: integer
      half_year_price:
        type: integer
      id:
        type: integer
      month_price:
        description: Prices
        type: integer
      name:
        type: string
      onetime_price:
        type: integer
      quarter_price:
        type: integer
      renew:
        type: integer
      reset_price:
        type: integer
      reset_traffic_method:
        type: integer
      show:
        type: integer
      sort:
        type: integer
      speed_limit:
        type: integer
      three_year_price:
        type: integer
      transfer_enable:
        description: GB
        type: integer
      two_year_price:
        type: integer
      updated_at:
        type: string
      year_price:
        type: integer
    type: object
  model.ProtocolType:
    enum:
    - vmess
    - vless
    - trojan
    - shadowsocks
    - hysteria2
    - tuic
    - anytls
    - wireguard
    type: string
    x-enum-varnames:
    - ProtocolVMess
    - ProtocolVLESS
    - ProtocolTrojan
    - ProtocolShadowsocks
    - ProtocolHysteria2
    - ProtocolTUIC
    - ProtocolAnyTLS
    - ProtocolWireGuard
  model.RegisterRequest:
    properties:
      email:
        type: string
      invite_code:
        type: string
      password:
        minLength: 6
        type: string
    required:
    - email
    - password
    type: object
  model.SubscriptionGroup:
    properties:
      created_at:
        type: string
      description:
        description: 分组描述
        type: string
      enable:
        description: 是否启用
        type: integer
      id:
        type: integer
      name:
        description: 分组名称
        type: string
      priority:
        description: 优先级 (数值越大优先级越高)
        type: integer
      protocols:
        items:
          $ref: '#/definitions/model.NodeProtocol'
        type: array
      templates:
        description: 关联
        items:
          $ref: '#/definitions/model.SubscriptionTemplate'
        type: array
      updated_at:
        type: string
    type: object
  model.SubscriptionTemplate:
    properties:
      alpn:
        description: ALPN (h2,http/1.1)
        type: string
      created_at:
        type: string
      enable:
        description: 是否启用
        type: integer
      encryption:
        description: '加密: 空 或 mlkem768x25519plus'
        type: string
      encryption_settings:
        description: 加密配置 JSON
        type: string
      flow:
        description: VLESS 特有配置 (对应 AnixOps Agent flow, encryption, encryption_settings)
        type: string
      group:
        allOf:
        - $ref: '#/definitions/model.SubscriptionGroup'
        description: 关联
      group_id:
        description: 所属分组
        type: integer
      id:
        type: integer
      name:
        description: 模板名称 (显示给用户的节点名)
        type: string
      port:
        description: 端口 (server_port)
        type: integer
      protocol_settings:
        description: 协议特定配置 (存储其他不在通用字段中的配置)
        type: string
      reality_dest:
        description: 回落目标 (dest)
        type: string
      reality_public_key:
        description: Reality 配置 (当 TLS=2 时使用, 对应 AnixOps Agent tls_settings)
        type: string
      reality_short_id:
        description: Short ID (对应 sid)
        type: string
      reality_spider_x:
        description: SpiderX (对应 spx)
        type: string
      server:
        description: 服务器基础配置 (对应 AnixOps Agent CommonNode)
        type: string
      server_name:
        description: SNI 服务器名称
        type: string
      sort:
        description: 排序
        type: integer
      ss_cipher:
        description: Shadowsocks 配置 (对应 AnixOps Agent cipher, server_key)
        type: string
      ss_server_key:
        description: SS2022 服务器密钥
        type: string
      tags:
        description: 标签 (JSON array)
        type: string
      template_json:
        description: |-
          JSON 模板配置 (高级功能)
          支持变量占位符: {{.UUID}}, {{.UserID}}, {{.Email}}, {{.ExpiredAt}}, {{.SpeedLimit}}, {{.DeviceLimit}}
          以及自定义变量: {{.Custom.xxx}}
        type: string
      tls:
        description: TLS 配置 (对应 AnixOps Agent tls 字段)
        type: integer
      tls_fingerprint:
        description: TLS 指纹 (chrome, firefox, safari, ios, android, edge, 360, qq,
          random)
        type: string
      transport:
        description: 传输层配置 (对应 AnixOps Agent network, network_settings)
        type: string
      transport_settings:
        description: 传输层配置 JSON
        type: string
      type:
        description: '协议类型: vmess, vless, trojan, shadowsocks, hysteria2, tuic, anytls'
        type: string
      updated_at:
        type: string
    type: object
  service.TelegramCallback:
    properties:
      data:
        type: string
      from:
        $ref: '#/definitions/service.TelegramUser'
      id:
        type: string
      message:
        $ref: '#/definitions/service.TelegramMessage'
    type: object
  service.TelegramChat:
    properties:
      id:
        type: integer
      title:
        type: string
      type:
        type: string
      username:
        type: string
    type: object
  service.TelegramMessage:
    properties:
      chat:
        $ref: '#/definitions/service.TelegramChat'
      date:
        type: integer
      from:
        $ref: '#/definitions/service.TelegramUser'
      message_id:
        type: integer
      text:
        type: string
    type: object
  service.TelegramUpdate:
    properties:
      callback_query:
        $ref: '#/definitions/service.TelegramCallback'
      message:
        $ref: '#/definitions/service.TelegramMessage'
      update_id:
        type: integer
    type: object
  service.TelegramUser:
    properties:
      first_name:
        type: string
      id:
        type: integer
      is_bot:
        type: boolean
      language_code:
        type: string
      last_name:
        type: string
      username:
        type: string
    type: object
host: localhost:8080
info:
  contact:
    email: support@anixops.com
    name: API Support
    url: https://github.com/AnixOps/anix-control/issues
  description: |-
    AnixOps Control 统一控制面 API 文档
    支持用户管理、节点管理、订阅系统、支付网关、流量转发等功能
  license:
