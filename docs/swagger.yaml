securityDefinitions:
  BearerAuth:
    description: Type "Bearer" followed by a space and a JWT, or, on the administrator
      APIs, an admin API token (anixadm_..., see docs/reference/admin-api-tokens.md).
    in: header
    name: Authorization
    type: apiKey
