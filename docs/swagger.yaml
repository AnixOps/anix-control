  /admin/nodes/{id}/credentials:
    get:
      consumes:
      - application/json
      description: |-
        管理员获取指定节点的 api_key / secret, 用于 AnixOps Agent 对接配置。
        Node.APIKey/Secret 在普通序列化里是隐藏字段 (json:"-"), 此接口显式返回,
        仅限管理员, 供 Ansible 等部署工具自动拉取节点凭证。
        每次读取都写入管理员审计日志 (action "reveal")。
      parameters:
      - description: 节点ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
