- description: 用户登录、注册等认证相关接口
  name: 认证
- description: 用户个人信息、订阅、工单、订单等接口
  name: 用户端
- description: 管理员用户管理、节点管理、配置等接口
  name: 管理端
- description: 节点注册、心跳、配置同步等接口
  name: 节点通信
