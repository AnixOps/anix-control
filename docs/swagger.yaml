  /admin/nodes:
    get:
      consumes:
      - application/json
      description: 管理员获取节点列表，支持分页和筛选
      parameters:
      - default: 1
        description: 页码
        in: query
        name: page
        type: integer
      - default: 20
        description: 每页数量
        in: query
        name: page_size
        type: integer
      - description: 搜索关键词
        in: query
        name: search
        type: string
      - description: 节点状态
        in: query
        name: status
        type: integer
      - description: 分组ID
        in: query
        name: group_id
        type: integer
      - description: '排序字段: id, name, host, sort, created_at, last_check_at, cpu_usage,
          online_users; 缺省为管理员排序 (sort 升序, id 倒序)'
        enum:
        - id
        - name
        - host
        - sort
        - created_at
        - last_check_at
        - cpu_usage
        - online_users
        in: query
        name: sort
        type: string
      - default: asc
        description: 排序方向, 仅与 sort 同用
        enum:
        - asc
        - desc
        in: query
        name: order
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties: true
            type: object
