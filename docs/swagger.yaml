      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Abort an Agent upgrade campaign
      tags:
      - Kernel
  /api/v4/kernel/agents/upgrades/{id}/pause:
    post:
      description: No node is offered the upgrade and no batch starts; nodes already
        offered are still evaluated and a failing batch still rolls back. Super administrators
        only.
      parameters:
      - description: campaign id
        in: path
