      tags:
      - Kernel
  /api/v4/kernel/alerts:
    get:
      description: 'The alerts of the kernel''s alert monitor: Agent, forward link
        and module certificates that were not renewed in time (leaf certificates alert
        inside the smaller of alerts.leaf_expiry_days and a sixth of their lifetime),
        the current module and forward link CAs inside alerts.ca_expiry_days, and
        phased processes left untouched in a non-final phase for alerts.phase_stuck_after
        (the node credential split, an interrupted finalize, the identity import and
        cutover). Critical alerts come first, then the soonest to end. The summary
        counts every active alert whatever the filters. Alerts hold no secret: kinds,
        node names, dates and counts only.'
      parameters:
      - description: active (default), resolved or all
        in: query
        name: status
        type: string
      - description: one alert kind, for example agent_certificate_expiring
        in: query
        name: kind
        type: string
      - description: warning or critical
        in: query
        name: severity
        type: string
      - description: 1 to 500, default 100
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: data.alerts and data.summary {active, critical, warning}
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: List the kernel alerts
      tags:
      - Kernel
  /api/v4/kernel/api-tokens:
    get:
      description: 'Lists the caller''s active API tokens (add include_inactive=true
        for revoked and expired ones): id, name, scope, last four characters, expiry,
        last use. Never a secret. A super administrator may list another administrator''s
        tokens with user_id, or everyone''s with all=true. Needs a signed-in session.'
      parameters:
      - description: another administrator (super administrators only)
        in: query
        name: user_id
        type: integer
      - description: every administrator's tokens (super administrators only)
        in: query
        name: all
        type: boolean
      - description: also revoked and expired tokens
        in: query
        name: include_inactive
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: List admin API tokens
      tags:
      - Kernel
    post:
      consumes:
      - application/json
      description: 'Issues a personal access token for automation: `anixadm_` and
        43 characters, shown once in this answer; only its SHA-256 is stored. Scope
        `read` allows GET and HEAD on the administrator APIs except the reads that
        answer a secret in clear; `admin` allows what the owner may do except managing
        tokens. Needs a signed-in session (never an API token) and a re-authentication:
        the current password, or a TOTP or recovery code when the account has a second
        factor (when the kernel cannot check a credential because identity holds it,
        the sign-in must be at most 10 minutes old, or it answers 403 step_up_sign_in_stale).
        Up to 25 active tokens per administrator; the owner''s rights are read on
        every use. Audited. Send the token as `Authorization: Bearer <token>` only,
        never in a URL.'
      parameters:
      - description: name, scope (read or admin), optional expires_in_days, and password
          or code (+ method)
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.createAdminAPITokenRequest'
      produces:
      - application/json
      responses:
        "201":
          description: data.token is shown once; data.api_token is the stored record
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Create an admin API token
      tags:
      - Kernel
  /api/v4/kernel/api-tokens/{id}:
    delete:
      description: Ends a token at once. An administrator revokes their own tokens;
        a super administrator revokes anyone's (for example a departed administrator's).
        Revoking a revoked token is not an error. Needs a signed-in session. Audited.
      parameters:
      - description: token id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Revoke an admin API token
      tags:
      - Kernel
  /api/v4/kernel/nodes/{id}/traffic:
    get:
      description: 'One proxy node''s traffic over time for the admin charts, ascending,
        buckets without traffic as zeros. granularity=hour (the default) sums the
        node''s rows of the raw traffic log v2_server_log in UTC hours: the last 24
        hours by default, at most 720 hourly buckets, and only as far back as the
        operator keeps the raw log (docs/reference/traffic-stats-operations.md). granularity=day
        reads the node''s daily server statistics (v2_stat_server): the last 30 days
        by default, at most 366 daily buckets, aligned to the Control host''s local
        midnight, kept regardless of the raw log''s retention. since and until are
        Unix milliseconds (since inclusive, until exclusive); they are rounded out
        to whole buckets, and the answer''s since_unix_ms and until_unix_ms are the
        window actually returned. Bytes are the panel''s metered bytes: up and down
        with the node''s traffic rate applied, as /api/v2/admin/traffic/hourly counts
        them, summed over every protocol the node reported under. This is the proxy
        node''s user traffic; forwarding traffic is /api/v4/forward/stats and /api/v4/forward/routes/{id}/stats.'
      parameters:
      - description: proxy node id
        in: path
        name: id
        required: true
        type: integer
      - description: hour (default) or day
        in: query
        name: granularity
        type: string
      - description: window start, Unix milliseconds
        in: query
        name: since
        type: integer
      - description: window end (exclusive), Unix milliseconds
        in: query
        name: until
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Proxy node traffic series
      tags:
      - Kernel
  /api/v4/kernel/notifications/telegram/test:
    post:
      consumes:
      - application/json
      description: 'Sends one fixed test message through the bot configured in the
        Telegram bot settings (the v2_telegram_bot row) and answers the result class:
        ok, invalid_token, chat_not_found, bot_blocked, rate_limited, not_configured,
        network_error (with a reason: timeout, dns, tls, connect, canceled, other)
        or unknown. The answer never carries the bot token, a URL or Telegram''s own
        text. The message goes to the calling administrator''s own bound Telegram
        chat; an explicit chat_id is accepted only when it is that chat or one of
        the bot''s admin_ids. An administrator without a bound Telegram account gets
        409. At most 5 tests a minute per administrator and 20 in ten minutes for
        all of them (429 with Retry-After). Every attempt is recorded in the operation
        log (module notification, action telegram_test) with its class only.'
      parameters:
      - description: chat_id (optional)
        in: body
        name: request
        schema:
          $ref: '#/definitions/handler.telegramTestRequest'
      produces:
      - application/json
      responses:
        "200":
          description: data.class, data.ok, data.message, data.target, data.error_code,
            data.reason
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties: true
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties: true
            type: object
        "429":
          description: Too Many Requests
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Send a test message through the Telegram bot
      tags:
      - Kernel
  /api/v4/kernel/route-modes:
    get:
      description: Every v2 Control package's compatibility routes with their configured
