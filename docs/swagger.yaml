  /api/v4/kernel/agents/rotate-credentials:
    post:
      consumes:
      - application/json
      description: Revokes every Agent certificate, enrollment (unused enrollment
        credentials included) and forward link certificate of the node, optionally
        replaces a proxy node's API key (rotate_api_key; the new key is read through
        the audited GET /api/v2/admin/nodes/{id}/credentials), and returns a fresh
        one-time anixagt_ enrollment credential, shown once, for the Agent to enroll
        again (install script with --reset). Never dials the node, so it works while
        the node is offline; open Agent streams end at their next heartbeat. Repeating
        it leaves exactly one valid enrollment credential, the last. Super administrators
        only. Audited as agent_credentials_rotate and agent_enrollment_token_issue.
      parameters:
      - description: node (proxy-<id> or forward-<id>), rotate_api_key (proxy nodes
          only, default false), ttl_seconds (60 to 604800, default 3600), reason (at
          most 200 bytes, UTF-8)
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.rotateAgentCredentialsRequest'
      produces:
      - application/json
      responses:
        "201":
          description: data.credential is shown once
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties: true
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties: true
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Rotate a node's Agent credentials
      tags:
      - Kernel
  /api/v4/kernel/agents/transports:
    get:
      description: 'Lists every proxy and forward node with the transport its agent
        was last seen on (mtls-stream, apikey-stream, http-legacy, websocket, clean-agent,
        uniproxy, v2board-grpc), its agent version, its newest valid agent certificate,
        when it was last seen and its live Agent Control stream session (authentication
        mtls or api-key, certificate serial, expiry and SAN, negotiated capabilities).
        Each node also carries certificate_state (valid, revoked, expired or none),
        last_certificate (its newest certificate in any state: serial, issued_at,
        not_after, renew_after, revoked_at and revoke_reason) and connection (type
        mtls_stream, apikey_stream, legacy, third_party or offline, the transport
        and when it was last seen). legacy_only=true keeps the nodes on a legacy AnixOps
        Agent channel; node=proxy-7 (repeatable or comma separated, at most 200) keeps
        the named nodes. summary.ready_for_required (with required_reasons and required_blockers,
        computed over every node) is false while agent_control.mtls: required, the
        default from v4.2, would refuse an enabled node: a legacy one or one that
        never enrolled.'
      parameters:
      - description: only nodes on a legacy AnixOps Agent channel
        in: query
        name: legacy_only
        type: boolean
      - collectionFormat: multi
        description: only these nodes (proxy-<id> or forward-<id>), repeatable or
          comma separated
        in: query
        items:
          type: string
        name: node
        type: array
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Agent transport inventory
      tags:
      - Kernel
  /api/v4/kernel/agents/upgrades:
    get:
      description: The latest Agent upgrade campaigns, newest first, each with its
        batches and nodes counted by state (pending, offered, upgrading, succeeded,
        failed, rolled_back, skipped).
      parameters:
      - description: at most 100, default 20
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: List Agent upgrade campaigns
      tags:
      - Kernel
    post:
      consumes:
      - application/json
      description: Pushes an Agent release to every enabled node whose Agent was seen
        on the Agent Control stream, in batches (default 5%, 25%, 100% of the nodes,
        at least 30 minutes each; canaries first by node name hash), as the agent.upgrade
        operation to Agents that negotiated upgrade.v1. A batch rolls back when more
        than 5% of its offered nodes fail or do not reconnect with the target version
        within 10 minutes (H19). The release must be in agent_install.artifact_dir
        with its .sig files and SHA256SUMS(.sig), verified with plugins.official_public_key.
        Super administrators only; one campaign at a time.
      parameters:
      - description: target_version (default this Control's Agent release), batches,
          exclude {nodes, tags}, reason
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.startAgentUpgradeRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Start a staged Agent upgrade
      tags:
      - Kernel
  /api/v4/kernel/agents/upgrades/{id}:
    get:
      description: One campaign with its artifacts, batches and every node in canary
        order with its state, versions, timestamps and error code.
      parameters:
      - description: campaign id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
      summary: Get an Agent upgrade campaign
      tags:
      - Kernel
  /api/v4/kernel/agents/upgrades/{id}/abort:
    post:
      consumes:
      - application/json
      description: Ends the campaign. With rollback the upgraded nodes of the current
        batch are told to reinstate their previous release first. Super administrators
        only.
      parameters:
      - description: campaign id
        in: path
        name: id
        required: true
        type: string
      - description: rollback
        in: body
        name: request
        schema:
