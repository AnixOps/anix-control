  /api/v4/kernel/agents/upgrades/{id}/resume:
    post:
      description: Continues a paused campaign; the paused time does not count towards
        the batch's minimum duration. Super administrators only.
      parameters:
      - description: campaign id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      security:
      - BearerAuth: []
