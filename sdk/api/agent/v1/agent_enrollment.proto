syntax = "proto3";

package anix.agent.v1;

option go_package = "github.com/AnixOps/anix-control/sdk/api/agent/v1;agentv1pb";

// AgentEnrollment issues the mTLS client certificates of AnixOps Agents. It is
// served on Control's node-facing agent listener, next to
// AgentControlService. It lives in its own file so the descriptor of
// agent.proto, which Agents in the field run, stays unchanged.
//
// A certificate carries exactly one URI SAN naming the node:
//
//   spiffe://anixops/<cluster>/agent/proxy-<id>     a proxy node (v2_node)
//   spiffe://anixops/<cluster>/agent/forward-<id>   a forward node (v2_forward_node)
//
// Control ignores the subject and SANs of the CSR and issues the identity of
// the node the bootstrap credential names. The node credential and a
// one-time anixagt_ enrollment credential name an existing node (Enroll); a
// node group's anixjoin_ join token names the group, and Control issues the
// identity of the node it creates in that group or of the machine's earlier
// node of the group (Join).
service AgentEnrollment {
  // Enroll exchanges a bootstrap credential and a CSR for the node's first
  // certificate. The credential is one of:
  //   - the node credential an agent already has, as metadata: x-node-id and
  //     x-api-key (a proxy node's API key), with x-node-kind "forward" for a
  //     forward node's token;
  //   - enrollment_credential, a one-time anixagt_ credential bound to a node.
  rpc Enroll(EnrollAgentRequest) returns (EnrollAgentResponse);
  // Join exchanges a node group's join token and a CSR for the certificate of
  // a new node of that group, or of this machine's earlier node (see the
  // rejoin rule in docs/design/node-onboarding). Control ignores the CSR's
  // subject and SANs.
  rpc Join(JoinRequest) returns (JoinResponse);
  // Renew issues a new certificate to the holder of a valid one, presented as
  // the TLS client certificate.
  rpc Renew(RenewAgentCertificateRequest) returns (RenewAgentCertificateResponse);
  // GetTrustBundle returns the CA certificates that sign agent certificates.
  // It requires a valid agent client certificate.
  rpc GetTrustBundle(GetAgentTrustBundleRequest) returns (GetAgentTrustBundleResponse);
  // IssueLinkCertificate issues the node of the presented agent client
  // certificate a forward link certificate (owner decision H28): the
  // certificate a forward engine such as gost presents to the node's peers
  // on encrypted links, signed by the forward link CA, a root separate from
  // the CA of agent certificates. It requires a valid agent client
  // certificate (never the node credential) of a node whose Agent negotiated
  // forward.v1 in its last Hello. The CSR's key must be a key of its own,
  // never the agent certificate's; the CSR may name only the node's DNS
  // name ("forward-7") and SPIFFE ID. Renewal is the same call with a new
  // key, at renew_after_unix. See PROTOCOL.md "Forward link certificates".
  rpc IssueLinkCertificate(IssueLinkCertificateRequest) returns (IssueLinkCertificateResponse);
  // GetLinkTrustBundle returns the forward link CAs a node trusts to verify
  // its peers' link certificates. It requires a valid agent client
  // certificate.
  rpc GetLinkTrustBundle(GetLinkTrustBundleRequest) returns (GetLinkTrustBundleResponse);
}

message EnrollAgentRequest {
  // csr_der is a PKCS#10 request in DER. Only its public key is used.
  bytes csr_der = 1;
  // enrollment_credential is a one-time anixagt_ credential. Leave it empty
  // to authenticate with the node credential in metadata.
  string enrollment_credential = 2;
  // agent_version and instance_id are recorded with the enrollment.
  string agent_version = 3;
  string instance_id = 4;
}

message EnrollAgentResponse {
  AgentCertificate certificate = 1;
}

message JoinRequest {
  // csr_der is a PKCS#10 request in DER. Only its public key is used.
  bytes csr_der = 1;
  // join_token is the node group's join token, anixjoin_ followed by the
  // base64url encoding of 32 random bytes. It is the only credential of the
  // call; no client certificate is needed.
  string join_token = 2;
  // machine_fingerprint is the lowercase hex SHA-256 of "anixops-join-v1\n"
  // followed by the machine ID from /etc/machine-id. It is never
  // authentication: it only selects which node of the group the machine may
  // rejoin, and only under the rejoin rule, because cloned images often
  // share a machine ID.
  string machine_fingerprint = 3;
  // hostname is the machine's host name. A new node is named after it when
  // requested_name is empty.
  string hostname = 4;
  // requested_name is the node name the operator asked for (install.sh
  // --name). Control makes a new node's name unique within the group with a
  // -2, -3 suffix.
  string requested_name = 5;
  // connect_host is the address clients connect to (install.sh --host). When
  // it is empty, a new node's host is the first entry of public_addresses.
  string connect_host = 6;
  // public_addresses are the machine's addresses as Control sees them, from
  // GET /install/ip over IPv4 and IPv6, IPv4 first. The installer passes
  // them because the gRPC peer address is a proxy's when Control sits behind
  // one. A rejoin needs one of them to equal the node's last known public
  // address.
  repeated string public_addresses = 7;
  // arch and os are the Agent's GOARCH and GOOS, such as "amd64" and
  // "linux".
  string arch = 8;
  string os = 9;
  // agent_version and instance_id are recorded with the enrollment.
  string agent_version = 10;
  string instance_id = 11;
  // reset (install.sh --reset) asks for a new node: Control never rejoins
  // the machine's earlier node and always creates one.
  bool reset = 12;
}

message JoinResponse {
  // certificate is the node's agent certificate, issued as Enroll issues it.
  AgentCertificate certificate = 1;
  // node is the node's identity name, "proxy-<id>" or "forward-<id>" by the
  // kind of the group: the node the Agent runs as.
  string node = 2;
  // node_name is the node's display name.
  string node_name = 3;
  // group is the name of the node's group.
  string group = 4;
  // created is true when Control created the node, and false when the
  // machine rejoined its earlier node.
  bool created = 5;
  // approval is "approved", or "pending" when the node's group requires
  // approval and an administrator has not approved the node yet. A pending
  // node connects with its certificate, but Control withholds its config.v1
  // and users.v1 snapshots until it is approved.
  string approval = 6;
}

message RenewAgentCertificateRequest {
  // csr_der is a PKCS#10 request in DER for the new key pair.
  bytes csr_der = 1;
}

message RenewAgentCertificateResponse {
  AgentCertificate certificate = 1;
}

message GetAgentTrustBundleRequest {}

message GetAgentTrustBundleResponse {
  // trust_bundle_der holds every CA certificate that may have signed a valid
  // agent certificate: the current and next CAs, and retired CAs until the
  // certificates they signed have expired.
  repeated bytes trust_bundle_der = 1;
}

message AgentCertificate {
  bytes certificate_der = 1;
  repeated bytes trust_bundle_der = 2;
  // spiffe_id is the certificate's URI SAN.
  string spiffe_id = 3;
  // node is "proxy-<id>" or "forward-<id>".
  string node = 4;
  // serial is the certificate serial number, lowercase hex.
  string serial = 5;
  int64 not_after_unix = 6;
  // renew_after_unix is when the agent should renew: two thirds of the
  // lifetime.
  int64 renew_after_unix = 7;
}

message IssueLinkCertificateRequest {
  // csr_der is a PKCS#10 request in DER for the link key pair (ECDSA P-256
  // recommended; P-384, Ed25519 and RSA of at least 2048 bits are accepted).
  // Its SANs may only be the node's DNS name and its SPIFFE ID; Control
  // assigns both whether or not the request names them.
  bytes csr_der = 1;
}

message IssueLinkCertificateResponse {
  LinkCertificate certificate = 1;
}

message GetLinkTrustBundleRequest {}

message GetLinkTrustBundleResponse {
  // trust_bundle_der holds every forward link CA certificate that may have
  // signed a valid link certificate: the current and next link CAs, and
  // retired ones until the link certificates they signed have expired.
  repeated bytes trust_bundle_der = 1;
}

message LinkCertificate {
  bytes certificate_der = 1;
  // trust_bundle_der is the link trust bundle (GetLinkTrustBundleResponse).
  repeated bytes trust_bundle_der = 2;
  // spiffe_id is the certificate's URI SAN: the node's agent identity.
  string spiffe_id = 3;
  // node is "proxy-<id>" or "forward-<id>".
  string node = 4;
  // dns_name is the certificate's only DNS name and its subject common
  // name: the node's identity name, which peers dial as the server name.
  string dns_name = 5;
  // serial is the certificate serial number, lowercase hex.
  string serial = 6;
  int64 not_after_unix = 7;
  // renew_after_unix is when the Agent should request a new link
  // certificate: two thirds of the lifetime.
  int64 renew_after_unix = 8;
}
