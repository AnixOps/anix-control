syntax = "proto3";

package anix.agent.v1;

option go_package = "github.com/AnixOps/anix-control/sdk/api/agent/v1;agentv1pb";

service AgentControlService {
  rpc ControlStream(stream AgentToControl) returns (stream ControlToAgent);
}

message Capability {
  string name = 1;
  string version = 2;
  map<string, string> attributes = 3;
}

message Hello {
  string protocol = 1;
  string agent_version = 2;
  string instance_id = 3;
  repeated Capability capabilities = 4;
  map<string, string> labels = 5;
  // config_revision is the revision of the last ConfigSnapshot the Agent
  // applied, 0 for none. Control reads it only when config.v1 is negotiated.
  uint64 config_revision = 6;
  // users_cursor is the cursor of the last UserDelta the Agent applied, 0 for
  // none. Control reads it only when users.v1 is negotiated.
  uint64 users_cursor = 7;
}

message HelloAck {
  string session_id = 1;
  int64 server_time_unix_ms = 2;
  uint32 heartbeat_interval_seconds = 3;
  uint64 desired_revision = 4;
  // server_capabilities lists the data-plane features this Control serves on
  // the stream: config.v1, users.v1, reports.v1 and package-reports.v1
  // (Capability name "config", "users", "reports" or "package-reports",
  // version "v1"). A feature is in use on a session only
  // when Hello.capabilities lists it too. Empty from a Control that serves
  // none; Agents built before this field ignore it.
  repeated Capability server_capabilities = 5;
}

message Heartbeat {
  string session_id = 1;
  int64 uptime_seconds = 2;
  uint64 observed_revision = 3;
  map<string, double> metrics = 4;
  repeated PluginObservedState plugin_observations = 5;
}

// PluginObservedState is a bounded, non-secret runtime observation emitted by
// an enabled Agent plugin. The kernel binds this to the operation version,
// revision, and config hash before a topology can be promoted.
message PluginObservedState {
  string plugin_id = 1;
  string version = 2;
  uint64 desired_revision = 3;
  uint64 observed_revision = 4;
  string config_hash = 5;
  string health = 6;
  string ruleset_sha256 = 7;
  int64 observed_at_unix_ms = 8;
  repeated PluginRuleCounter rule_counters = 9;
}

message PluginRuleCounter {
  string rule_id = 1;
  uint64 packets = 2;
  uint64 bytes = 3;
}

message HeartbeatAck {
  string session_id = 1;
  int64 server_time_unix_ms = 2;
  uint64 desired_revision = 3;
}

message DesiredOperation {
  string operation_id = 1;
  string kind = 2;
  uint64 revision = 3;
  bytes payload_json = 4;
  int64 deadline_unix_ms = 5;
}

message OperationAck {
  string operation_id = 1;
  bool accepted = 2;
  string error = 3;
  int64 accepted_at_unix_ms = 4;
  string session_id = 5;
  uint64 revision = 6;
}

enum ObservedPhase {
  OBSERVED_PHASE_UNSPECIFIED = 0;
  OBSERVED_PHASE_ACCEPTED = 1;
  OBSERVED_PHASE_APPLYING = 2;
  OBSERVED_PHASE_SUCCEEDED = 3;
  OBSERVED_PHASE_FAILED = 4;
  OBSERVED_PHASE_SUPERSEDED = 5;
}

message ObservedState {
  string operation_id = 1;
  uint64 revision = 2;
  ObservedPhase phase = 3;
  string message = 4;
  bytes state_json = 5;
  int64 observed_at_unix_ms = 6;
  string session_id = 7;
}

message AgentToControl {
  string request_id = 1;
  uint32 node_id = 2;
  uint64 revision = 3;
  int64 sent_at_unix_ms = 4;

  oneof payload {
    Hello hello = 10;
    Heartbeat heartbeat = 11;
    OperationAck operation_ack = 12;
    ObservedState observed_state = 13;
    // Data plane. Sent only when the capability is negotiated (see
    // HelloAck.server_capabilities): config_status with config.v1, the others
    // with reports.v1.
    ConfigStatus config_status = 14;
    TrafficReport traffic = 15;
    LogBatch logs = 16;
    NodeStatus status = 17;
    // Sent only with package-reports.v1 negotiated. Never acknowledged.
    PackageReport package_report = 18;
  }
}

message ControlToAgent {
  string request_id = 1;
  uint32 node_id = 2;
  uint64 revision = 3;
  int64 sent_at_unix_ms = 4;

  oneof payload {
    HelloAck hello_ack = 10;
    HeartbeatAck heartbeat_ack = 11;
    DesiredOperation desired_operation = 12;
    // Data plane. Sent only when the capability is negotiated (see
    // HelloAck.server_capabilities): config with config.v1, users with
    // users.v1, report_ack in answer to a report sent with reports.v1.
    ConfigSnapshot config = 13;
    UserDelta users = 14;
    ReportAck report_ack = 15;
  }
}

// ConfigSnapshot is a node's whole configuration at one revision (config.v1).
// Control sends it after HelloAck when Hello.config_revision is older, and
// whenever the node's desired configuration changes. It replaces what the
// Agent runs, so a lost or repeated snapshot is harmless.
message ConfigSnapshot {
  // config_revision increases with every change of the node's desired
  // configuration.
  uint64 config_revision = 1;
  // config_hash is the lowercase hex SHA-256 of the exact config_json bytes.
  string config_hash = 2;
  // format names the schema of config_json. An Agent that does not know it
  // answers ConfigStatus with applied false.
  string format = 3;
  bytes config_json = 4;
}

// ConfigStatus answers a ConfigSnapshot (config.v1): applied, or failed with
// an error. A failure becomes the node's runtime health.
message ConfigStatus {
  uint64 config_revision = 1;
  string config_hash = 2;
  bool applied = 3;
  string error = 4;
}

// NodeUser is one user the node serves.
message NodeUser {
  uint64 user_id = 1;
  string uuid = 2;
  // speed_limit_mbps is 0 for no limit.
  int64 speed_limit_mbps = 3;
  // device_limit is 0 for no limit.
  int32 device_limit = 4;
  // extra_json holds protocol-specific fields, such as WireGuard peer keys.
  bytes extra_json = 5;
}

// UserDelta carries the node's user changes after the Agent's cursor
// (users.v1). One delta may span several messages: the Agent applies them
// together when the one with last_page arrives, then stores cursor and
// resumes from it in Hello.users_cursor. With full, the pages together are
// the node's whole user set and replace the Agent's; otherwise they are
// changes, applied in order.
message UserDelta {
  uint64 cursor = 1;
  bool full = 2;
  bool last_page = 3;
  repeated NodeUser upserts = 4;
  repeated uint64 removed_user_ids = 5;
}

// TrafficReport carries per-user traffic and online IPs for one window
// (reports.v1). Control records a batch_id once and answers ReportAck.
message TrafficReport {
  // batch_id is unique per node and kept when the batch is resent:
  // node:<kind>-<id>:<boot id>:<sequence>.
  string batch_id = 1;
  repeated UserTraffic users = 2;
  repeated OnlineUser online = 3;
  int64 window_end_unix_ms = 4;
}

// UserTraffic is one user's traffic in a TrafficReport window.
message UserTraffic {
  uint64 user_id = 1;
  uint64 upload_bytes = 2;
  uint64 download_bytes = 3;
}

// OnlineUser is one user's online IPs at the end of a TrafficReport window.
message OnlineUser {
  uint64 user_id = 1;
  repeated string ips = 2;
}

// LogBatch carries node runtime logs (reports.v1). Control records a
// batch_id once and answers ReportAck.
message LogBatch {
  string batch_id = 1;
  repeated LogEntry entries = 2;
}

// LogEntry is one node runtime log line.
message LogEntry {
  // level is debug, info, warning or error.
  string level = 1;
  string source = 2;
  string message = 3;
  int64 logged_at_unix_ms = 4;
  // fields_json is a JSON object of structured fields, without secrets.
  bytes fields_json = 5;
  string trace_id = 6;
}

// ReportAck answers a TrafficReport or LogBatch by batch_id. applied is true
// when this delivery recorded the batch, and false when Control had recorded
// it before (error empty) or refuses it for good (error set). In each case the
// Agent drops the batch from its spool. Control sends no ReportAck for a batch
// it cannot record for now, and the Agent resends it later.
message ReportAck {
  string batch_id = 1;
  bool applied = 2;
  string error = 3;
}

// NodeStatus is the node's system and runtime health (reports.v1). Each one
// replaces the previous; Control does not acknowledge it.
message NodeStatus {
  double cpu_usage_percent = 1;
  double memory_usage_percent = 2;
  double disk_usage_percent = 3;
  // uptime_seconds counts from the Agent's start.
  int64 uptime_seconds = 4;
  bool runtime_healthy = 5;
  string runtime_error = 6;
  int64 observed_at_unix_ms = 7;
}

// PackageReport is the latest observation of one kind that an Agent plugin
// package reports for the node (package-reports.v1). Each one replaces the
// previous report of the same node, plugin_id and kind; Control keeps no
// history and does not acknowledge it, and the Agent neither spools nor
// resends it. Control accepts it only when the node's assigned release of
// plugin_id at version is a signed official Agent release whose manifest
// declares the capability Control requires for kind; otherwise it drops the
// report and the stream stays open. PROTOCOL.md, "Package reports".
message PackageReport {
  // plugin_id is the package that produced the report.
  string plugin_id = 1;
  // kind names the payload schema, lowercase dot-separated words such as
  // systemd.services; a new schema version is a new kind.
  string kind = 2;
  // version is the release of plugin_id the Agent runs; it must be the
  // version assigned to the node.
  string version = 3;
  // payload_json is a JSON object in the schema of kind, at most 256 KiB.
  bytes payload_json = 4;
  // observed_at_unix_ms is when the plugin took the observation; 0 means
  // when Control received it.
  int64 observed_at_unix_ms = 5;
}
