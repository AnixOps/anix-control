# V2Board Go Backend - Docker Compose
# 零依赖部署：SQLite + 内存缓存

services:
  v2board:
    build: .
    container_name: v2board
    ports:
      - "8080:8080"    # HTTP API
      - "50051:50051"  # gRPC
    volumes:
      - ./config:/app/config
      - ./data:/app/data
      - ./logs:/app/logs
      - ./public:/app/public
    environment:
      - TZ=Asia/Shanghai
      - GIN_MODE=release
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

