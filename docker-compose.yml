# V2Board Go Backend Docker Compose
# 默认使用 SQLite，无需额外数据库服务

services:
  v2board:
    build: .
    container_name: v2board
    ports:
      - "8080:8080"
    volumes:
      - ./config:/app/config
      - ./data:/app/data      # SQLite 数据库
      - ./logs:/app/logs
    environment:
      - TZ=Asia/Shanghai
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - v2board

  redis:
    image: redis:7-alpine
    container_name: v2board-redis
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - v2board

volumes:
  redis_data:

networks:
  v2board:
    driver: bridge

