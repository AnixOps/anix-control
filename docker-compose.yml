# V2Board Go Backend Docker Compose
# 零依赖部署：SQLite + 内存缓存

services:
  v2board:
    build: .
    container_name: v2board
    ports:
      - "8080:8080"
    volumes:
      - ./config:/app/config
      - ./data:/app/data      # SQLite 数据库
      - ./logs:/app/logs
    environment:
      - TZ=Asia/Shanghai
    restart: unless-stopped

