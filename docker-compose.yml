# V2Board Go Backend - Docker Compose
# 零依赖部署：SQLite + 内存缓存

services:
  v2board:
    build: .
    container_name: v2board
    ports:
      - "${PANEL_API_PORT:-8080}:8080"        # HTTP API
      - "${PANEL_FRONTEND_PORT:-3000}:3000"   # Frontend/UI
      - "${PANEL_GRPC_PORT:-50051}:50051"     # gRPC
    volumes:
      - ./config:/app/config
      - ./config/data:/app/config/data
      - ./config/deploy/ssh:/home/v2board/.ssh:ro
      - ./logs:/app/logs
      - ./web/public:/app/web/public
    environment:
      - TZ=${TZ:-Asia/Shanghai}
      - GIN_MODE=${GIN_MODE:-release}
      - HOME=/home/v2board
      - ANSIBLE_CONFIG=/app/config/deploy/ansible/ansible.cfg
      - FORWARD_RUNTIME_NODEX_MODE=${FORWARD_RUNTIME_NODEX_MODE:-}
      - FORWARD_RUNTIME_BACKEND=${FORWARD_RUNTIME_BACKEND:-gost}
      - FORWARD_RUNTIME_ANSIBLE_CONFIG_JSON=${FORWARD_RUNTIME_ANSIBLE_CONFIG_JSON:-}
      - FORWARD_RUNTIME_ANSIBLE_INVENTORY=${FORWARD_RUNTIME_ANSIBLE_INVENTORY:-}
      - FORWARD_RUNTIME_ANSIBLE_BECOME=${FORWARD_RUNTIME_ANSIBLE_BECOME:-}
      - FORWARD_RUNTIME_ANSIBLE_HOST_ALIAS=${FORWARD_RUNTIME_ANSIBLE_HOST_ALIAS:-}
      - FORWARD_RUNTIME_ANSIBLE_HOST=${FORWARD_RUNTIME_ANSIBLE_HOST:-}
      - FORWARD_RUNTIME_ANSIBLE_PORT=${FORWARD_RUNTIME_ANSIBLE_PORT:-}
      - FORWARD_RUNTIME_ANSIBLE_USER=${FORWARD_RUNTIME_ANSIBLE_USER:-}
      - FORWARD_RUNTIME_ANSIBLE_PASSWORD=${FORWARD_RUNTIME_ANSIBLE_PASSWORD:-}
      - FORWARD_RUNTIME_ANSIBLE_BECOME_PASSWORD=${FORWARD_RUNTIME_ANSIBLE_BECOME_PASSWORD:-}
      - FORWARD_RUNTIME_NODEX_BASE_URL=${FORWARD_RUNTIME_NODEX_BASE_URL:-}
      - FORWARD_RUNTIME_NODEX_TOKEN=${FORWARD_RUNTIME_NODEX_TOKEN:-}
      - FORWARD_RUNTIME_NODEX_TIMEOUT_SECONDS=${FORWARD_RUNTIME_NODEX_TIMEOUT_SECONDS:-}
      - ANSIBLE_HOST_KEY_CHECKING=${ANSIBLE_HOST_KEY_CHECKING:-False}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

