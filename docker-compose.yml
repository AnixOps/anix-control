# AnixOps Control: local development stack.
#
# Builds the image from this checkout (Dockerfile "source" target) and runs a
# throwaway PostgreSQL next to it. Not for production: use
# docker-compose.prod.yml with a released image and an external database.
#
#   docker compose up -d --build
#   docker compose logs migrate      # generated admin password on first run
#   open http://127.0.0.1:3000
name: anix-control-dev

x-control: &control
  image: anix-control:dev
  build:
    context: .
    target: source
  environment:
    ANIX_CONTROL_ENV: development
    ANIX_CONTROL_DATABASE_HOST: postgres
    ANIX_CONTROL_DATABASE_USERNAME: anix_control
    ANIX_CONTROL_DATABASE_PASSWORD: anix_control
    ANIX_CONTROL_DATABASE_DATABASE: anix_control
    ANIX_CONTROL_JWT_SECRET: dev-only-jwt-secret-change-me
    ANIX_CONTROL_ADMIN_EMAIL: admin@anixops.local
  read_only: true
  tmpfs:
    - /tmp:rw,exec,mode=1777

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: anix_control
      POSTGRES_USER: anix_control
      POSTGRES_PASSWORD: anix_control
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U anix_control -d anix_control"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    <<: *control
    command: ["migrate"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      disable: true

  control:
    <<: *control
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:3000:3000"
      - "127.0.0.1:50051:50051"
    stop_grace_period: 90s

volumes:
  postgres-data:
