# Control's built-in values. A configuration file and the ANIX_CONTROL_*
# variables are overlaid on them key by key (internal/config/load.go). The
# operator keys (keys.go) come first; the other values are those of the keys
# that are no longer read, or of deprecated keys that are still read
# (deprecated_keys.yaml). Secrets have no value here: the root key in
# data_dir seals the stored ones and derives the rest.
env: "production"
# The panel's name (https://<domain>). With it Control obtains its own
# certificate (tls.mode acme) and runs the node gRPC listener.
domain: ""
# tls.mode external's plain http address; empty: 127.0.0.1:8080 (or the
# deprecated server.host, server.port and frontend.port when they are set).
listen: ""
# The data directory: root.key (mode 0600, directory 0700).
data_dir: "/var/lib/anix-control"
tls:
  # acme, files or external; empty: acme with domain, external without.
  mode: ""
  cert_file: ""
  key_file: ""
server:
  # Deprecated: tls.mode external's plain listener while listen is unset
  # (empty host: loopback; port 0: 8080).
  host: ""
  port: 0
  mode: "release"
  read_timeout: 30
  write_timeout: 30
  # Keep serving for this long after /readyz starts failing on shutdown.
  shutdown_drain_delay: "5s"
  # Reverse proxies whose X-Forwarded-For/Proto/Host are honoured. Loopback
  # only: a proxy in another container, host or pod must be added
  # (docs/DEPLOYMENT.md, "Reverse proxies"); an empty list trusts none.
  trusted_proxies: ["127.0.0.1/32", "::1/128"]
  cors:
    allowed_origins: []
    allowed_methods: ["GET", "POST", "PUT", "DELETE", "OPTIONS", "PATCH"]
    allowed_headers: ["Content-Type", "Authorization", "X-API-Key"]
    allow_credentials: false
    max_age: 86400
frontend:
  enable: true
  # Deprecated: a second plain listener of tls.mode external (0: none).
  port: 0
  path: "web/public"
# Without a configuration file (containers); a file's database keys replace
# this section as a whole while PostgreSQL is supported.
database:
  driver: "postgres"
  host: "127.0.0.1"
  port: 5432
  username: "anix_control"
  database: "anix_control"
  sslmode: "disable"
  timezone: "Asia/Shanghai"
  log_level: "error"
  max_idle_conns: 10
  max_open_conns: 50
  conn_max_lifetime: 3600
log:
  format: "text"
  level: "info"
jwt:
  expire: 86400
auth:
  login_rate_limit:
    enabled: true
    max_attempts: 6
    window_seconds: 300
    lockout_seconds: 600
  register_rate_limit:
    enabled: true
    max_attempts: 5
    window_seconds: 3600
    lockout_seconds: 3600
  registration:
    enabled: true
    require_invite: false
app:
  traffic_log_enable: true
  subscribe_path: "s"
plugins:
  official_public_key: "jW26nr2tbthASoeq6RmIpx8Ah+uhPNIv9V1ewRVb1VE="
  control_poll_interval: "5s"
  # Empty host directories use private temporary directories under $TMPDIR;
  # package artifacts are re-materialized from the database on start.
  control_host_runtime_dir: ""
  control_host_artifact_dir: ""
  control_host_startup_timeout: "5s"
  control_host_request_timeout: "30s"
  control_host_websocket_session_timeout: "24h"
module_runtime:
  # Network modules (separate services over gRPC with mTLS). Off by default:
  # every package runs as a local child process.
  enabled: false
  listen: ":7443"
  cluster: "default"
  pki: "builtin"
  cert_lifetime: "24h"
  bind_timeout: "2m"
  database_host: ""
forward_runtime:
  jobs:
    poll_interval: "5s"
    idle_poll_interval: "30s"
    error_log_interval: "1m"
    batch_size: 10
    timeout_seconds: 120
  gost_stats:
    poll_interval: "30s"
    idle_poll_interval: "2m"
    error_log_interval: "5m"
  latency:
    poll_interval: "60s"
    idle_poll_interval: "60s"
    error_log_interval: "5m"
    dials: 5
    dial_timeout: "3s"
    concurrency: 16
    retention_days: 7
grpc:
  # Always on with domain.
  enabled: false
  host: "0.0.0.0"
  port: 50051
  # The name nodes dial when domain sits behind a CDN; empty: domain.
  public_name: ""
agent_control:
  # Client certificates on the AnixOps Agent channels: off, optional,
  # preferred or required. Empty means required, the default from 4.2: the
  # AnixOps Agent channels accept enrolled (mTLS) agents only. preferred
  # (the 4.1 default) keeps legacy agents working with deprecation signals.
  mtls: ""
  # Sunset date of the legacy agent transports (YYYY-MM-DD); empty sends no
  # Sunset header.
  legacy_sunset: ""
agent_install:
  # One-command node onboarding (GET /install.sh, POST
  # /api/v4/kernel/agents/install-tokens). Empty public_url uses the
  # request's origin; empty agent_version uses the Agent release this Control
  # was released with (a development build: "v" + app.version).
  public_url: ""
  grpc_target: ""
  agent_version: ""
  artifact_dir: ""
  cn_mirror_url: ""
  signature_file: ""
alerts:
  # The alert monitor (GET /api/v4/kernel/alerts): certificates that were not
  # renewed in time, CAs close to their end, and phased processes (the node
  # credential split, the identity cutover) left in a non-final phase.
  enabled: true
  check_interval: "15m"
  # Upper bound, in days, for a leaf certificate's alert window; the window
  # is the smaller of this and a sixth of the certificate's lifetime.
  leaf_expiry_days: 14
  ca_expiry_days: 60
  renotify_interval: "24h"
  # "0" turns the phase alerts off.
  phase_stuck_after: "72h"
