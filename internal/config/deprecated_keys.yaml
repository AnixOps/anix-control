# The configuration keys that are not operator keys any more
# (docs/design/single-binary/README.md, section 5): every key of the 4.2
# configuration (the 151 keys of docs/reference/environment-variables.md as
# 4.2 shipped it, and the four keys the panel certificate work added and
# then replaced), and the keys historic templates carried. Control embeds
# this file; docs/reference/configuration.md shows it as a table
# (TestDeprecatedKeyReferenceIsCurrent).
#
# Every entry:
#   key:         the dotted YAML path; its variable is ANIX_CONTROL_ plus the
#                path upper-cased with dots turned into underscores
#   status:      read    - still applied, with a warning: the feature it
#                          selects still exists, and ignoring it would change
#                          what a running deployment does;
#                ignored - warned once and not applied: the built-in value
#                          (today's default) stands
#   removed_in:  the milestone (and pull request) that removes the key's
#                reader or its feature
#   reason:      why, for the warning
#   replacement: the operator key that takes over, when there is one
#   subtree:     the key and everything below it (a section a template had)
#   secret:      the value is a secret (never printed)
keys:
  # admin: the first administrator claims the panel with a one-time link (N10).
  - key: admin.email
    status: ignored
    removed_in: M2 (P9)
    reason: the first administrator claims the panel with a one-time link (anix-control admin claim-link); existing administrators are not affected
  - key: admin.password
    status: ignored
    removed_in: M2 (P9)
    reason: no administrator password is configured any more; the first administrator claims the panel with a one-time link (anix-control admin claim-link) and existing administrators keep theirs, so remove it
    secret: true

  # agent_control: the Agent channels accept enrolled Agents only.
  - key: agent_control.legacy_sunset
    status: ignored
    removed_in: M5
    reason: the legacy Agent transports send no Sunset date; Agents enroll (agent_control.mtls is fixed to required)
  - key: agent_control.mtls
    status: ignored
    removed_in: M5
    reason: fixed to required, the 4.2 default; the other modes are removed with the legacy Agent transports

  # agent_install: derived from domain, or read until a later milestone.
  - key: agent_install.agent_version
    status: read
    removed_in: M4 (S9)
    reason: pins the Agent release nodes install until Control carries its Agent release manifest
  - key: agent_install.artifact_dir
    status: read
    removed_in: M4 (N30)
    reason: serves Agent releases from this directory until Control downloads and verifies them itself
  - key: agent_install.cn_mirror_url
    status: read
    removed_in: M4 (N30)
    reason: the mainland download mirror of Agent releases, until Control serves the releases itself
  - key: agent_install.grpc_target
    status: read
    removed_in: M2 (P11)
    reason: overrides the gRPC address nodes dial, which is derived from grpc.public_name (or domain) and grpc.port
    replacement: grpc.public_name
  - key: agent_install.public_url
    status: read
    removed_in: M2 (P11)
    reason: overrides the panel address nodes use, which is https://<domain>; config rewrite turns its host into domain
    replacement: domain
  - key: agent_install.signature_file
    status: read
    removed_in: M2 (P11)
    reason: the release signature of the Agent install script, until the signature is built into the binary

  # alerts: the built-in values are the 4.2 defaults.
  - key: alerts.ca_expiry_days
    status: ignored
    removed_in: M2 (P8)
    reason: a built-in value (60 days)
  - key: alerts.check_interval
    status: ignored
