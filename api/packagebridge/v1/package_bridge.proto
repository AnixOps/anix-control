syntax = "proto3";

package anixops.packagebridge.v1;

option go_package = "github.com/AnixOps/anix-control/v4/api/packagebridge/v1;packagebridgev1";

// KernelPackageBridge is a private, per-host channel. It exposes named
// kernel operations only; package hosts never receive kernel database or
// signing credentials.
//
// Invoke and OpenWebSocket require a single-use capability minted for one
// request. Session-scoped RPCs (GetPackageConfig) need no capability: the
// inherited socket is bound to one package id, version and lifecycle
// generation, and the kernel fences every call against the current
// installation.
service KernelPackageBridge {
  rpc Invoke(InvokeRequest) returns (InvokeResponse);
  rpc OpenWebSocket(stream WebSocketFrame) returns (stream WebSocketFrame);
  rpc GetPackageConfig(GetPackageConfigRequest) returns (GetPackageConfigResponse);
  // LeaseStorage issues database credentials for the calling package's own
  // least-privilege storage. Like GetPackageConfig it is authorized by the
  // session identity and fenced against the installation.
  rpc LeaseStorage(LeaseStorageRequest) returns (LeaseStorageResponse);
  // Bind attaches a remote module instance to the current installation
  // generation. It is the only bridge RPC a remote module may call without a
  // session token; its identity comes from the mTLS client certificate. Local
  // hosts never call it: their session is bound to the inherited socketpair.
  rpc Bind(BindRequest) returns (BindResponse);
  // Heartbeat keeps a bound session alive and reports fencing. Remote
  // modules send it with the x-anix-bridge-session metadata.
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);
}

message GetPackageConfigRequest {}

// GetPackageConfigResponse is the host's view of its installation
// configuration. route_modes maps v2 route ids to legacy, shadow or native;
// routes that are absent run in legacy mode.
message GetPackageConfigResponse {
  int64 revision = 1;
  string config_hash = 2;
  map<string, string> route_modes = 3;
}

message LeaseStorageRequest {}

message LeaseStorageResponse {
  // driver is "postgres" or "sqlite".
  string driver = 1;
  // dsn connects as the package role (postgres) or names the shared database
  // file (sqlite). It never carries kernel credentials.
  string dsn = 2;
  // schema holds the package's own tables on postgres; empty on sqlite.
  string schema = 3;
  // table_prefix names the package's own tables on sqlite; empty on postgres.
  string table_prefix = 4;
  int64 lease_generation = 5;
  repeated string adopted_tables = 6;
  repeated string views = 7;
}

message BindRequest {
  string package_id = 1;
  string package_version = 2;
  // instance_id is unique per module process, for example the pod name.
  string instance_id = 3;
  // advertise_addr is the host:port the kernel dials for ControlPackageHost.
  string advertise_addr = 4;
  // lease_id is the random per-process lease the module also reports from
  // Health.
  string lease_id = 5;
  // image_digest is the module's reported OCI image digest. It is advisory:
  // the kernel cannot prove what a remote process runs.
  string image_digest = 6;
}

message BindResponse {
  // session_token authorizes every later bridge RPC of this instance when
  // presented as x-anix-bridge-session together with the same client
  // certificate.
  bytes session_token = 1;
  uint64 route_generation = 2;
  int64 heartbeat_interval_millis = 3;
  int64 session_ttl_millis = 4;
}

message HeartbeatRequest {
  uint64 in_flight = 1;
}

message HeartbeatResponse {
  uint64 route_generation = 1;
  // fenced means the session's generation is no longer current; the module
  // must stop serving it and Bind again.
  bool fenced = 2;
  bool draining = 3;
}

message InvokeRequest {
  bytes capability = 1;
  string operation = 2;
  bytes payload = 3;
}

message InvokeResponse {
  bytes response_body = 1;
  uint32 status_code = 2;
  repeated ResponseHeader headers = 3;
}

message ResponseHeader {
  string name = 1;
  string value = 2;
}

// WebSocketFrame is available only on the private inherited bridge. The first
// client frame must be an open frame; every later frame is data or close.
message WebSocketFrame {
  oneof value {
    WebSocketOpen open = 1;
    bytes data = 2;
    WebSocketClose close = 3;
  }
}

message WebSocketOpen {
  bytes capability = 1;
  string operation = 2;
}

message WebSocketClose {
  uint32 code = 1;
  string reason = 2;
}
