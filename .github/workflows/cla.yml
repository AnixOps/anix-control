name: CLA

# Checks the Contributor License Agreement (CLA.md) on every pull request with
# .github/scripts/check_cla.py: every commit author has a line in
# .github/cla-signatures.txt (the repository owner and bot accounts are
# exempt), a pull request adds signature lines only for its own author, and no
# existing signature is removed or changed. Read-only; no third-party action.

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  cla:
    name: CLA
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Self-test the checker
        run: python3 .github/scripts/check_cla.py --self-test

      - name: Collect the commit authors and the signature changes
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          gh api "repos/${REPO}/pulls/${PR}/commits" --paginate \
            --jq '.[] | (.author.login // ("UNLINKED:" + .sha[0:7]))' > "${RUNNER_TEMP}/commits.txt"
          gh api "repos/${REPO}/pulls/${PR}/files" --paginate \
            --jq '.[] | select(.filename == ".github/cla-signatures.txt") | .patch // ""' > "${RUNNER_TEMP}/patch.txt"
          echo "Commit authors:"; sort -u "${RUNNER_TEMP}/commits.txt"

      - name: Check the CLA
        env:
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          python3 .github/scripts/check_cla.py --author "${AUTHOR}" \
            --commits "${RUNNER_TEMP}/commits.txt" --patch "${RUNNER_TEMP}/patch.txt" \
            --signatures .github/cla-signatures.txt
