name: Frontend Visual Baselines

# Regenerates the visual regression baselines (web/e2e/visual/__screenshots__)
# in the same Playwright image as the "Frontend Visual Regression" CI job, for
# contributors without docker. Run it on a branch, download the artifact and
# commit the PNGs it contains to web/e2e/visual/__screenshots__/. With
# `commit`, the run commits the changed PNGs to the branch itself and, since a
# push with the workflow token starts no pull request run, starts the CI/CD
# Pipeline on the branch (for sessions that cannot download artifacts).
on:
  workflow_dispatch:
    inputs:
      commit:
        description: Commit the changed baselines to the branch and run CI on it
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  baselines:
    name: Regenerate visual baselines
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
      options: --ipc=host
    timeout-minutes: 20
    # Write access is used only by the `commit` steps; dispatching the
    # workflow already needs write access to the repository.
    permissions:
      contents: write
      actions: write
    steps:
      # The Playwright image has no git, without which the checkout has no
      # repository to commit to.
      - name: Install git
        if: inputs.commit
        run: apt-get update && apt-get install -y --no-install-recommends git ca-certificates

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Rewrite the baselines
        working-directory: web
        env:
          HOME: /root
        run: npx playwright test --config playwright.visual.config.js --update-snapshots

      - name: Upload the baselines
        uses: actions/upload-artifact@v7
        with:
          name: frontend-visual-baselines
          path: web/e2e/visual/__screenshots__/

      - name: Commit the baselines
        if: inputs.commit && github.ref_type == 'branch' && github.ref_name != 'main' && !startsWith(github.ref_name, 'release/')
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
        run: |
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"
          git add -A web/e2e/visual/__screenshots__
          if git diff --cached --quiet; then
            echo "The baselines are unchanged."
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m "test(visual): regenerate the visual baselines"
          git push origin "HEAD:refs/heads/${BRANCH}"
          curl -fsS -X POST -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/dispatches" \
            -d "{\"ref\":\"${BRANCH}\"}"
