name: CI/CD Pipeline

# Maintenance branches (release/vX.Y, docs/RELEASING.md) get the same checks
# as go_dev: their pull requests run the fast lane and their pushes the full
# lane. Release tags may be on either.
on:
  push:
    branches: [ go_dev, 'release/**' ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ go_dev, 'release/**' ]
    types: [ opened, synchronize, reopened, labeled ]
  schedule:
    # Nightly full run on go_dev.
    - cron: '17 19 * * *'
  workflow_dispatch:

# Superseded pull-request runs are cancelled; go_dev and release branch pushes,
# tags and manual runs always finish so release and baseline evidence is never
# cut short.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GO_VERSION: '1.26.8'
  NODE_VERSION: '22'
  GOST_VERSION: '3.2.6'
  GOST_LINUX_AMD64_ARCHIVE_SHA256: 'b39037b0380ea001fb3c0c28441c2e10bfc694f90682739a65b53e55dce5238b'
  GOST_LINUX_AMD64_BINARY_SHA256: 'a2aea24efb4597b5f57b35b8e1bbcc59f439b80723854d4371f6828b46682ffb'
  GOST_LINUX_ARM64_ARCHIVE_SHA256: 'f674c8f4a033dc1dfd4f0d5e9602fbe5b0d0f81307bf3794f44b5b5d6d622eae'
  GOST_LINUX_ARM64_BINARY_SHA256: '343c3e003996ca0437b9cc47dd1500cd0475ba09f5a5f17e50851854e06a1ca7'

jobs:
  changes:
    name: Classify Changes
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.classify.outputs.full }}
      code: ${{ steps.classify.outputs.code }}
      web: ${{ steps.classify.outputs.web }}
      db: ${{ steps.classify.outputs.db }}
      modules: ${{ steps.classify.outputs.modules }}
      forward: ${{ steps.classify.outputs.forward }}
      agent: ${{ steps.classify.outputs.agent }}
      packages: ${{ steps.classify.outputs.packages }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Pull requests run the fast lane: required checks plus the heavy jobs
      # whose paths changed (config/scripts/classify_changes.py). Pushes,
      # tags, the nightly schedule, manual runs and the ci:full label run
      # everything.
      - name: Classify the change
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          FULL_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'ci:full') }}
        run: |
          python3 config/scripts/classify_changes.py \
            --event "${EVENT_NAME}" --base "${BASE_SHA}" --head "${HEAD_SHA:-HEAD}" \
            --full-label "${FULL_LABEL}" | tee -a "$GITHUB_OUTPUT"

  tag-gate:
    name: Validate Release Tag
    runs-on: ubuntu-latest
    outputs:
      is_release_tag: ${{ steps.check.outputs.is_release_tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Check the release tag and version
        id: check
        shell: bash
        run: |
          set -Eeuo pipefail
          if [[ "${GITHUB_EVENT_NAME}" == "push" && "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)(\.[0-9]+)?)?$ ]]; then
            # The tree must declare the tagged version (config/scripts/prepare_release.py sets it).
            python3 config/scripts/check_release_version.py --tag "${GITHUB_REF_NAME}"
            echo "is_release_tag=true" >> "$GITHUB_OUTPUT"
            echo "Release tag accepted: ${GITHUB_REF_NAME}"
          else
            echo "is_release_tag=false" >> "$GITHUB_OUTPUT"
            echo "Not a release tag; release jobs are skipped."
          fi

  deploy-script-test:
    name: Deployment Script Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Validate panel deploy script syntax
        run: bash -n config/deploy/deploy_panel.sh

      - name: Validate local build cleanup script syntax
        run: bash -n config/deploy/clean_local_build_artifacts.sh

      - name: Validate release installer syntax
        run: |
          bash -n install.sh
          bash -n scripts/install.sh

      - name: Test identity bootstrap installer configuration
        run: bash scripts/tests/test_identity_bootstrap_install.sh

      # Fresh Control installs generate the CA key and enable gRPC TLS for
      # Agents (systemd installer, Compose init-secrets.sh): shellcheck, then
      # the fake-root tests.
      - name: Lint the Control installers
        run: |
          shellcheck -x scripts/install.sh config/deploy/compose/init-secrets.sh config/deploy/grpc_tls/setup_certbot.sh \
            scripts/tests/test_control_install_agent_access.sh scripts/tests/test_compose_init_secrets.sh

      - name: Test Control installer Agent access in a fake root
        run: |
          bash scripts/tests/test_control_install_agent_access.sh
          bash scripts/tests/test_compose_init_secrets.sh

      # The Agent installer Control serves at /install.sh (one-command node
      # onboarding): shellcheck, then the fake-root tests.
      - name: Lint the Agent installer
        run: shellcheck internal/agentinstall/install.sh scripts/tests/test_agent_install.sh

      - name: Test the Agent installer in a fake root
        run: bash scripts/tests/test_agent_install.sh

      - name: Validate PostgreSQL restore rehearsal syntax
        run: bash -n scripts/postgres_restore_rehearsal.sh

      - name: Validate plugin package release scripts
        run: |
          bash -n packages/machine-telemetry/tests/release_gate.sh
          bash -n packages/nftables-forward/tests/release_gate.sh
          bash -n packages/gost-mesh/tests/release_gate.sh
          bash -n packages/nat-egress/tests/release_gate.sh
          bash -n scripts/sign_plugin_release.sh
          python3 -m py_compile packages/machine-telemetry/build.py packages/machine-telemetry/verify_signature.py
          python3 -m py_compile packages/nftables-forward/build.py packages/nftables-forward/verify_signature.py
          python3 -m py_compile packages/gost-mesh/build.py packages/gost-mesh/verify_signature.py
          python3 -m py_compile packages/nat-egress/build.py packages/nat-egress/verify_signature.py

      - name: Validate release build policy script syntax
        run: bash -n config/deploy/check_release_build_policy.sh

      - name: Validate release manifest script syntax
        run: python3 -m py_compile config/scripts/generate_release_manifest.py

      - name: Validate release notes script syntax
        run: python3 -m py_compile config/scripts/generate_release_notes.py

      - name: Validate release version script syntax
        run: python3 -m py_compile config/scripts/check_release_version.py config/scripts/prepare_release.py

      - name: Validate release artifact verification script syntax
        run: python3 -m py_compile config/scripts/verify_release_artifacts.py

      - name: Validate legacy deploy script syntax
        run: bash -n config/scripts/deploy.sh

      - name: Validate legacy pre-deploy script syntax
        run: bash -n config/scripts/pre-deploy.sh

      - name: Validate Agent SDK dependency gate syntax
        run: bash -n config/scripts/check_agent_sdk_dependency.sh

      - name: Run panel deploy script self-test
        run: bash config/deploy/deploy_panel.sh --self-test

      - name: Run local build cleanup script self-test
        run: bash config/deploy/clean_local_build_artifacts.sh --self-test

      - name: Run release build policy self-test
        run: bash config/deploy/check_release_build_policy.sh --self-test

      - name: Run release manifest self-test
        run: python3 config/scripts/generate_release_manifest.py --self-test

      - name: Run release notes self-test
        run: python3 config/scripts/generate_release_notes.py --self-test

      - name: Run release version self-test
        run: python3 config/scripts/check_release_version.py --self-test

      - name: Run release preparation self-test
        run: python3 config/scripts/prepare_release.py --self-test

      - name: Run change classifier self-test
        run: python3 config/scripts/classify_changes.py --self-test

      - name: Run test shard planner self-test
        run: python3 config/scripts/plan_test_shards.py --self-test

      - name: Run release artifact verification self-test
        run: python3 config/scripts/verify_release_artifacts.py --self-test

      - name: Run PostgreSQL restore rehearsal self-test
        run: bash scripts/postgres_restore_rehearsal.sh --self-test

      - name: Enforce release build policy
        run: bash config/deploy/check_release_build_policy.sh

      - name: Run legacy deploy guard self-test
        run: bash config/scripts/deploy.sh --self-test

      - name: Run legacy pre-deploy guard self-test
        run: bash config/scripts/pre-deploy.sh --self-test

  docs-sync:
    name: Documentation Sync Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Reject GBK mojibake and broken UTF-8
        run: python3 config/scripts/check_mojibake.py

      - name: Validate documentation sync script syntax
        run: bash -n config/scripts/check_docs_updated.sh

      - name: Run documentation sync self-test
        run: bash config/scripts/check_docs_updated.sh --self-test

      - name: Require docs for implementation changes
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            echo "Release tag build; documentation sync was checked when the commit landed."
            exit 0
          fi

          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi

          if [[ -z "${base}" || "${base}" =~ ^0+$ ]]; then
            if git rev-parse --verify HEAD~1 >/dev/null 2>&1; then
              base="HEAD~1"
            else
              echo "No previous commit is available; skipping documentation sync diff."
              exit 0
            fi
          fi

          if [[ "${base}" != "HEAD~1" ]] && ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            git fetch --depth=1 origin "${base}" || true
          fi

          bash config/scripts/check_docs_updated.sh --base "${base}" --head HEAD

      # internal/tests/protocompat rejects a contract element that is gone;
      # this keeps the golden file itself from losing or rewriting a line.
      - name: Keep the protobuf contract golden additions-only
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            echo "Release tag build; the golden file was checked when the commit landed."
            exit 0
          fi

          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi

          if [[ -z "${base}" || "${base}" =~ ^0+$ ]]; then
            base="HEAD~1"
          fi

          if [[ "${base}" != "HEAD~1" ]] && ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            git fetch --depth=1 origin "${base}" || true
          fi

          python3 config/scripts/check_proto_golden.py --base "${base}" --head HEAD

  release-workflow-policy:
    name: Release Workflow Policy Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Validate release workflow policy script syntax
        run: bash -n config/scripts/check_release_workflow.sh

      - name: Run release workflow policy self-test
        run: bash config/scripts/check_release_workflow.sh --self-test

      - name: Enforce release workflow policy
        run: bash config/scripts/check_release_workflow.sh

  go-quality:
    name: Go Quality Gates
    runs-on: ubuntu-latest
    needs: [changes]
    if: ${{ needs.changes.outputs.code == 'true' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install pinned protoc
        shell: bash
        run: |
          set -euo pipefail
          protoc_version="29.2"
          protoc_archive="${RUNNER_TEMP}/protoc-${protoc_version}-linux-x86_64.zip"
          protoc_install_dir="${RUNNER_TEMP}/protoc-${protoc_version}"
          protoc_sha256="52e9e7ece55c7e30e7e8bbd254b4b21b408a5309bca826763c7124b696a132e9"

          curl --fail --location --retry 5 --retry-all-errors --retry-delay 2 \
            --output "${protoc_archive}" \
            "https://github.com/protocolbuffers/protobuf/releases/download/v29.2/protoc-29.2-linux-x86_64.zip"
          printf '%s  %s\n' "${protoc_sha256}" "${protoc_archive}" | sha256sum -c -
          mkdir -p "${protoc_install_dir}"
          unzip -q "${protoc_archive}" -d "${protoc_install_dir}"
          "${protoc_install_dir}/bin/protoc" --version
          echo "${protoc_install_dir}/bin" >> "${GITHUB_PATH}"

      - name: Install pinned protoc Go plugins
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Check protobuf generated code
        shell: bash
        run: |
          export PATH="$(go env GOPATH)/bin:${PATH}"
          bash api/grpc/gen.sh
          git diff --exit-code -- api/grpc/v2boardpb
          test -z "$(git ls-files --others --exclude-standard -- api/grpc/v2boardpb)"
          contracts=(pluginhost packagebridge modulepki identity kernelidentity kernelsubscriber kernelsettings kernelorder kerneltelemetry kernelnodeops forward agent)
          for contract in "${contracts[@]}"; do
            bash "sdk/api/${contract}/gen.sh"
          done
          git diff --exit-code -- "${contracts[@]/#/sdk/api/}"
          test -z "$(git ls-files --others --exclude-standard -- "${contracts[@]/#/sdk/api/}")"

      - name: Check go mod tidy
        run: |
          go mod tidy
          go -C sdk mod tidy
          go -C identity mod tidy
          git diff --exit-code -- go.mod go.sum sdk/go.mod sdk/go.sum identity/go.mod identity/go.sum

      - name: Verify Agent SDK dependency boundary
        run: bash config/scripts/check_agent_sdk_dependency.sh

      - name: Check plugin-only route, worker, package boundary and moved column gates and script tests
        env:
          GOWORK: 'off'
        run: |
          python3 config/scripts/check_plugin_only_routes.py
          python3 config/scripts/check_plugin_only_workers.py
          bash config/scripts/check_package_boundaries.sh
          bash config/scripts/check_moved_columns.sh
          python3 -m unittest discover -s config/scripts -p '*_test.py'

      - name: Check gofmt
        shell: bash
        run: |
          unformatted="$(git ls-files '*.go' | xargs gofmt -l)"
          if [[ -n "$unformatted" ]]; then
            echo "::error::Go files are not gofmt-formatted"
            echo "$unformatted"
            exit 1
          fi

      - name: Run go vet
        run: |
          go vet ./...
          go -C sdk vet ./...
          go -C identity vet ./...

      # The full Go test suite (root module, sdk and identity) runs once, in
      # "Backend Tests"; this job keeps the static gates only.

  # The race detector re-runs the whole suite serially (about 28 min), so it
  # runs only on the nightly schedule and on manual runs; pushes, pull
  # requests and tags do not wait for it.
  go-race:
    name: Go Race Detector
    runs-on: ubuntu-latest
    needs: [changes]
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    timeout-minutes: 40
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run race tests
        run: |
          go test -race ./... -count=1 -p=1
          go -C sdk test -race ./... -count=1
          go -C identity test -race ./... -count=1

  go-benchmark-smoke:
    name: Go Benchmark Smoke
    runs-on: ubuntu-latest
    needs: [changes]
    if: ${{ needs.changes.outputs.full == 'true' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run critical benchmark smoke tests
        run: go test -run '^$' -bench=. -benchtime=1x ./internal/service ./internal/handler ./internal/router ./internal/compat/v2

  staging-rehearsal-smoke:
    name: Staging Rehearsal Smoke
    runs-on: ubuntu-latest
    needs: [changes]
    if: ${{ needs.changes.outputs.full == 'true' }}
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # Local staging rehearsal (scripts/staging, docs/guide/staging-rehearsal.md)
      # on batch 1 only, with the smoke thresholds (20 compared requests and
      # 2 minutes of shadow per read route): Compose stack on an internal
      # network, synthetic data, shadow replay, parity suites and the write
      # reconciliation twins. Only the packages of batch 1 are built.
      - name: Bring the staging stack up
        env:
          STAGING_PACKAGES: knowledge,ticket
          STAGING_WORK: ${{ runner.temp }}/staging
        run: scripts/staging/rehearse.sh up

      - name: Rehearse batch 1 (smoke)
        env:
          STAGING_WORK: ${{ runner.temp }}/staging
        run: scripts/staging/rehearse.sh --batch 1 --smoke

      - name: Upload the batch report
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: staging-rehearsal-batch-1
          path: ${{ runner.temp }}/staging/reports/
          if-no-files-found: ignore

      - name: Control logs
        if: ${{ failure() }}
        env:
          STAGING_WORK: ${{ runner.temp }}/staging
        run: scripts/staging/rehearse.sh logs control | tail -150

      - name: Tear the stack down
        if: ${{ always() }}
        env:
          STAGING_WORK: ${{ runner.temp }}/staging
        run: scripts/staging/rehearse.sh down

  go-lint:
    name: Go Lint Gate
    runs-on: ubuntu-latest
    needs: [changes]
    if: ${{ needs.changes.outputs.code == 'true' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0

      - name: Run golangci-lint gate
        shell: bash
        run: |
          mkdir -p lint-reports
          set +e
          { golangci-lint run --timeout=8m && (cd sdk && golangci-lint run --timeout=8m --config ../.golangci.yml) \
            && (cd identity && golangci-lint run --timeout=8m --config ../.golangci.yml); } 2>&1 | tee lint-reports/golangci-lint.txt
          exit "${PIPESTATUS[0]}"

      - name: Upload golangci-lint report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: golangci-lint-report
          path: lint-reports/golangci-lint.txt

  go-security:
    name: Go Security Scans
    runs-on: ubuntu-latest
    needs: [changes]
    if: ${{ needs.changes.outputs.code == 'true' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.8.0

      - name: Run govulncheck
        run: |
          govulncheck ./...
          (cd sdk && govulncheck ./...)
          (cd identity && govulncheck ./...)

      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@v2.29.0

      - name: Run production gosec gate
        shell: bash
        run: |
          mapfile -t production_packages < <(
            go list -f '{{.Dir}}' ./cmd/server ./api/grpc/v2boardpb ./internal/... \
              | sed "s#^${PWD}#.#" \
              | grep -Ev '^\./internal/tests(/|$)' \
              | sort
          )
          gosec -exclude-generated -nosec-require-rules -nosec-require-justification -quiet "${production_packages[@]}"

      - name: Run full repository gosec gate and report
        run: |
          mkdir -p security-reports
          gosec -exclude-generated -exclude-dir=config/scripts/testdata -exclude-dir=control-center -fmt=json -out=security-reports/gosec.json ./...
          (cd sdk && gosec -exclude-generated -nosec-require-rules -nosec-require-justification -quiet ./...)
          (cd identity && gosec -exclude-generated -nosec-require-rules -nosec-require-justification -quiet ./...)

      - name: Upload gosec report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gosec-report
          path: security-reports/gosec.json

  # Builds the Control image (Dockerfile "source" target) and the
  # identity-platform module image once, with a GitHub Actions layer cache per
  # image, and hands both to the Docker and Kubernetes smokes as image
  # archives. The smokes start as soon as the images exist; they do not wait
  # for the Go gates.
  build-images:
    name: Build Smoke Images
    runs-on: ubuntu-latest
    needs: [changes]
    if: ${{ needs.changes.outputs.modules == 'true' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Create the image archive directory
        run: mkdir -p "${RUNNER_TEMP}/smoke-images"

      - name: Build the Control image archive
        uses: docker/build-push-action@v7
        with:
          context: .
          target: source
          push: false
          tags: anix-control:ci
          outputs: type=docker,dest=${{ runner.temp }}/smoke-images/anix-control.tar
          build-args: |
            VERSION=ci
            BUILD_TIME=1970-01-01T00:00:00Z
            BUILD_CODE=${{ github.run_number }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=docker-smoke
          cache-to: type=gha,scope=docker-smoke,mode=max

      - name: Build the identity-platform module image archive
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.module
          push: false
          tags: anix-module-identity-platform:ci
          outputs: type=docker,dest=${{ runner.temp }}/smoke-images/anix-module-identity-platform.tar
          build-args: |
            PACKAGE_ID=identity-platform
            PACKAGE_VERSION=4.0.0
          cache-from: type=gha,scope=module-image
          cache-to: type=gha,scope=module-image,mode=max

      # The archives' layers are already compressed.
      - name: Upload the smoke image archives
        uses: actions/upload-artifact@v7
        with:
          name: smoke-images
          path: ${{ runner.temp }}/smoke-images/
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

  docker-smoke:
    name: Docker Build Smoke
    runs-on: ubuntu-latest
    needs: [changes, build-images]
    if: ${{ needs.changes.outputs.modules == 'true' }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: anix_control_smoke
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d anix_control_smoke"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Go for the package builder
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download the smoke image archives
        uses: actions/download-artifact@v8
        with:
          name: smoke-images
          path: ${{ runner.temp }}/smoke-images

      - name: Load the Control and identity-platform module images
        shell: bash
        run: |
          set -euo pipefail
          docker load -i "${RUNNER_TEMP}/smoke-images/anix-control.tar"
          docker load -i "${RUNNER_TEMP}/smoke-images/anix-module-identity-platform.tar"
          docker image inspect anix-control:ci anix-module-identity-platform:ci >/dev/null

      - name: Run the image as a container deployment would
        shell: bash
        run: |
          set -euo pipefail
          common=(
            --network host
            --read-only --tmpfs /tmp:rw,exec,mode=1777
            --cap-drop ALL --security-opt no-new-privileges
            -e ANIX_CONTROL_DATABASE_HOST=127.0.0.1
            -e ANIX_CONTROL_DATABASE_USERNAME=postgres
            -e ANIX_CONTROL_DATABASE_PASSWORD=postgres
            -e ANIX_CONTROL_DATABASE_DATABASE=anix_control_smoke
            -e ANIX_CONTROL_LOG_FORMAT=json
          )
          docker run --rm anix-control:ci -print-env | grep '^ANIX_CONTROL_DATABASE_PASSWORD ' >/dev/null
          # One-shot schema preparation, as a Compose service or Kubernetes Job runs it.
          docker run --rm "${common[@]}" anix-control:ci migrate
          docker run -d --name control "${common[@]}" \
            -e ANIX_CONTROL_JWT_SECRET=ci-smoke-jwt-secret-0123456789 \
            -e ANIX_CONTROL_SERVER_SHUTDOWN_DRAIN_DELAY=2s \
            anix-control:ci
          ready=0
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/readyz >/dev/null; then ready=1; break; fi
            sleep 2
          done
          docker logs control | tail -40
          test "${ready}" = 1
          curl -fsS http://127.0.0.1:8080/livez
          curl -fsS http://127.0.0.1:3000/readyz
          test "$(docker exec control id -u)" = 10001
          status="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/v3/plugins)"
          test "${status}" = 401 || { echo "unauthenticated /api/v3/plugins returned ${status}"; exit 1; }
          test "$(docker inspect -f '{{.State.Health.Status}}' control)" != unhealthy
          docker stop --time 90 control
          test "$(docker inspect -f '{{.State.ExitCode}}' control)" = 0
          docker logs control 2>&1 | grep 'Draining: waiting 2s' >/dev/null
          docker logs control 2>&1 | grep '"level":"INFO"' >/dev/null
          docker rm control

      - name: Run the production Compose file against an external PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network host -e PGPASSWORD=postgres postgres:16 \
            psql -h 127.0.0.1 -U postgres -d anix_control_smoke -c 'CREATE DATABASE anix_control_compose'
          work="$(mktemp -d)"
          cp docker-compose.prod.yml "${work}/"
          cp config/deploy/compose/control.env.example "${work}/control.env"
          sed -i -e 's/^ANIX_CONTROL_DATABASE_USERNAME=.*/ANIX_CONTROL_DATABASE_USERNAME=postgres/' \
                 -e 's/^ANIX_CONTROL_DATABASE_DATABASE=.*/ANIX_CONTROL_DATABASE_DATABASE=anix_control_compose/' "${work}/control.env"
          install -d -m 0755 "${work}/secrets"
          printf '%s' postgres | sudo install -m 0400 -o 10001 -g 10001 /dev/stdin "${work}/secrets/db_password"
          # The documented fresh-install step: jwt_secret and the CA key.
          sudo bash config/deploy/compose/init-secrets.sh --dir "${work}"
          test "$(sudo stat -c '%a %u' "${work}/secrets/module_ca_kek")" = "400 10001"
          cd "${work}"
          export ANIX_CONTROL_IMAGE=anix-control:ci
          compose=(docker compose -f docker-compose.prod.yml)
          "${compose[@]}" config --quiet
          "${compose[@]}" up -d
          control_id="$("${compose[@]}" ps -q control)"
          health=starting
          for _ in $(seq 1 40); do
            health="$(docker inspect -f '{{.State.Health.Status}}' "${control_id}")"
            [[ "${health}" == healthy ]] && break
            sleep 3
          done
          "${compose[@]}" logs --no-color | tail -40
          test "${health}" = healthy
          "${compose[@]}" logs migrate | grep 'migrate finished' >/dev/null
          curl -fsS http://127.0.0.1:8080/readyz
          curl -fsS -o /dev/null http://127.0.0.1:3000/livez
          "${compose[@]}" stop control
          test "$(docker inspect -f '{{.State.ExitCode}}' "${control_id}")" = 0
          "${compose[@]}" down

      - name: Run identity-platform as a network module with Compose
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --network host -e PGPASSWORD=postgres postgres:16 \
            psql -h 127.0.0.1 -U postgres -d anix_control_smoke -c 'CREATE DATABASE anix_control_modules'
          CONTROL_IMAGE=anix-control:ci IDENTITY_IMAGE=anix-module-identity-platform:ci \
            DB_HOST=host.docker.internal DB_PORT=5432 DB_USER=postgres DB_PASSWORD=postgres DB_NAME=anix_control_modules \
            config/scripts/modules_compose_smoke.sh

  helm-chart:
    name: Helm Chart Checks
    runs-on: ubuntu-latest
    needs: [changes]
    if: ${{ needs.changes.outputs.modules == 'true' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v4.3.0

      - name: Install kubeconform
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz \
            | tar -xz -C /usr/local/bin kubeconform

      - name: Lint and validate the chart
        shell: bash
        run: |
          set -euo pipefail
          chart=config/deploy/helm/anix-control
          secrets=(--set secrets.values.jwt_secret=x --set secrets.values.db_password=y)
          helm lint --strict "${chart}" "${secrets[@]}"
          helm template ci "${chart}" "${secrets[@]}" | kubeconform -strict -summary -kubernetes-version 1.30.0
          helm template ci "${chart}" "${secrets[@]}" --set grpc.enabled=true --set ingress.enabled=true \
            --set ansible.existingSecret=ansible --set image.digest=sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef \
            | kubeconform -strict -summary -kubernetes-version 1.30.0
          helm template ci "${chart}" --set secrets.existingSecret=control | kubeconform -strict -summary -kubernetes-version 1.30.0
          if helm template ci "${chart}" "${secrets[@]}" --set replicaCount=2 >/dev/null 2>&1; then
            echo "replicaCount=2 must be rejected"; exit 1
          fi
          if helm template ci "${chart}" >/dev/null 2>&1; then
            echo "missing secrets must be rejected"; exit 1
          fi
          modules=(--set secrets.files.module_ca_kek=ANIX_CONTROL_MODULE_RUNTIME_CA_KEK --set secrets.values.module_ca_kek=z
            --set moduleRuntime.enabled=true --set moduleRuntime.networkPolicy.enabled=true
            --set modules.identity-platform.enabled=true --set modules.identity-platform.image.repository=anix-module-identity-platform
            --set modules.identity-platform.trustBundleConfigMap=ca --set modules.identity-platform.enrollmentSecret=enrollment)
          helm lint --strict "${chart}" "${secrets[@]}" "${modules[@]}"
          helm template ci "${chart}" "${secrets[@]}" "${modules[@]}" | kubeconform -strict -summary -kubernetes-version 1.30.0
          if helm template ci "${chart}" "${secrets[@]}" --set caKek.generate=false --set moduleRuntime.enabled=true >/dev/null 2>&1; then
            echo "moduleRuntime without a CA key must be rejected"; exit 1
          fi
          # Fresh installs: the chart generates the CA key (an immutable Secret
          # kept on uninstall) and mounts it; gRPC TLS comes from a TLS Secret.
          rendered="$(helm template ci "${chart}" "${secrets[@]}" --set grpc.enabled=true --set grpc.tls.secretName=grpc-tls)"
          kubeconform -strict -summary -kubernetes-version 1.30.0 <<<"${rendered}"
          grep -q 'name: ci-anix-control-ca-kek' <<<"${rendered}"
          grep -q 'helm.sh/resource-policy: keep' <<<"${rendered}"
          grep -q '^immutable: true' <<<"${rendered}"
          grep -q 'value: /run/secrets/anix-control-ca-kek/ca_kek' <<<"${rendered}"
          grep -q 'value: /run/secrets/anix-control-grpc-tls/tls.crt' <<<"${rendered}"
          key="$(helm template ci "${chart}" "${secrets[@]}" -s templates/ca-kek-secret.yaml | sed -n 's/^  ca_kek: "\(.*\)"$/\1/p')"
          test "$(printf '%s' "${key}" | base64 -d | base64 -d | wc -c)" -eq 32
          # An existing Secret or the older secrets.files mapping: no generated Secret.
          if helm template ci "${chart}" "${secrets[@]}" --set caKek.existingSecret=kek | grep -q 'ca-kek-secret.yaml'; then
            echo "caKek.existingSecret must not render a CA key Secret"; exit 1
          fi
          mapped="$(helm template ci "${chart}" "${secrets[@]}" --set secrets.files.module_ca_kek=ANIX_CONTROL_MODULE_RUNTIME_CA_KEK --set secrets.values.module_ca_kek=z)"
          if grep -q 'ca-kek-secret.yaml\|anix-control-ca-kek' <<<"${mapped}"; then
            echo "a secrets.files CA key must take precedence over the generated one"; exit 1
          fi
          if helm template ci "${chart}" "${secrets[@]}" "${modules[@]}" --set moduleRuntime.enabled=false >/dev/null 2>&1; then
            echo "modules without moduleRuntime must be rejected"; exit 1
          fi

  kubernetes-smoke:
    name: Kubernetes Smoke
    runs-on: ubuntu-latest
    needs: [changes, helm-chart, build-images]
    if: ${{ needs.changes.outputs.modules == 'true' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v4.3.0

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: anix-control

      - name: Download the smoke image archives
        uses: actions/download-artifact@v8
        with:
          name: smoke-images
          path: ${{ runner.temp }}/smoke-images

      - name: Load the Control and identity-platform module images
        shell: bash
        run: |
          set -euo pipefail
          docker load -i "${RUNNER_TEMP}/smoke-images/anix-control.tar"
          docker load -i "${RUNNER_TEMP}/smoke-images/anix-module-identity-platform.tar"
          docker image inspect anix-control:ci anix-module-identity-platform:ci >/dev/null

      - name: Setup Go for the package builder
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install the chart against an in-cluster PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          kind load image-archive "${RUNNER_TEMP}/smoke-images/anix-control.tar" --name anix-control
          kubectl create namespace anix
          kubectl -n anix apply -f - <<'YAML'
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: postgresql
          spec:
            replicas: 1
            selector:
              matchLabels: {app: postgresql}
            template:
              metadata:
                labels: {app: postgresql}
              spec:
                containers:
                  - name: postgres
                    image: postgres:16-alpine
                    env:
                      - {name: POSTGRES_DB, value: anix_control}
                      - {name: POSTGRES_USER, value: anix_control}
                      - {name: POSTGRES_PASSWORD, value: ci-db-password}
                    ports:
                      - containerPort: 5432
                    readinessProbe:
                      exec:
                        command: ["pg_isready", "-U", "anix_control", "-d", "anix_control"]
                      periodSeconds: 3
          ---
          apiVersion: v1
          kind: Service
          metadata:
            name: postgresql
          spec:
            selector: {app: postgresql}
            ports:
              - port: 5432
          YAML
          kubectl -n anix rollout status deployment/postgresql --timeout=180s
          helm install control config/deploy/helm/anix-control --namespace anix \
            --set image.repository=anix-control --set image.tag=ci --set image.pullPolicy=Never \
            --set secrets.values.jwt_secret=ci-kubernetes-jwt-secret-0123456789 \
            --set secrets.values.db_password=ci-db-password \
            --wait --timeout 6m
          kubectl -n anix get pods -o wide
          kubectl -n anix logs deployment/control-anix-control -c migrate | tail -5
          kubectl -n anix logs deployment/control-anix-control -c migrate | grep 'migrate finished' >/dev/null

      - name: Probe the running release
        shell: bash
        run: |
          set -euo pipefail
          kubectl -n anix port-forward svc/control-anix-control 18080:8080 13000:3000 >/tmp/port-forward.log 2>&1 &
          for _ in $(seq 1 30); do curl -fsS http://127.0.0.1:18080/readyz && break; sleep 1; done
          curl -fsS http://127.0.0.1:18080/readyz
          curl -fsS http://127.0.0.1:13000/livez
          status="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/api/v3/plugins)"
          test "${status}" = 401
          # A config change rolls the pod (Recreate) and it becomes ready again.
          helm upgrade control config/deploy/helm/anix-control --namespace anix --reuse-values \
            --set config.ANIX_CONTROL_LOG_FORMAT=text --wait --timeout 6m
          kubectl -n anix get pods
          helm uninstall control --namespace anix --wait

      - name: Run identity-platform as a network module Deployment
        shell: bash
        run: |
          set -euo pipefail
          kubectl -n anix exec deployment/postgresql -- psql -U anix_control -d anix_control -c 'CREATE DATABASE anix_modules'
          CONTROL_IMAGE=anix-control:ci IDENTITY_IMAGE=anix-module-identity-platform:ci KIND_CLUSTER=anix-control \
            NAMESPACE=anix DB_PASSWORD=ci-db-password DB_NAME=anix_modules \
            config/scripts/modules_kind_smoke.sh

      - name: Dump cluster state on failure
        if: failure()
        shell: bash
        run: |
          kubectl -n anix get all || true
          kubectl -n anix describe pods || true
          kubectl -n anix logs deployment/control-anix-control --all-containers --tail=200 || true
          kubectl -n anix logs -l app.kubernetes.io/name=anix-module --prefix --tail=200 || true

  # Three shards; config/scripts/plan_test_shards.py balances the packages by
  # measured time and every package lands in exactly one shard. Each shard
  # takes coverage of its share of ./internal/... (without the integration
  # and e2e packages) and runs its share of the other root-module packages;
  # shard 1 also runs the sdk and identity modules and the Swagger gate.
  # The packages of a shard run four at a time (-p=4): they share no
  # database, file path or port. SERIAL_PACKAGES have timing-sensitive tests
  # that fail when other test binaries load the CPU, so they run afterwards,
  # alone (-p=1).
  backend-test-shard:
    name: Backend Tests (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    needs: [changes]
    if: ${{ needs.changes.outputs.code == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      SHARD: ${{ matrix.shard }}
      # TestDeadlinesEndStartedOperationsTimedOut uses a 300 ms deadline.
      SERIAL_PACKAGES: github.com/AnixOps/anix-control/v4/internal/kernelnodeops
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Plan this shard
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p shard
          go list ./internal/... | grep -v '^github.com/AnixOps/anix-control/v4/internal/tests/integration' | grep -v '^github.com/AnixOps/anix-control/v4/internal/tests/e2e' > coverage-packages.txt
          go list ./... | grep -vxF -f coverage-packages.txt > other-packages.txt
          python3 config/scripts/plan_test_shards.py --suite backend --shards 3 --shard "${SHARD}" < coverage-packages.txt > "shard/coverage-packages-${SHARD}.txt"
          python3 config/scripts/plan_test_shards.py --suite backend --shards 3 --shard "${SHARD}" < other-packages.txt > "shard/other-packages-${SHARD}.txt"
          wc -l shard/*.txt

      - name: Run tests with coverage
        shell: bash
        run: |
          set -euo pipefail
          tr ' ' '\n' <<<"${SERIAL_PACKAGES}" | sed '/^$/d' > serial-packages.txt
          mapfile -t parallel < <(grep -vxF -f serial-packages.txt "shard/coverage-packages-${SHARD}.txt" || true)
          mapfile -t serial < <(grep -xF -f serial-packages.txt "shard/coverage-packages-${SHARD}.txt" || true)
          if (( ${#parallel[@]} > 0 )); then
            go test -p=4 -count=1 -v -coverprofile="shard/coverage-${SHARD}-parallel.out" -covermode=atomic "${parallel[@]}"
          fi
          if (( ${#serial[@]} > 0 )); then
            go test -p=1 -count=1 -v -coverprofile="shard/coverage-${SHARD}-serial.out" -covermode=atomic "${serial[@]}"
          fi

      - name: Run the remaining Go tests (root module, sdk, identity)
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t packages < "shard/other-packages-${SHARD}.txt"
          if (( ${#packages[@]} > 0 )); then
            go test -p=4 -count=1 "${packages[@]}"
          fi
          if [[ "${SHARD}" == 1 ]]; then
            go -C sdk test ./... -count=1
            go -C identity test ./... -count=1
          fi

      # nft -c and the real-kernel driver tests need CAP_NET_ADMIN: the test
      # binary runs under sudo (H14). The nft -c checks run in a fresh
      # network namespace and apply nothing; the TestNetns tests (the whole
      # conformance suite, tc limits, quota usage, the probe) create a
      # throwaway namespace per test with `ip netns add` and never touch the
      # runner's own ruleset or qdiscs.
      - name: Check the nftables forward driver on the kernel (nft -c, netns)
        if: ${{ matrix.shard == 1 }}
        shell: bash
        run: |
          set -euo pipefail
          command -v nft >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends nftables; }
          nft --version
          tc -V
          uname -r
          go -C sdk test -c -o "${RUNNER_TEMP}/nftables.test" ./forward/driver/nftables
          cd sdk/forward/driver/nftables
          sudo ANIXOPS_NFT_CHECK=1 ANIXOPS_NFT_E2E=1 "${RUNNER_TEMP}/nftables.test" -test.run '^(TestNFTCheck|TestNetns)' -test.v

      # The gost driver against the gost release the Agent pins (H20):
      # GOST_VERSION, archive and binary checked by SHA-256 as the package
      # jobs do. gost parses every golden configuration; under sudo, each
      # TestNetns test runs gost in a throwaway network namespace (`ip netns
      # add`, `ip netns exec`): the whole conformance suite with traffic,
      # every golden loaded and served, TCP and UDP through a mutual-TLS
      # relay, hot changes through gost's web API (failover, soft quota,
      # pause) and least-connections re-weighting. Nothing touches the
      # runner's own network or systemd units.
      - name: Check the gost forward driver against the pinned gost (netns)
        if: ${{ matrix.shard == 1 }}
        shell: bash
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/gost_${GOST_VERSION}_linux_amd64.tar.gz"
          curl --fail --location --retry 3 --output "${archive}" \
            "https://github.com/go-gost/gost/releases/download/v${GOST_VERSION}/gost_${GOST_VERSION}_linux_amd64.tar.gz"
          echo "${GOST_LINUX_AMD64_ARCHIVE_SHA256}  ${archive}" | sha256sum --check --strict
          mkdir -p "${RUNNER_TEMP}/gost"
          tar -xzf "${archive}" -C "${RUNNER_TEMP}/gost" gost
          echo "${GOST_LINUX_AMD64_BINARY_SHA256}  ${RUNNER_TEMP}/gost/gost" | sha256sum --check --strict
          "${RUNNER_TEMP}/gost/gost" -V
          go -C sdk test -c -o "${RUNNER_TEMP}/gost.test" ./forward/driver/gost
          cd sdk/forward/driver/gost
          sudo ANIXOPS_GOST_E2E=1 ANIXOPS_GOST_BIN="${RUNNER_TEMP}/gost/gost" "${RUNNER_TEMP}/gost.test" -test.run '^(TestGostParsesGoldens|TestNetns)' -test.v

      # After the tests, so every shard tests the committed Swagger package;
      # "Go Quality Gates" vets the tree as committed.
      - name: Verify dependencies and vet the generated Swagger docs
        if: ${{ matrix.shard == 1 }}
        run: |
          go mod verify
          go install github.com/swaggo/swag/cmd/swag@v1.16.6
          $(go env GOPATH)/bin/swag init -g cmd/server/main.go -o docs --parseInternal --exclude control-center,packages
          go vet ./docs

      - name: Upload the shard coverage profile
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage-shard-${{ matrix.shard }}
          path: shard/
          retention-days: 1
          if-no-files-found: error

  # The required "Backend Tests" check: it passes only when every shard
  # passed, checks that the shards together ran every package exactly once,
  # merges their coverage profiles and writes the coverage report.
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    needs: [changes, backend-test-shard]
    if: ${{ !cancelled() && needs.changes.outputs.code == 'true' }}
    steps:
      - name: Require every backend test shard to pass
        env:
          SHARDS_RESULT: ${{ needs.backend-test-shard.result }}
        run: |
          echo "backend test shards: ${SHARDS_RESULT}"
          test "${SHARDS_RESULT}" = success

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download the shard coverage profiles
        uses: actions/download-artifact@v8
        with:
          pattern: backend-coverage-shard-*
          path: shard
          merge-multiple: true

      - name: Check that the shards ran every package once
        shell: bash
        run: |
          set -euo pipefail
          go list ./internal/... | grep -v '^github.com/AnixOps/anix-control/v4/internal/tests/integration' | grep -v '^github.com/AnixOps/anix-control/v4/internal/tests/e2e' | sort > coverage-packages.txt
          go list ./... | grep -vxF -f coverage-packages.txt | sort > other-packages.txt
          for kind in coverage other; do
            cat shard/${kind}-packages-{1,2,3}.txt | sort > "ran-${kind}.txt"
            if ! diff -u "${kind}-packages.txt" "ran-${kind}.txt"; then
              echo "::error::the backend test shards did not run the ${kind} packages exactly once"
              exit 1
            fi
          done

      - name: Merge the shard coverage profiles
        shell: bash
        run: |
          set -euo pipefail
          profiles=(shard/coverage-*.out)
          test -e "${profiles[0]}"
          python3 config/scripts/plan_test_shards.py --merge-coverage coverage.out "${profiles[@]}"

      - name: Generate coverage report
        run: |
          go tool cover -func=coverage.out > coverage.txt
          echo "## Coverage Report" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          cat coverage.txt >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: |
            coverage.out
            coverage.txt

  postgres-stats-test:
    name: PostgreSQL Stats Regression
    runs-on: ubuntu-latest
    needs: [changes]
    if: ${{ needs.changes.outputs.db == 'true' }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: v2board_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d v2board_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run PostgreSQL stats regression tests
        env:
          POSTGRES_TEST_DSN: host=127.0.0.1 user=postgres password=postgres dbname=v2board_test port=5432 sslmode=disable TimeZone=UTC
        run: go test -v ./internal/service ./internal/lease ./cmd/server -run 'TestStatsServicePostgres|TestPostgres' -count=1

  # Four shards, each with its own PostgreSQL. config/scripts/plan_test_shards.py
  # balances PACKAGES by measured time; inside a shard the packages run one at
  # a time (-p 1) because they share the shard's database, where package
  # schemas and roles are named after package ids.
  package-storage-postgres:
    name: Package Storage PostgreSQL (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    needs: [changes]
    if: ${{ needs.changes.outputs.db == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      PACKAGES: >-
        ./internal/packagestore ./internal/tests/integration ./internal/tests/packagecompat ./internal/tests/identitycompat ./internal/tests/knowledgecompat ./internal/tests/ticketcompat ./internal/tests/notificationcompat ./internal/tests/platformcompat ./internal/tests/plancompat ./internal/tests/ordercompat ./internal/tests/paymentcompat ./internal/tests/affiliatecompat ./internal/tests/subscriptioncompat ./internal/tests/proxynodecompat ./internal/tests/protocolruntimecompat ./internal/tests/machinetelemetrycompat ./internal/tests/gostmeshcompat ./internal/tests/wireguardcompat ./internal/nodesecrets ./internal/tests/nodesecretsplit ./internal/kernelnodeops ./internal/tests/bridgecontract ./internal/agentpki ./internal/agentreports ./internal/tests/nodeopsagent ./internal/subscriber ./internal/shadowsamples ./internal/kernelforward ./internal/tests/forwardv4 ./internal/agentupgrade
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: anix_package_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d anix_package_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # Production runs the kernel as a non-superuser role with CREATEROLE.
      - name: Create the kernel database role
        run: |
          docker run --rm --network host -e PGPASSWORD=postgres postgres:16 \
            psql -h 127.0.0.1 -U postgres -d anix_package_test -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE anix_kernel LOGIN CREATEROLE PASSWORD 'kernel'" \
            -c "ALTER DATABASE anix_package_test OWNER TO anix_kernel"

      # The harnesses seed, migrate and empty a database for every case, and
      # each statement is a transaction of its own: ordercompat alone commits
      # about 25 000 times. On a runner whose disk flushes slowly the
      # commits were most of the run (ordercompat and paymentcompat took
      # 45 to 55 s in a slow run and 22 to 28 s in a fast one). This
      # database is thrown away with the job and no test crashes it, so it
      # runs without flushing (PostgreSQL's documented non-durable
      # settings); the SQL behaviour the tests check is the same.
      - name: Run the test PostgreSQL without flushing to disk
        run: |
          docker run --rm --network host -e PGPASSWORD=postgres postgres:16 \
            psql -h 127.0.0.1 -U postgres -d anix_package_test -v ON_ERROR_STOP=1 \
            -c "ALTER SYSTEM SET fsync = off" \
            -c "ALTER SYSTEM SET synchronous_commit = off" \
            -c "ALTER SYSTEM SET full_page_writes = off" \
            -c "SELECT pg_reload_conf()"
          sleep 2
          docker run --rm --network host -e PGPASSWORD=postgres postgres:16 \
            psql -h 127.0.0.1 -U postgres -d anix_package_test -At -c \
            "SELECT name || ' = ' || setting FROM pg_settings WHERE name IN ('fsync', 'synchronous_commit', 'full_page_writes') ORDER BY name"

      - name: Run package storage, rollout and compatibility harness PostgreSQL tests
        shell: bash
        env:
          ANIX_TEST_POSTGRES_DSN: host=127.0.0.1 port=5432 user=anix_kernel password=kernel dbname=anix_package_test sslmode=disable TimeZone=UTC
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          mapfile -t packages < <(tr ' ' '\n' <<<"${PACKAGES}" | python3 config/scripts/plan_test_shards.py --suite postgres --shards 4 --shard "${SHARD}")
          printf 'shard %s/4: %s\n' "${SHARD}" "${packages[*]}"
          test "${#packages[@]}" -gt 0
          go test -p 1 -v -count=1 "${packages[@]}"
          if [[ "${SHARD}" == 4 ]]; then
            go -C sdk test -v -count=1 ./packagestoresdk
          fi

  migration-dry-run-test:
    name: SQLite to PostgreSQL Dry Run
    runs-on: ubuntu-latest
    needs: [changes]
    if: ${{ needs.changes.outputs.db == 'true' }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: v2board_migration_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d v2board_migration_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Create SQLite migration source fixture
        shell: bash
        run: |
          python3 - <<'PY'
          import sqlite3

          db_path = "/tmp/v2board-migration-source.db"
          conn = sqlite3.connect(db_path)
          conn.execute("CREATE TABLE v2_user (id INTEGER PRIMARY KEY, email TEXT, token TEXT)")
          conn.execute("CREATE TABLE v2_plan (id INTEGER PRIMARY KEY, name TEXT)")
          conn.execute("CREATE TABLE v2_system_config (id INTEGER PRIMARY KEY, key TEXT, value TEXT)")
          conn.execute("INSERT INTO v2_user (id, email, token) VALUES (1, 'migration@example.com', 'migration-token')")
          conn.execute("INSERT INTO v2_plan (id, name) VALUES (1, 'Migration Plan')")
          conn.execute("INSERT INTO v2_system_config (id, key, value) VALUES (1, 'migration.fixture', 'true')")
          conn.commit()
          conn.close()
          print(db_path)
          PY

      - name: Run SQLite to PostgreSQL migration dry run
        env:
          POSTGRES_TEST_DSN: host=127.0.0.1 user=postgres password=postgres dbname=v2board_migration_test port=5432 sslmode=disable TimeZone=UTC
        shell: bash
        run: |
          go run ./cmd/sqlite2postgres \
            -source /tmp/v2board-migration-source.db \
            -target-dsn "$POSTGRES_TEST_DSN" \
            -dry-run | tee migration-dry-run.txt
          grep -q "dry-run: no PostgreSQL data changed" migration-dry-run.txt
          grep -q "v2_user" migration-dry-run.txt
          grep -q "v2_plan" migration-dry-run.txt

      - name: Upload migration dry-run report
        uses: actions/upload-artifact@v7
        with:
          name: migration-dry-run-report
          path: migration-dry-run.txt

  postgres-restore-rehearsal:
    name: PostgreSQL Restore Rehearsal
    runs-on: ubuntu-latest
    needs: [changes]
    if: ${{ needs.changes.outputs.db == 'true' }}
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: v2board_restore_rehearsal
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d v2board_restore_rehearsal"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install PostgreSQL 16 client tools
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client-16
          echo "/usr/lib/postgresql/16/bin" >> "$GITHUB_PATH"

      - name: Run destructive restore rehearsal on disposable PostgreSQL
        env:
          POSTGRES_REHEARSAL_DSN: host=127.0.0.1 user=postgres password=postgres dbname=v2board_restore_rehearsal port=5432 sslmode=disable TimeZone=UTC
        run: |
          bash scripts/postgres_restore_rehearsal.sh \
            --unavailable fail \
            --output-dir postgres-restore-rehearsal

      - name: Upload PostgreSQL restore rehearsal evidence
        uses: actions/upload-artifact@v7
        with:
          name: postgres-restore-rehearsal
          path: postgres-restore-rehearsal/

  plugin-package-release-test:
    name: Plugin Package Release Contracts
    runs-on: ubuntu-latest
    needs: [changes]
    if: ${{ needs.changes.outputs.packages == 'true' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Checkout pinned Agent source for official packages
        uses: actions/checkout@v7
        with:
          repository: AnixOps/anix-agent
          ref: 54150d83b6f43d453eec6d818c894c73ebc76dc1
          path: V2bX_AnixOps

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build and verify real package inputs
        shell: bash
        env:
          GOEXPERIMENT: jsonv2
          GOWORK: 'off'
        run: |
          set -Eeuo pipefail
          mkdir -p package-build
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go -C V2bX_AnixOps build -trimpath \
              -o "${GITHUB_WORKSPACE}/package-build/nftables-forward-agent" ./cmd/nftables-forward
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go -C V2bX_AnixOps build -trimpath \
              -o "${GITHUB_WORKSPACE}/package-build/gost-mesh-agent" ./cmd/gost-mesh
          chmod 0755 package-build/nftables-forward-agent
          chmod 0755 package-build/gost-mesh-agent
          [[ "$(package-build/nftables-forward-agent --version)" == "nftables-forward 1.2.0" ]]

          gost_archive="${RUNNER_TEMP}/gost_${GOST_VERSION}_linux_amd64.tar.gz"
          curl --fail --location --retry 3 --output "${gost_archive}" \
            "https://github.com/go-gost/gost/releases/download/v${GOST_VERSION}/gost_${GOST_VERSION}_linux_amd64.tar.gz"
          echo "${GOST_LINUX_AMD64_ARCHIVE_SHA256}  ${gost_archive}" | sha256sum --check --strict
          tar -xzf "${gost_archive}" -C "${RUNNER_TEMP}"
          install -m 0755 "${RUNNER_TEMP}/gost" package-build/gost
          echo "${GOST_LINUX_AMD64_BINARY_SHA256}  package-build/gost" | sha256sum --check --strict
          package-build/gost -V

      - name: Run Machine Telemetry package unit tests
        run: python3 -m unittest discover -s packages/machine-telemetry/tests -p 'test_*.py' -v

      - name: Run Machine Telemetry WebUI smoke test
        run: node packages/machine-telemetry/tests/webui_smoke.mjs

      - name: Run v4 package WebUI contract
        run: node packages/shared/tests/webui_contract.mjs

      - name: Run nftables Forward package unit tests
        run: python3 -m unittest discover -s packages/nftables-forward/tests -p 'test_*.py' -v

      - name: Run nftables Forward WebUI smoke test
        run: node packages/nftables-forward/tests/webui_smoke.mjs

      - name: Run GOST Mesh package unit tests
        run: python3 -m unittest discover -s packages/gost-mesh/tests -p 'test_*.py' -v

      - name: Run GOST Mesh WebUI smoke test
        run: node packages/gost-mesh/tests/webui_smoke.mjs

      - name: Run NAT Egress package unit tests
        run: python3 -m unittest discover -s packages/nat-egress/tests -p 'test_*.py' -v

      - name: Run NAT Egress WebUI smoke test
        run: node packages/nat-egress/tests/webui_smoke.mjs

      - name: Run reproducible unsigned and signed package contract
        run: |
          set -o pipefail
          bash packages/machine-telemetry/tests/release_gate.sh \
            | tee machine-telemetry-package-contract.txt
          bash packages/nftables-forward/tests/release_gate.sh \
            --agent-binary package-build/nftables-forward-agent \
            | tee nftables-forward-package-contract.txt
          bash packages/gost-mesh/tests/release_gate.sh \
            --agent-binary package-build/gost-mesh-agent \
            --gost package-build/gost \
            | tee gost-mesh-package-contract.txt
          bash packages/nat-egress/tests/release_gate.sh \
            | tee nat-egress-package-contract.txt

      - name: Upload package contract report
        uses: actions/upload-artifact@v7
        with:
          name: plugin-package-contract-reports
          path: |
            machine-telemetry-package-contract.txt
            nftables-forward-package-contract.txt
            gost-mesh-package-contract.txt
            nat-egress-package-contract.txt

  plugin-package-publish:
    name: Publish Signed Official Plugin Packages
    runs-on: ubuntu-latest
    needs: [tag-gate, plugin-package-release-test, cross-repository-agent-e2e]
    if: ${{ needs.tag-gate.outputs.is_release_tag == 'true' }}
    steps:
      - name: Checkout Control
        uses: actions/checkout@v7

      - name: Checkout pinned Agent source
        uses: actions/checkout@v7
        with:
          repository: AnixOps/anix-agent
          ref: 54150d83b6f43d453eec6d818c894c73ebc76dc1
          path: V2bX_AnixOps

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Build Agent plugin binaries
        env:
          GOEXPERIMENT: jsonv2
          GOWORK: 'off'
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p package-build/agent
          build_agent() {
            local package_id="$1"
            local goos="$2"
            local goarch="$3"
            local output="${GITHUB_WORKSPACE}/package-build/agent/${package_id}-${goos}-${goarch}"
            CGO_ENABLED=0 GOOS="${goos}" GOARCH="${goarch}" \
              go -C V2bX_AnixOps build -trimpath -buildvcs=false -o "${output}" "./cmd/${package_id}"
            chmod 0755 "${output}"
          }
          for package_id in machine-telemetry nftables-forward gost-mesh nat-egress; do
            build_agent "${package_id}" linux amd64
            build_agent "${package_id}" linux arm64
          done

      - name: Download checksum-pinned GOST runtimes
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p package-build/runtime
          download_gost_runtime() {
            local goarch="$1"
            local archive_sha256="$2"
            local binary_sha256="$3"
            local archive="${RUNNER_TEMP}/gost_${GOST_VERSION}_linux_${goarch}.tar.gz"
            local stage
            stage="$(mktemp -d "${RUNNER_TEMP}/gost-${goarch}.XXXXXX")"
            curl --fail --location --retry 3 --output "${archive}" \
              "https://github.com/go-gost/gost/releases/download/v${GOST_VERSION}/gost_${GOST_VERSION}_linux_${goarch}.tar.gz"
            echo "${archive_sha256}  ${archive}" | sha256sum --check --strict
            tar -xzf "${archive}" -C "${stage}"
            install -m 0755 "${stage}/gost" "${GITHUB_WORKSPACE}/package-build/runtime/gost-linux-${goarch}"
            echo "${binary_sha256}  ${GITHUB_WORKSPACE}/package-build/runtime/gost-linux-${goarch}" | sha256sum --check --strict
            find "${stage}" -depth -delete
            find "${archive}" -depth -delete
          }
          download_gost_runtime amd64 "${GOST_LINUX_AMD64_ARCHIVE_SHA256}" "${GOST_LINUX_AMD64_BINARY_SHA256}"
          download_gost_runtime arm64 "${GOST_LINUX_ARM64_ARCHIVE_SHA256}" "${GOST_LINUX_ARM64_BINARY_SHA256}"

      # Every package under packages/ is built and signed at the tag's version:
      # the kernel accepts only manifests signed by the official package root.
      - name: Build and sign the package set
        env:
          ANIXOPS_PLUGIN_SIGNING_PRIVATE_KEY: ${{ secrets.ANIXOPS_PLUGIN_SIGNING_PRIVATE_KEY }}
          ANIXOPS_PLUGIN_OFFICIAL_PUBLIC_KEY: ${{ secrets.ANIXOPS_PLUGIN_OFFICIAL_PUBLIC_KEY }}
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ -n "${ANIXOPS_PLUGIN_SIGNING_PRIVATE_KEY}" ]] || {
            echo "ANIXOPS_PLUGIN_SIGNING_PRIVATE_KEY is required to sign release packages" >&2
            exit 1
          }
          [[ -n "${ANIXOPS_PLUGIN_OFFICIAL_PUBLIC_KEY}" ]] || {
            echo "ANIXOPS_PLUGIN_OFFICIAL_PUBLIC_KEY is required to sign release packages" >&2
            exit 1
          }
          key_file="$(mktemp)"
          root_file="$(mktemp)"
          trap 'rm -f "${key_file}" "${root_file}"' EXIT
          printf '%s\n' "${ANIXOPS_PLUGIN_SIGNING_PRIVATE_KEY}" >"${key_file}"
          chmod 0600 "${key_file}"
          printf '%s\n' "${ANIXOPS_PLUGIN_OFFICIAL_PUBLIC_KEY}" >"${root_file}"
          configured_root="$(sed -n 's/^[[:space:]]*official_public_key:[[:space:]]*"\([^"]*\)".*/\1/p' config/config.prod.yaml)"
          [[ -n "${configured_root}" ]] || {
            echo "config/config.prod.yaml does not declare the official package root" >&2
            exit 1
          }
          [[ "${configured_root}" == "${ANIXOPS_PLUGIN_OFFICIAL_PUBLIC_KEY}" ]] || {
            echo "candidate configuration does not match the protected official package root" >&2
            exit 1
          }
          unset ANIXOPS_PLUGIN_SIGNING_PRIVATE_KEY ANIXOPS_PLUGIN_OFFICIAL_PUBLIC_KEY
          mkdir -p release-packages
          agent_args=()
          runtime_args=()
          for package_id in machine-telemetry nftables-forward gost-mesh nat-egress; do
            for platform in linux/amd64 linux/arm64; do
              platform_path="${platform//\//-}"
              agent_args+=(--agent-binary "${package_id}@${platform}=${GITHUB_WORKSPACE}/package-build/agent/${package_id}-${platform_path}")
            done
          done
          for platform in linux/amd64 linux/arm64; do
            platform_path="${platform//\//-}"
            runtime_args+=(--runtime-binary "gost-mesh:gost@${platform}=${GITHUB_WORKSPACE}/package-build/runtime/gost-${platform_path}")
          done
          python3 packages/shared/build_package.py \
            --all \
            --version "${GITHUB_REF_NAME#v}" \
            --out release-packages \
            --formal-release \
            --signing-key "${key_file}" \
            --official-public-key "${root_file}" \
            --platform linux/amd64 \
            --platform linux/arm64 \
            "${agent_args[@]}" \
            "${runtime_args[@]}"
          python3 packages/shared/build_package.py \
            --all \
            --version "${GITHUB_REF_NAME#v}" \
            --out release-packages \
            --verify-release \
            --official-public-key "${root_file}"
          # The release ships the package set as one signed archive; the key
          # signs the archive bytes the same way it signs each manifest.
          python3 packages/shared/build_package.py \
            --all \
            --version "${GITHUB_REF_NAME#v}" \
            --out release-packages \
            --release-archive release-assets \
            --signing-key "${key_file}" \
            --official-public-key "${root_file}"
          cp "${root_file}" release-assets/official-public-key.raw
          # The Agent installer every Control serves at /install.sh, signed
          # with the same key (base64 raw Ed25519 over its exact bytes): the
          # github mirror's script, and the signature the image serves at
          # /install.sh.sig.
          install -m 0644 internal/agentinstall/install.sh release-assets/agent-install.sh
          signature_bin="$(mktemp)"
          official_der="$(mktemp)"
          openssl pkeyutl -sign -inkey "${key_file}" -rawin -in release-assets/agent-install.sh -out "${signature_bin}"
          { printf '%s\n' "$(base64 -w0 "${signature_bin}")"; } >release-assets/agent-install.sh.sig
          { printf '\x30\x2a\x30\x05\x06\x03\x2b\x65\x70\x03\x21\x00'; base64 -d "${root_file}"; } >"${official_der}"
          openssl pkeyutl -verify -pubin -keyform DER -inkey "${official_der}" -rawin \
            -in release-assets/agent-install.sh -sigfile "${signature_bin}"
          rm -f "${signature_bin}" "${official_der}"
          # scripts/install.sh (frozen) and the docker job read the identity
          # bootstrap package by name, so it also stays a separate asset.
          for suffix in anxp manifest.json manifest.sig; do
            install -m 0644 "release-packages/identity-platform-${GITHUB_REF_NAME#v}.${suffix}" release-assets/
          done
          ls -l release-assets

      - name: Upload signed packages
        uses: actions/upload-artifact@v7
        with:
          name: signed-plugin-releases
          path: release-assets/

  forward-runtime-test:
    name: Forward Runtime Regression
    runs-on: ubuntu-latest
    needs: [changes]
    if: ${{ needs.changes.outputs.forward == 'true' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run forward runtime service tests
        run: |
          go test -v ./internal/service -run 'TestPanelForwardRuntimeJobExecutor|TestForwardAgentBridgeWorker|TestForwardCleanAgentService|TestNewForwardAgentBridgeWorker_LoadsCleanAgentActionTimeoutFromConfig' -count=1

      - name: Run forward runtime config tests
        run: |
          go test -v ./internal/config -run TestLoadForwardRuntimeConfig -count=1

      - name: Run forward runtime server startup tests
        run: |
          go test -v ./cmd/server -run TestShouldStartForwardAgentBridgeWorker -count=1

      - name: Run forward agent bridge handler tests
        run: |
          go test -v ./internal/handler -run TestAgentBridgeHandler -count=1

  # The forward SDK's multi-namespace end-to-end suite (sdk/forward/e2e,
  # forward-sdk.md section 13): client, entry, relay and target network
  # namespaces joined by veth pairs, routes planned by the planner and
  # applied by the nftables driver in each node's namespace (and by the gost
  # driver, with the pinned gost running in the entry's namespace, for a
  # gost entry's counters and failover), and real TCP and UDP traffic. It
  # needs root, so the test binary runs under sudo on the
  # hosted runner, which is a VM (H14); every namespace is a throwaway one and
  # the runner's own ruleset, qdiscs and sysctls are never touched. It runs
  # on forward changes, nightly and on manual runs, and is not a required
  # check until it has been green for two weeks (H14). Backend Tests shard 1
  # keeps running the nftables driver's own real-kernel conformance tests.
  forward-netns-e2e:
    name: Forward Netns E2E
    runs-on: ubuntu-latest
    needs: [changes]
    if: ${{ needs.changes.outputs.forward == 'true' }}
    timeout-minutes: 20
    env:
      LOG_DIR: ${{ github.workspace }}/forward-e2e-logs
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install nftables and iproute2
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          command -v nft >/dev/null || missing+=(nftables)
          { command -v ip && command -v tc && command -v ss; } >/dev/null || missing+=(iproute2)
          if (( ${#missing[@]} > 0 )); then
            sudo apt-get update -qq
            sudo apt-get install -y -qq --no-install-recommends "${missing[@]}"
          fi
          nft --version
          tc -V
          uname -r

      # The gost release the Agent pins (H20), checked by SHA-256 as Backend
      # Tests shard 1 does.
      - name: Download the pinned gost
        shell: bash
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/gost_${GOST_VERSION}_linux_amd64.tar.gz"
          curl --fail --location --retry 3 --output "${archive}" \
            "https://github.com/go-gost/gost/releases/download/v${GOST_VERSION}/gost_${GOST_VERSION}_linux_amd64.tar.gz"
          echo "${GOST_LINUX_AMD64_ARCHIVE_SHA256}  ${archive}" | sha256sum --check --strict
          mkdir -p "${RUNNER_TEMP}/gost"
          tar -xzf "${archive}" -C "${RUNNER_TEMP}/gost" gost
          echo "${GOST_LINUX_AMD64_BINARY_SHA256}  ${RUNNER_TEMP}/gost/gost" | sha256sum --check --strict
          "${RUNNER_TEMP}/gost/gost" -V

      - name: Build the end-to-end test binary
        run: go -C sdk test -c -o "${RUNNER_TEMP}/forward-e2e.test" ./forward/e2e

      - name: Run the end-to-end suite under sudo
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${LOG_DIR}"
          cd sdk/forward/e2e
          sudo ANIXOPS_FORWARD_E2E=1 ANIXOPS_FORWARD_E2E_LOGDIR="${LOG_DIR}" ANIXOPS_GOST_BIN="${RUNNER_TEMP}/gost/gost" \
            "${RUNNER_TEMP}/forward-e2e.test" -test.v -test.timeout=15m 2>&1 | tee "${LOG_DIR}/go-test.log"

      - name: Make the logs readable
        if: ${{ failure() }}
        run: sudo chmod -R a+rX "${LOG_DIR}" || true

      - name: Upload the logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: forward-netns-e2e-logs
          path: forward-e2e-logs/
          retention-days: 7
          if-no-files-found: ignore

  grpc-test:
    name: gRPC Core Tests
    runs-on: ubuntu-latest
    needs: [changes]
    if: ${{ needs.changes.outputs.agent == 'true' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run gRPC tests
        run: |
          go test -v -coverprofile=grpc_coverage.out ./internal/grpc/...

      - name: Check gRPC coverage (80%+)
        run: |
          COVERAGE=$(go tool cover -func=grpc_coverage.out | grep total | awk '{print $3}' | sed 's/%//')
          echo "gRPC coverage: ${COVERAGE}%"
          if [ $(echo "$COVERAGE < 80" | bc -l) -eq 1 ]; then
            echo "::error::gRPC coverage ${COVERAGE}% is below minimum 80%"
            exit 1
          fi
          echo "gRPC coverage check passed: ${COVERAGE}%"

  cross-repository-agent-e2e:
    name: Control to Agent Process E2E
    runs-on: ubuntu-latest
    needs: [changes]
    if: ${{ needs.changes.outputs.agent == 'true' }}
    steps:
      - name: Checkout Control
        uses: actions/checkout@v7

      - name: Checkout pinned Agent fixture source
        uses: actions/checkout@v7
        with:
          repository: AnixOps/anix-agent
          ref: 54150d83b6f43d453eec6d818c894c73ebc76dc1
          path: V2bX_AnixOps

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Run real Control to Agent process E2E
        env:
          ANIXOPS_CROSS_REPO_E2E: '1'
          ANIXOPS_AGENT_ROOT: ${{ github.workspace }}/V2bX_AnixOps
          GOWORK: 'off'
        run: |
          go test -v -count=1 ./internal/grpc \
            -run '^Test(KernelOperationBridgeCrossRepositoryAgentProcess|AgentPluginPackageCrossRepositoryE2E)$'

  # The A2-7 suite (node-ops-service.md section 9, internal/tests/agente2e):
  # the real Control binary and the real Agent, built from the pinned
  # anix-agent commit, under agent_control.mtls: required. The Agent enrolls
  # with a one-time credential; the suite checks the configuration, users,
  # traffic counted once, NodeStatus, maintenance events, the alive list,
  # plugin artifacts over mTLS, the systemd services report and panel,
  # agent.diagnostic, forward.v1 with the pinned gost and link certificates,
  # then chaos: Control killed mid-stream, a partition with an Agent crash,
  # an Agent restart, a revoked certificate, the #179 generation reset and
  # clock-skew bounds. The main lane runs on PostgreSQL as the runner user;
  # the forward lane runs the real nftables driver as root in a throwaway
  # network namespace (`unshare --net`, H14) on SQLite, so the runner's own
  # network and systemd units are never touched. Full lane and nightly; not
  # a required check yet.
  cross-repository-agent-chaos-e2e:
    name: Cross-Repo E2E
    runs-on: ubuntu-latest
    needs: [changes]
    if: ${{ needs.changes.outputs.full == 'true' }}
    timeout-minutes: 30
    env:
      E2E_BIN: ${{ github.workspace }}/agent-e2e-bin
      E2E_LOGS: ${{ github.workspace }}/agent-e2e-logs
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: agent_e2e
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d agent_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout Control
        uses: actions/checkout@v7

      - name: Checkout pinned Agent source
        uses: actions/checkout@v7
        with:
          repository: AnixOps/anix-agent
          ref: 54150d83b6f43d453eec6d818c894c73ebc76dc1
          path: V2bX_AnixOps

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: |
            go.sum
            V2bX_AnixOps/go.sum

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Install nftables and iproute2
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          command -v nft >/dev/null || missing+=(nftables)
          { command -v ip && command -v ss; } >/dev/null || missing+=(iproute2)
          if (( ${#missing[@]} > 0 )); then
            sudo apt-get update -qq
            sudo apt-get install -y -qq --no-install-recommends "${missing[@]}"
          fi

      # The gost release the Agent pins (H20), checked by SHA-256: the
      # suite's systemctl stand-in runs it for the gost forward driver.
      - name: Download the pinned gost
        shell: bash
        run: |
          set -euo pipefail
          archive="${RUNNER_TEMP}/gost_${GOST_VERSION}_linux_amd64.tar.gz"
          curl --fail --location --retry 3 --output "${archive}" \
            "https://github.com/go-gost/gost/releases/download/v${GOST_VERSION}/gost_${GOST_VERSION}_linux_amd64.tar.gz"
          echo "${GOST_LINUX_AMD64_ARCHIVE_SHA256}  ${archive}" | sha256sum --check --strict
          mkdir -p "${RUNNER_TEMP}/gost"
          tar -xzf "${archive}" -C "${RUNNER_TEMP}/gost" gost
          echo "${GOST_LINUX_AMD64_BINARY_SHA256}  ${RUNNER_TEMP}/gost/gost" | sha256sum --check --strict
          "${RUNNER_TEMP}/gost/gost" -V

      - name: Build Control, the Agent and the suite
        shell: bash
        env:
          GOWORK: 'off'
          GOEXPERIMENT: jsonv2
          CGO_ENABLED: '0'
        run: |
          set -euo pipefail
          mkdir -p "${E2E_BIN}" "${E2E_LOGS}"
          go build -o "${E2E_BIN}/anix-control" ./cmd/server
          go -C V2bX_AnixOps build -trimpath -tags sing \
            -ldflags "-X github.com/AnixOps/anix-agent/v4/cmd.version=4.2.0-e2e" \
            -o "${E2E_BIN}/anix-agent" .
          for arch in amd64 arm64; do
            GOOS=linux GOARCH="${arch}" go -C V2bX_AnixOps build -trimpath -buildvcs=false \
              -o "${E2E_BIN}/machine-telemetry-linux-${arch}" ./cmd/machine-telemetry
          done
          go test -c -o "${E2E_BIN}/agente2e.test" ./internal/tests/agente2e

      - name: Run the suite on PostgreSQL
        shell: bash
        env:
          ANIXOPS_AGENT_E2E: '1'
          ANIXOPS_AGENT_ROOT: ${{ github.workspace }}/V2bX_AnixOps
          ANIXOPS_AGENT_E2E_POSTGRES_DSN: host=127.0.0.1 user=postgres password=postgres dbname=agent_e2e port=5432 sslmode=disable TimeZone=UTC
          GOWORK: 'off'
        run: |
          set -euo pipefail
          ANIXOPS_AGENT_E2E_BIN_DIR="${E2E_BIN}" ANIXOPS_GOST_BIN="${RUNNER_TEMP}/gost/gost" \
          ANIXOPS_AGENT_E2E_LOGDIR="${E2E_LOGS}/main" \
            "${E2E_BIN}/agente2e.test" -test.run '^TestRealAgentEndToEnd$' -test.v -test.timeout 20m 2>&1 \
            | grep -v '\[GIN\]' | tee "${E2E_LOGS}/main-go-test.log"

      # Root in a throwaway network namespace (H14): the real nftables
      # driver, the forward checks and the #179 recovery. The module cache
      # is the runner's (read only, no network: GOPROXY=off); the build cache
      # is root's own, so the runner's cache stays writable for setup-go.
      - name: Run the forward lane in a network namespace (sudo)
        shell: bash
        run: |
          set -euo pipefail
          sudo env PATH="${PATH}" GOWORK=off GOTOOLCHAIN=local GOPROXY=off \
            GOMODCACHE="$(go env GOMODCACHE)" GOCACHE="${RUNNER_TEMP}/root-gocache" HOME="${RUNNER_TEMP}" \
            ANIXOPS_AGENT_E2E=1 ANIXOPS_AGENT_E2E_NETNS=1 \
            ANIXOPS_AGENT_ROOT="${GITHUB_WORKSPACE}/V2bX_AnixOps" ANIXOPS_AGENT_E2E_BIN_DIR="${E2E_BIN}" \
            ANIXOPS_GOST_BIN="${RUNNER_TEMP}/gost/gost" ANIXOPS_AGENT_E2E_LOGDIR="${E2E_LOGS}/netns" \
            unshare --net -- sh -c 'ip link set lo up && exec "$0" "$@"' \
            "${E2E_BIN}/agente2e.test" \
            -test.run '^TestRealAgentEndToEnd$/^(enroll|config_snapshot|link|forward|chaos_agent_graceful|chaos_control_db)' \
            -test.v -test.timeout 8m 2>&1 | grep -v '\[GIN\]' | tee "${E2E_LOGS}/netns-go-test.log"

      - name: Make the logs readable
        if: ${{ !cancelled() }}
        run: sudo chmod -R a+rX "${E2E_LOGS}" || true

      - name: Upload the scenario summaries
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: cross-repo-e2e-summary
          path: agent-e2e-logs/*/summary-*.json
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload the logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: cross-repo-e2e-logs
          path: agent-e2e-logs/
          retention-days: 7
          if-no-files-found: ignore

  cmd-test:
    name: CLI Tests
    runs-on: ubuntu-latest
    needs: [changes]
    if: ${{ needs.changes.outputs.code == 'true' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run CLI tests
        run: |
          go test -v -coverprofile=cmd_coverage.out ./cmd/...
          COVERAGE=$(go tool cover -func=cmd_coverage.out | grep total | awk '{print $3}')
          echo "CLI coverage: ${COVERAGE}"

  smoke-test:
    name: Smoke Tests
    runs-on: ubuntu-latest
    needs: [changes]
    if: ${{ needs.changes.outputs.code == 'true' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run smoke tests
        run: |
          go test -v -coverprofile=smoke_coverage.out ./internal/tests/smoke/...

  e2e-test:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [changes]
    if: ${{ needs.changes.outputs.code == 'true' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run E2E tests
        run: |
          go test -v -count=1 ./internal/tests/e2e/...

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    needs: [changes]
    if: ${{ needs.changes.outputs.code == 'true' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Checkout pinned Agent source for live Control WebUI E2E
        uses: actions/checkout@v7
        with:
          repository: AnixOps/anix-agent
          ref: 54150d83b6f43d453eec6d818c894c73ebc76dc1
          path: V2bX_AnixOps

      # The live Control WebUI gate builds a temporary Control binary and a
      # deterministic official plugin package before Chromium opens the UI.
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      # Vendored AnixOps Design files must equal the pinned tag
      # (web/src/design/manifest.json); offline, no network needed.
      - name: Check vendored AnixOps Design
        working-directory: web
        run: npm run design:check

      - name: Audit frontend dependencies
        working-directory: web
        run: npm run audit:check

      # ESLint (no native dialogs, no legacy classes, no bare tables on list
      # pages) and stylelint (colour tokens, type and radius scale, no legacy
      # variables); both fail on any finding.
      - name: Lint frontend
        working-directory: web
        run: npm run lint && npm run lint:styles

      - name: Run frontend tests
        working-directory: web
        run: npm test

      - name: Install Playwright Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Run frontend browser E2E gate
        working-directory: web
        run: npm run test:e2e

      - name: Run live Control signed WebUI E2E gate
        working-directory: web
        env:
          ANIXOPS_AGENT_ROOT: ${{ github.workspace }}/V2bX_AnixOps
        run: npx playwright test --config playwright.live-control.config.js

      - name: Build frontend
        working-directory: web
        run: npm run build

      - name: Generate frontend bundle size report
        working-directory: web
        run: npm run bundle:report

      # Performance budget (web/bundle-budget.json, plan §13): first-visit
      # gzip size of the login, user and admin routes and of every lazy chunk.
      - name: Check frontend performance budget
        working-directory: web
        run: npm run bundle:budget

      - name: Upload frontend artifacts
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: web/public/

      - name: Upload frontend bundle size report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: frontend-bundle-size
          path: web/bundle-reports/

  # Visual regression (plan §15): key screens with the API mocked, compared
  # with web/e2e/visual/__screenshots__. It runs in the official Playwright
  # image so fonts and rendering match the baselines, which are made in the
  # same image (`npm run test:visual:update`, web/scripts/visual-docker.sh).
  frontend-visual:
    name: Frontend Visual Regression
    runs-on: ubuntu-latest
    needs: [changes]
    if: ${{ needs.changes.outputs.web == 'true' }}
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble
      options: --ipc=host
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Check the image matches @playwright/test
        working-directory: web
        run: |
          locked=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")
          test "${locked}" = "1.61.1" || { echo "::error::@playwright/test is ${locked}; update the frontend-visual image tag and regenerate the baselines"; exit 1; }

      - name: Compare key screens with the baselines
        working-directory: web
        env:
          HOME: /root
        run: npx playwright test --config playwright.visual.config.js

      - name: Upload visual diffs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-visual-diffs
          path: |
            web/test-results/visual/
            web/playwright-visual-report/

  backend-build:
    name: Backend Build
    runs-on: ubuntu-latest
    needs: [go-quality, go-lint, go-security, backend-test, postgres-stats-test, migration-dry-run-test, postgres-restore-rehearsal, plugin-package-release-test, forward-runtime-test, grpc-test, cross-repository-agent-e2e, cmd-test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Generate Swagger docs
        run: |
          go install github.com/swaggo/swag/cmd/swag@v1.16.6
          $(go env GOPATH)/bin/swag init -g cmd/server/main.go -o docs --parseInternal --exclude control-center,packages

      - name: Build binary
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          BUILD_CODE="${GITHUB_RUN_NUMBER:-0}"
          COMMIT="${GITHUB_SHA::12}"
          CGO_ENABLED=0 GOOS=linux go build \
            -ldflags="-s -w -X main.version=${VERSION} -X main.buildTime=${BUILD_TIME} -X main.buildCode=${BUILD_CODE} -X main.commit=${COMMIT}" \
            -o anix-control ./cmd/server

      - name: Upload backend artifacts
        uses: actions/upload-artifact@v7
        with:
          name: anix-control-binary
          path: anix-control

  release-binaries:
    name: Build Release Binary (${{ matrix.goos }}-${{ matrix.goarch }})
    runs-on: ubuntu-latest
    needs: [go-quality, go-lint, go-security, backend-test, postgres-stats-test, migration-dry-run-test, postgres-restore-rehearsal, plugin-package-release-test, plugin-package-publish, forward-runtime-test, grpc-test, cross-repository-agent-e2e, cmd-test, tag-gate]
    if: ${{ needs.tag-gate.outputs.is_release_tag == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            ext: ''
          - goos: linux
            goarch: arm64
            ext: ''
          - goos: windows
            goarch: amd64
            ext: '.exe'
          - goos: windows
            goarch: arm64
            ext: '.exe'
          - goos: darwin
            goarch: amd64
            ext: ''
          - goos: darwin
            goarch: arm64
            ext: ''
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build binary
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          BUILD_CODE="${GITHUB_RUN_NUMBER:-0}"
          COMMIT="${GITHUB_SHA::12}"
          PRIMARY_BIN_NAME="anix-control-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}"

          CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
            go build -ldflags="-s -w -X main.version=${VERSION} -X main.buildTime=${BUILD_TIME} -X main.buildCode=${BUILD_CODE} -X main.commit=${COMMIT}" \
            -o "${PRIMARY_BIN_NAME}" ./cmd/server

          mkdir -p dist
          if [[ "${{ matrix.goos }}" == "windows" ]]; then
            zip -j "dist/${PRIMARY_BIN_NAME}.zip" "${PRIMARY_BIN_NAME}"
          else
            tar -czf "dist/${PRIMARY_BIN_NAME}.tar.gz" "${PRIMARY_BIN_NAME}"
          fi

      - name: Upload release binary artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-binary-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*

  docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [frontend-build, release-binaries, plugin-package-publish, tag-gate]
    if: ${{ needs.tag-gate.outputs.is_release_tag == 'true' }}
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      IMAGE: ghcr.io/anixops/anix-control
      PLATFORMS: linux/amd64,linux/arm64
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Download Linux release binaries
        uses: actions/download-artifact@v8
        with:
          pattern: release-binary-linux-*
          path: release-artifacts
          merge-multiple: true

      - name: Download frontend artifacts
        uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: image-artifacts/web/public/

      - name: Download signed package releases
        uses: actions/download-artifact@v8
        with:
          name: signed-plugin-releases
          path: release-packages

      - name: Assemble the release image build context
        shell: bash
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            tar -xzf "release-artifacts/anix-control-linux-${arch}.tar.gz" -C image-artifacts
            test -x "image-artifacts/anix-control-linux-${arch}"
          done
          mkdir -p image-artifacts/bootstrap/identity-platform
          for suffix in anxp manifest.json manifest.sig; do
            mapfile -t matches < <(find release-packages -type f -name "identity-platform-*.${suffix}")
            test "${#matches[@]}" = 1 || { echo "expected one identity-platform .${suffix}, found ${#matches[@]}"; exit 1; }
            install -m 0644 "${matches[0]}" image-artifacts/bootstrap/identity-platform/
          done
          # The release signature of the embedded Agent installer, served
          # at /install.sh.sig.
          mkdir -p image-artifacts/bootstrap/agent-install
          for name in agent-install.sh agent-install.sh.sig; do
            mapfile -t matches < <(find release-packages -type f -name "${name}")
            test "${#matches[@]}" = 1 || { echo "expected one ${name}, found ${#matches[@]}"; exit 1; }
            if [[ "${name}" == agent-install.sh ]]; then
              cmp "${matches[0]}" internal/agentinstall/install.sh
            else
              install -m 0644 "${matches[0]}" image-artifacts/bootstrap/agent-install/
            fi
          done
          ls -lR image-artifacts/bootstrap

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          flavor: |
            latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=long

      - name: Compute build metadata
        id: build_meta
        shell: bash
        run: |
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          echo "build_code=${GITHUB_RUN_NUMBER:-0}" >> "$GITHUB_OUTPUT"
          echo "commit=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          target: release
          build-contexts: |
            artifacts=./image-artifacts
          platforms: ${{ env.PLATFORMS }}
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.build_meta.outputs.version }}
            BUILD_TIME=${{ steps.build_meta.outputs.build_time }}
            BUILD_CODE=${{ steps.build_meta.outputs.build_code }}
            COMMIT=${{ steps.build_meta.outputs.commit }}
          # The runtime-base layers (apt packages for both architectures) come
          # from the go_dev edge build; a cache written from a tag ref would
          # only be readable by that same tag, so the release does not export
          # one.
          cache-from: type=gha,scope=docker-edge

      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.2

      - name: Sign the image digest
        shell: bash
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Save docker release metadata
        shell: bash
        run: |
          mkdir -p release
          {
            echo "published=true"
            echo "primary_image=${IMAGE}:${GITHUB_REF_NAME#v}"
            echo "digest=${{ steps.build.outputs.digest }}"
            echo "platforms=${PLATFORMS}"
            echo "signature=cosign keyless (GitHub Actions OIDC, ${GITHUB_REPOSITORY})"
            echo "tags:"
            echo "${{ steps.meta.outputs.tags }}"
          } > release/docker-image.txt

      - name: Upload docker metadata artifact
        uses: actions/upload-artifact@v7
        with:
          name: docker-metadata
          path: release/docker-image.txt

  docker-edge:
    name: Publish Edge Docker Image
    runs-on: ubuntu-latest
    needs: [docker-smoke, go-quality, go-security, backend-test, frontend-build]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/go_dev' }}
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      IMAGE: ghcr.io/anixops/anix-control
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push edge image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          target: source
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          tags: |
            ${{ env.IMAGE }}:edge
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          build-args: |
            VERSION=edge
            BUILD_TIME=${{ github.event.head_commit.timestamp }}
            BUILD_CODE=${{ github.run_number }}
            COMMIT=${{ github.sha }}
          cache-from: |
            type=gha,scope=docker-edge
            type=gha,scope=docker-smoke
          cache-to: type=gha,scope=docker-edge,mode=max

      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.2

      - name: Sign the edge image digest
        shell: bash
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Read the identity-platform package version
        id: identity
        shell: bash
        run: echo "version=$(jq -r .version packages/identity-platform/manifest.template.json)" >> "${GITHUB_OUTPUT}"

      # The network module image (Dockerfile.module); see
      # docs/architecture/module-runtime.md.
      - name: Build and push the edge identity-platform module image
        id: identity-image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.module
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          tags: |
            ghcr.io/anixops/anix-module-identity-platform:edge
            ghcr.io/anixops/anix-module-identity-platform:sha-${{ github.sha }}
          build-args: |
            PACKAGE_ID=identity-platform
            PACKAGE_VERSION=${{ steps.identity.outputs.version }}
          cache-from: |
            type=gha,scope=module-edge
            type=gha,scope=module-image
          cache-to: type=gha,scope=module-edge,mode=max

      - name: Sign the edge module image digest
        shell: bash
        env:
          DIGEST: ${{ steps.identity-image.outputs.digest }}
        run: cosign sign --yes "ghcr.io/anixops/anix-module-identity-platform@${DIGEST}"

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [frontend-build, release-binaries, docker, plugin-package-publish, tag-gate]
    if: ${{ needs.tag-gate.outputs.is_release_tag == 'true' }}
    permissions:
      actions: read
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Prepare release directory
        run: mkdir -p release

      - name: Generate source SBOM
        uses: anchore/sbom-action@v0.24.0
        with:
          path: .
          format: spdx-json
          artifact-name: anix-control-source-sbom
          output-file: release/anix-control-source.sbom.spdx.json
          upload-release-assets: false

      - name: Download multi-platform binary artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: release-binary-*
          merge-multiple: true
          path: release/

      - name: Download frontend artifact
        uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: web/public/

      - name: Download docker metadata artifact
        uses: actions/download-artifact@v8
        with:
          name: docker-metadata
          path: release/

      - name: Download signed plugin packages
        uses: actions/download-artifact@v8
        with:
          name: signed-plugin-releases
          path: release/

      - name: Create release archives
        run: |
          tar -czvf release/anix-control-frontend.tar.gz -C web/public .

      # The GitHub Release body is the tag's CHANGELOG section.
      - name: Generate release notes file
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 config/scripts/generate_release_notes.py \
            --changelog CHANGELOG.md \
            --output release/RELEASE_NOTES.md \
            --tag "${GITHUB_REF_NAME}" \
            --commit "${GITHUB_SHA}" \
            --run-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          {
            echo
            echo "## Container Image"
            echo
            echo '```'
            cat release/docker-image.txt
            echo '```'
          } >> release/RELEASE_NOTES.md

      - name: Generate release manifest
        shell: bash
        run: |
          python3 config/scripts/generate_release_manifest.py \
            --release-dir release \
            --output release/RELEASE_MANIFEST.json \
            --project anix-control \
            --build-source github-actions \
            --manual-deployment-required true

      - name: Create release checksums
        run: |
          (cd release && sha256sum * > SHA256SUMS.txt)

      - name: Verify release artifacts
        shell: bash
        run: |
          set -Eeuo pipefail
          version="${GITHUB_REF_NAME#v}"
          # Every package, its manifest, signature and SBOM is inside the
          # signed packages archive; verify it against the shipped root.
          python3 packages/shared/build_package.py \
            --all \
            --version "${version}" \
            --verify-release-archive "release/anix-control-packages-${version}.tar.gz" \
            --official-public-key release/official-public-key.raw
          # scripts/install.sh downloads the binaries, the frontend, the
          # checksums and the identity bootstrap package by these names.
          python3 config/scripts/verify_release_artifacts.py \
            --release-dir release \
            --manifest release/RELEASE_MANIFEST.json \
            --checksums release/SHA256SUMS.txt \
            --require "anix-control-packages-${version}.tar.gz" \
            --require "anix-control-packages-${version}.tar.gz.sig" \
            --require "identity-platform-${version}.anxp" \
            --require "identity-platform-${version}.manifest.json" \
            --require "identity-platform-${version}.manifest.sig" \
            --require official-public-key.raw \
            --require agent-install.sh \
            --require agent-install.sh.sig \
            --require RELEASE_NOTES.md \
            --require RELEASE_MANIFEST.json \
            --require SHA256SUMS.txt \
            --require docker-image.txt \
            --require anix-control-source.sbom.spdx.json \
            --require anix-control-frontend.tar.gz \
            --require anix-control-linux-amd64.tar.gz \
            --require anix-control-linux-arm64.tar.gz \
            --require anix-control-windows-amd64.exe.zip \
            --require anix-control-windows-arm64.exe.zip \
            --require anix-control-darwin-amd64.tar.gz \
            --require anix-control-darwin-arm64.tar.gz
          # Nothing else is published: one archive replaces the per-package assets.
          unexpected="$(find release -maxdepth 1 -type f \( -name '*.anxp' -o -name '*.public-key.pem' -o -name '*.sbom.spdx.json' -o -name 'anix-control-frontend.zip' \) \
            ! -name "identity-platform-${version}.anxp" ! -name anix-control-source.sbom.spdx.json)"
          [[ -z "${unexpected}" ]] || { echo "unexpected release assets:" >&2; echo "${unexpected}" >&2; exit 1; }
          echo "release assets: $(find release -maxdepth 1 -type f | wc -l)"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: release/*
          body_path: release/RELEASE_NOTES.md
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ !contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
