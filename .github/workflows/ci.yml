name: CI/CD Pipeline

on:
  push:
    branches: [ go_dev, production ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ go_dev, production ]
  workflow_dispatch:

env:
  GO_VERSION: '1.25'
  NODE_VERSION: '20'

jobs:
  tag-gate:
    name: Validate Release Tag
    runs-on: ubuntu-latest
    outputs:
      is_release_tag: ${{ steps.check.outputs.is_release_tag }}
    steps:
      - name: Check if tag matches v.X.Y.Z
        id: check
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "push" && "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "is_release_tag=true" >> "$GITHUB_OUTPUT"
            echo "Release tag accepted: ${GITHUB_REF_NAME}"
          else
            echo "is_release_tag=false" >> "$GITHUB_OUTPUT"
            echo "Not a strict release tag, skip release-only jobs."
          fi

  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ env.GO_VERSION }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-${{ env.GO_VERSION }}-

      - name: Download dependencies
        run: go mod download

      - name: Verify dependencies
        run: go mod verify

      - name: Generate Swagger docs
        run: |
          go install github.com/swaggo/swag/cmd/swag@latest
          $(go env GOPATH)/bin/swag init -g cmd/server/main.go -o docs --parseInternal

      - name: Run go vet
        run: go vet ./...

      - name: Run tests with coverage
        run: |
          go test -v -coverprofile=coverage.out -covermode=atomic ./internal/...

      - name: Generate coverage report
        run: |
          go tool cover -func=coverage.out > coverage.txt
          echo "## Coverage Report" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          cat coverage.txt >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage.out
            coverage.txt

  grpc-test:
    name: gRPC Core Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Run gRPC tests
        run: |
          go test -v -coverprofile=grpc_coverage.out ./internal/grpc/...

      - name: Check gRPC coverage (80%+)
        run: |
          COVERAGE=$(go tool cover -func=grpc_coverage.out | grep total | awk '{print $3}' | sed 's/%//')
          echo "gRPC coverage: ${COVERAGE}%"
          if [ $(echo "$COVERAGE < 80" | bc -l) -eq 1 ]; then
            echo "::error::gRPC coverage ${COVERAGE}% is below minimum 80%"
            exit 1
          fi
          echo "gRPC coverage check passed: ${COVERAGE}%"

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Build frontend
        working-directory: web
        run: npm run build

      - name: Upload frontend artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: web/public/

  backend-build:
    name: Backend Build
    runs-on: ubuntu-latest
    needs: [backend-test, grpc-test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Generate Swagger docs
        run: |
          go install github.com/swaggo/swag/cmd/swag@latest
          $(go env GOPATH)/bin/swag init -g cmd/server/main.go -o docs --parseInternal

      - name: Build binary
        run: |
          VERSION=${{ github.ref_name }}
          BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          CGO_ENABLED=0 GOOS=linux go build -ldflags="-s -w -X main.version=${VERSION} -X main.buildTime=${BUILD_TIME}" -o v2board ./cmd/server

      - name: Upload backend artifacts
        uses: actions/upload-artifact@v4
        with:
          name: v2board-binary
          path: v2board

  release-binaries:
    name: Build Release Binary (${{ matrix.goos }}-${{ matrix.goarch }})
    runs-on: ubuntu-latest
    needs: [backend-test, grpc-test, tag-gate]
    if: ${{ needs.tag-gate.outputs.is_release_tag == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            ext: ''
          - goos: linux
            goarch: arm64
            ext: ''
          - goos: windows
            goarch: amd64
            ext: '.exe'
          - goos: windows
            goarch: arm64
            ext: '.exe'
          - goos: darwin
            goarch: amd64
            ext: ''
          - goos: darwin
            goarch: arm64
            ext: ''
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build binary
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME}"
          BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          BIN_NAME="v2board-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}"

          CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
            go build -ldflags="-s -w -X main.version=${VERSION} -X main.buildTime=${BUILD_TIME}" \
            -o "${BIN_NAME}" ./cmd/server

          mkdir -p dist
          if [[ "${{ matrix.goos }}" == "windows" ]]; then
            zip -j "dist/${BIN_NAME}.zip" "${BIN_NAME}"
          else
            tar -czf "dist/${BIN_NAME}.tar.gz" "${BIN_NAME}"
          fi

      - name: Upload release binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-binary-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*

  docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [backend-build, frontend-build, tag-gate]
    if: ${{ needs.tag-gate.outputs.is_release_tag == 'true' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download frontend artifacts
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: web/public/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/v2board
          tags: |
            type=raw,value=${{ github.ref_name }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Save docker release metadata
        shell: bash
        run: |
          mkdir -p release
          {
            echo "image=${{ secrets.DOCKER_USERNAME }}/v2board:${GITHUB_REF_NAME}"
            echo "digest=${{ steps.build.outputs.digest }}"
            echo "tags:"
            echo "${{ steps.meta.outputs.tags }}"
          } > release/docker-image.txt

      - name: Upload docker metadata artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-metadata
          path: release/docker-image.txt

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [frontend-build, release-binaries, docker, tag-gate]
    if: ${{ needs.tag-gate.outputs.is_release_tag == 'true' }}
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download multi-platform binary artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-binary-*
          merge-multiple: true
          path: release/

      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: web/public/

      - name: Download docker metadata artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-metadata
          path: release/

      - name: Create release archives
        run: |
          tar -czvf release/v2board-frontend.tar.gz -C web/public .
          zip -r release/v2board-frontend.zip web/public
          (cd release && sha256sum * > SHA256SUMS.txt)

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: release/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [docker, release, tag-gate]
    if: ${{ needs.tag-gate.outputs.is_release_tag == 'true' }}
    environment:
      name: production
      url: https://panel.example.com
    steps:
      - name: Deploy to server
        run: |
          echo "Deploying release ${GITHUB_REF_NAME} to production server..."
          # Add real deployment script here.

      - name: Health check
        run: |
          echo "Running health check..."
          # curl -f https://panel.example.com/health || exit 1

      - name: Notify deployment
        run: |
          echo "Deployment completed successfully"
