name: JumpServer

# Runs scripts/jumpserver/jms.py against the JumpServer that manages the node
# fleet, with the production environment's JMS_KEY_ID and JMS_SECRET secrets
# and its JMS_URL variable (docs/guide/jumpserver.md). Manual runs only. The
# repository is public and so are these logs: host addresses and names are masked and a
# run's per-host output is printed only when show_output is set.

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'check: test the key; hosts: list the hosts; run: run a shell command through Ansible; control: call a Control admin API; install-agent: enroll a node''s Agent on one host'
        required: true
        type: choice
        options:
          - check
          - hosts
          - run
          - control
          - install-agent
        default: check
      command:
        description: 'Shell command for run'
        required: false
        type: string
        default: 'uptime'
      hosts:
        description: 'Host names or addresses for run, comma-separated; empty means every active host'
        required: false
        type: string
        default: ''
      runas:
        description: 'Account to run as'
        required: false
        type: string
        default: 'root'
      node:
        description: 'Control node for install-agent, e.g. proxy-29'
        required: false
        type: string
        default: ''
      api_method:
        description: 'HTTP method for control'
        required: false
        type: choice
        options:
          - GET
          - POST
          - PUT
          - DELETE
        default: GET
      api_path:
        description: 'Admin API path for control, e.g. /api/v2/admin/nodes'
        required: false
        type: string
        default: ''
      api_body:
        description: 'JSON body for control; @@NEW_REALITY_KEY@@ and @@NEW_SS2022_KEY_16@@/_32@@ are generated'
        required: false
        type: string
        default: ''
      show_output:
        description: 'Print each host''s output for run. The repository is public, so the log is too'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: jumpserver
  cancel-in-progress: false

jobs:
  jumpserver:
    name: JumpServer ${{ inputs.action }}
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install client dependencies
        run: python -m pip install --disable-pip-version-check requests==2.32.3 websocket-client==1.8.0

      - name: Run jms.py ${{ inputs.action }}
        env:
          JMS_URL: ${{ vars.JMS_URL }}
          JMS_KEY_ID: ${{ secrets.JMS_KEY_ID }}
          JMS_SECRET: ${{ secrets.JMS_SECRET }}
          # Filled into a command's @@CLOUDFLARE_API_TOKEN@@ by jms.py.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # Control and its admin API token for control and install-agent.
          CONTROL_URL: ${{ vars.CONTROL_URL || 'https://new-x.kalijerry.uk' }}
          CONTROL_ADMIN_TOKEN: ${{ secrets.CONTROL_ADMIN_TOKEN }}
          ACTION: ${{ inputs.action }}
          COMMAND: ${{ inputs.command }}
          HOSTS: ${{ inputs.hosts }}
          RUNAS: ${{ inputs.runas }}
          SHOW_OUTPUT: ${{ inputs.show_output }}
          NODE: ${{ inputs.node }}
          API_METHOD: ${{ inputs.api_method }}
          API_PATH: ${{ inputs.api_path }}
          API_BODY: ${{ inputs.api_body }}
        run: |
          show=()
          if [ "$SHOW_OUTPUT" = true ]; then show=(--show-output); fi
          if [ "$ACTION" = run ]; then
            python scripts/jumpserver/jms.py run --cmd "$COMMAND" --hosts "$HOSTS" --runas "$RUNAS" "${show[@]}"
          elif [ "$ACTION" = control ]; then
            python scripts/jumpserver/jms.py control --method "$API_METHOD" --path "$API_PATH" --body "$API_BODY"
          elif [ "$ACTION" = install-agent ]; then
            python scripts/jumpserver/jms.py install-agent --hosts "$HOSTS" --node "$NODE" --runas "$RUNAS" "${show[@]}"
          else
            python scripts/jumpserver/jms.py "$ACTION"
          fi
