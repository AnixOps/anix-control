name: JumpServer

# Runs scripts/jumpserver/jms.py against the JumpServer that manages the node
# fleet, with the production environment's JMS_KEY_ID and JMS_SECRET secrets
# and its JMS_URL variable (docs/guide/jumpserver.md). Manual runs only.

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'check: test the key; hosts: list the hosts; run: run a shell command through Ansible'
        required: true
        type: choice
        options:
          - check
          - hosts
          - run
        default: check
      command:
        description: 'Shell command for run'
        required: false
        type: string
        default: 'uptime'
      hosts:
        description: 'Host names or addresses for run, comma-separated; empty means every active host'
        required: false
        type: string
        default: ''
      runas:
        description: 'Account to run as'
        required: false
        type: string
        default: 'root'

permissions:
  contents: read

concurrency:
  group: jumpserver
  cancel-in-progress: false

jobs:
  jumpserver:
    name: JumpServer ${{ inputs.action }}
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install client dependencies
        run: python -m pip install --disable-pip-version-check requests==2.32.3 httpsig==1.3.0

      - name: Run jms.py ${{ inputs.action }}
        env:
          JMS_URL: ${{ vars.JMS_URL }}
          JMS_KEY_ID: ${{ secrets.JMS_KEY_ID }}
          JMS_SECRET: ${{ secrets.JMS_SECRET }}
          ACTION: ${{ inputs.action }}
          COMMAND: ${{ inputs.command }}
          HOSTS: ${{ inputs.hosts }}
          RUNAS: ${{ inputs.runas }}
        run: |
          if [ "$ACTION" = run ]; then
            python scripts/jumpserver/jms.py run --cmd "$COMMAND" --hosts "$HOSTS" --runas "$RUNAS"
          else
            python scripts/jumpserver/jms.py "$ACTION"
          fi
