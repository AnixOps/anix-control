name: Nightly Security

# The pull-request pipeline checks the code a change touches; advisories are
# published against code nobody touched. This workflow runs the same security
# tools every night against main, so a new advisory shows up the next
# morning instead of failing an unrelated pull request. Every job fails the run on a finding.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-security
  cancel-in-progress: false

env:
  GO_VERSION: '1.26.10'
  NODE_VERSION: '22'

jobs:
  govulncheck:
    name: govulncheck (${{ matrix.module }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        module: [".", "sdk", "identity"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: ${{ matrix.module }}/go.sum

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.8.0

      - name: Run govulncheck
        working-directory: ${{ matrix.module }}
        run: govulncheck ./...

  gosec:
    name: gosec
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@v2.29.0

      - name: Run production gosec gate
        shell: bash
        run: |
          mapfile -t production_packages < <(
            go list -f '{{.Dir}}' ./cmd/server ./internal/... \
              | sed "s#^${PWD}#.#" \
              | grep -Ev '^\./internal/tests(/|$)' \
              | sort
          )
          gosec -exclude-generated -nosec-require-rules -nosec-require-justification -quiet "${production_packages[@]}"

      - name: Run the sdk and identity gosec gates
        run: |
          (cd sdk && gosec -exclude-generated -nosec-require-rules -nosec-require-justification -quiet ./...)
          (cd identity && gosec -exclude-generated -nosec-require-rules -nosec-require-justification -quiet ./...)

  npm-audit:
    name: npm audit (web)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci --ignore-scripts

      # The pull-request pipeline audits only shipped dependencies
      # (npm audit --omit=dev). This is the one place the development tools
      # are audited: advisories waived in web/audit-allowlist.json pass until
      # their expiry date, an expired, unused or new one fails this run.
      - name: Audit shipped and development dependencies
        working-directory: web
        run: npm run audit:check

