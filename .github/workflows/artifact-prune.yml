name: Artifact prune

# Actions artifact storage is a shared quota across the AnixOps organization;
# when it fills up, every repository's upload-artifact step fails. Uploads in
# this repo now set retention-days, and this job deletes whatever is still
# older than the window (artifacts uploaded before retention was shortened).
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      older_than_days:
        description: "Delete artifacts created more than N days ago"
        default: "3"

permissions:
  actions: write

concurrency:
  group: artifact-prune
  cancel-in-progress: false

jobs:
  prune:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Delete old artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DAYS: ${{ inputs.older_than_days || '3' }}
        run: |
          set -euo pipefail
          cutoff=$(date -u -d "-${DAYS} days" +%Y-%m-%dT%H:%M:%SZ)
          echo "Deleting artifacts created before ${cutoff}"
          gh api --paginate "repos/${REPO}/actions/artifacts?per_page=100" \
            --jq ".artifacts[] | select(.expired | not) | select(.created_at < \"${cutoff}\") | [.id, .size_in_bytes] | @tsv" \
            > old.tsv
          count=$(wc -l < old.tsv)
          bytes=$(awk '{s+=$2} END {print s+0}' old.tsv)
          echo "Found ${count} artifacts, ${bytes} bytes"
          # An artifact can expire or be deleted between listing and deleting
          # (404), and a large backlog can exhaust the hourly API budget; skip
          # those and let the next daily run pick up what is left.
          cut -f1 old.tsv | xargs -r -P 8 -I{} sh -c \
            'gh api -X DELETE "repos/${REPO}/actions/artifacts/$1" --silent || echo "skip $1"' _ {} > delete.log 2>&1
          skipped=$(grep -c '^skip ' delete.log || true)
          count=$((count - skipped))
          echo "### Artifact prune" >> "$GITHUB_STEP_SUMMARY"
          echo "Deleted ${count} artifacts older than ${DAYS} days, ${skipped} skipped (listed size $(numfmt --to=iec "${bytes}"))." >> "$GITHUB_STEP_SUMMARY"
